- id: industry
  name: Industry and infrastructure
  subfields: [Transport, Building, Making things, Everyday technology]

- id: instruments
  name: Instruments and big science
  subfields: [Big projects, Seeing and measuring]

- id: safety
  name: Safety, forecasting and resilience
  subfields: [Seeing it coming, Fewer deaths and failures]

- id: knowledge
  name: Knowledge, the past and science itself
  subfields: [The past, Open knowledge, How science is working]

- id: cost
  name: The cost of capability
  subfields: [Cost curves]

- id: development
