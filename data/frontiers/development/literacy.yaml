# Observations are the world's adult literacy rate, the share of people aged 15 and over who can read and write a short
# simple statement, for 1975 to 2024. They are the World rows of Our World in Data's grapher CSV (literacy-rate-adults,
# OWID_WRL), opened 2026-11-09, which republishes UNESCO Institute for Statistics data. Values are stored as the source gives them.
id: literacy
title: Adult literacy
domain: development
subfield: Human development
status: draft
summary: The share of adults who can read and write, a basic skill that shapes access to work, health information and
  schooling for the next generation. It has risen steadily for half a century and is one of the clearest long-run
  measures of human development.
metric:
  name: Adult literacy rate (aged 15 and over), world
  unit: '%'
  direction: higher
  scale: linear
  explainer: 'Literacy is measured by asking people whether they can read and write a short, simple sentence about their
    everyday life, or by using census and survey answers when no test is given. National figures are combined into a world
    figure weighted by the adult population of each country. Many countries report literacy from self-declared answers,
    so the measure can differ from test-based results. Because it is a share of adults, the rate moves slowly: most of the
    gain comes from new generations who attend school, not from the older population changing.'
chart:
  primary: coverage-meter
series:
- id: world
  label: World
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'UNESCO publishes literacy estimates irregularly, and the OWID page was last updated on 12 May 2026. To update, run
    the literacy fetcher, which adds new years and reports any revised earlier year. Open for the owner: the UNESCO
    Institute for Statistics terms of use were not opened, so the licence for copying these values is unconfirmed. The
    World 2024 value was read from the CSV, not the interactive page.'
sources:
- id: owid-literacy-rate-adults
  name: 'Our World in Data, adult literacy rate (World), from UNESCO Institute for Statistics'
  url: https://ourworldindata.org/grapher/literacy-rate-adults
  kind: dataset
  primary: true
  notes: 'Page and CSV (World rows, OWID_WRL) opened 2026-11-09. The page gives the citation "UNESCO Institute for Statistics
    (2026) – with minor processing by Our World in Data". OWID''s own work is CC BY 4.0; it says third-party data remains
    subject to the provider''s licence terms. The UNESCO terms were not checked. The CSV was read through WebFetch, so the
    seeded values are checked by the fetcher dry run.'
events:
- date: '1998'
  kind: milestone
  title: World adult literacy passes 80 percent in 1998
  why_it_matters: The share of adults who can read and write crossed four in five people, after a long, steady climb from about two thirds in the mid-1970s.
  url: https://ourworldindata.org/grapher/literacy-rate-adults
- date: '2024'
  kind: milestone
  title: The 2024 world adult literacy rate reaches 87.7 percent
  why_it_matters: The latest value is the highest in the series, though the yearly gains have slowed since the 1990s.
  url: https://ourworldindata.org/grapher/literacy-rate-adults
