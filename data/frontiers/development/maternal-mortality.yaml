# Maternal mortality: World maternal mortality ratio from Our World in Data's export of the UN MMEIG estimates.
# observations are rewritten by scripts/fetchers/maternal_mortality.py; do not edit them by hand.
id: maternal-mortality
title: Maternal mortality
domain: development
subfield: Human development
status: draft
summary: How many women die in pregnancy or childbirth for every 100 000 births, worldwide, and whether that rate
  is falling fast enough.
metric:
  name: Maternal deaths per 100 000 live births, worldwide
  unit: deaths per 100 000 live births
  direction: lower
  scale: linear
  explainer: 'A maternal death is the death of a woman while pregnant or within 42 days of the end of pregnancy, from
    any cause related to or made worse by the pregnancy. The ratio divides those deaths by live births, which
    makes countries and years comparable. Most of these deaths are preventable with skilled care at birth and care
    after it. The figures are modelled estimates because few countries record every death, so the UN agencies publish
    a central figure and revise past years when new data arrive. Compare years from the same release.'
chart:
  primary: race-to-zero
series:
- id: world
  label: World maternal mortality ratio
