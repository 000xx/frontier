# Records are transcribed by hand from the papers and pages listed under sources; each value was read in this run.
# Two series: materials measured at ordinary (ambient) pressure, and materials squeezed in a diamond anvil cell.
# Retracted claims are kept and marked retracted so the history of the field stays visible.
id: superconductor-tc
title: Highest-temperature superconductor
domain: chemistry
subfield: Record properties
status: live
summary: The highest temperature at which a material has been shown to carry electricity with zero resistance,
  at ordinary pressure and under crushing pressure. The ambient-pressure record stood at copper oxides for over
  30 years; hydrogen-rich compounds under pressure have reached near room temperature, alongside two high-profile
  claims that were retracted.
metric:
  name: Highest superconducting transition temperature (Tc)
  unit: kelvin
  direction: higher
  scale: linear
  explainer: 'A superconductor carries electric current with no resistance at all, and pushes magnetic fields
    out of itself, but only below a critical temperature, Tc. Every superconductor known today has to be cooled
    to work, which is why a room-temperature superconductor would be so
    valuable: power lines without losses, cheaper magnets and new electronics. Temperatures here are in kelvin,
    where 0 K is absolute zero, 77 K is the boiling point of liquid nitrogen and room temperature is about 293 K.
    There are two very different routes to a higher Tc. Copper-oxide ceramics (cuprates), found from 1986
    onward, work at ordinary pressure and above the temperature of liquid nitrogen, which made them practical.
    Hydrogen-rich compounds (hydrides) reach much higher Tc, but only while squeezed between two diamonds to
    more than a million times atmospheric pressure, in tiny samples; they are records
    of physics, not usable materials. The two routes are shown as separate series. Claims in this field need
    care. A drop in resistance alone is weak evidence; the strongest papers also show the expected response to
    a magnetic field, and confirmation by another lab matters most. Two claims of room-temperature
    superconductivity published in Nature in 2020 and 2023 were later retracted and are shown as such.'
chart:
  primary: record-chart
  secondary:
  - claim-scoreboard
series:
- id: ambient-pressure
  label: At ambient pressure
- id: high-pressure
  label: Under high pressure
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Coverage starts in 1986; earlier records (metals and alloys) are not yet added, and the bismuth cuprate
    step of 1988 is missing because no dated source was read for it. Open points for the owner: (1) the 2026 value
    of 151 K was measured at ambient pressure on a sample first squeezed and then released ("pressure quench").
    The paper calls it the ambient-pressure record and it is placed in that series, but it is a metastable
    state made by pressure, not a material made normally; decide whether it needs its own series. No
    independent replication was found. (2) The 1993 mercury cuprate is given as about 133 K in the Nature
    abstract and 134 K elsewhere in the Chu-Deng-Lv review; 133 K is used, matching the 2026 coverage of the
    previous record. (3) The 1986 value is 35 K from the review; the original abstract says only that onsets
    were in the 30 K range. (4) For lanthanum hydride, Somayazulu et al. (August 2018, 260 K resistance onset at
    190 GPa) and Drozdov et al. (December 2018, 250 K at 170 GPa) are independent groups reporting the same
    compound; both are kept as peer_reviewed. (5) The La-Sc-H result (onset 271-298 K at 195-266 GPa) is a
    preprint, so claimed. Its group published a theory follow-up in Phys. Rev. B in September 2026, and an
    attempt by another group to make the compound (arXiv:2605.29985) did not succeed. (6) The two Dias papers
    gave their temperatures as 59 °F (2020) and 21 °C (2023); these are converted to 288 K and 294 K.'
