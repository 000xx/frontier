events:
- date: '2015-06-26'
  kind: paper
  title: Sulfur hydride superconducts at 203 K under pressure
  why_it_matters: It broke the cuprates' long hold on the record and showed that hydrogen-rich compounds could
    reach far higher temperatures.
  url: https://arxiv.org/abs/1506.08190
- date: '2022-09-26'
  kind: retraction
  title: Nature retracts the 2020 room-temperature superconductor paper
  why_it_matters: The first claim of superconductivity at room temperature fell over how its data were
    processed, which made the field much more cautious about hydride claims.
  url: https://phys.org/news/2022-09-paper-team-superconductivity-room-temperature.html
- date: '2023-11-07'
  kind: retraction
  title: Nature retracts the lutetium hydride near-ambient superconductivity paper
  why_it_matters: A second room-temperature claim from the same group, this time at only modest pressure, was
    withdrawn after concerns about its resistance data.
  url: https://www.nature.com/articles/s41586-023-06774-2
- date: '2026-03-09'
  kind: paper
  title: Pressure-quenched mercury cuprate keeps 151 K superconductivity at ambient pressure
  why_it_matters: It is the first rise in the ambient-pressure record since 1993, made by locking in a state
    that normally exists only under pressure.
  url: https://arxiv.org/abs/2603.12437
- date: '2026-05-28'
  kind: setback
  title: Another group fails to make the La-Sc-H room-temperature superconductor
  why_it_matters: The 298 K claim has not yet been reproduced elsewhere, which is what would move it from
    claimed to confirmed.
  url: https://papers.cool/arxiv/2605.29985
