# Observations are the three discovery counts printed on NASA's near-Earth asteroid page (science.nasa.gov), all dated
# 3 December 2025 by that page. No fetcher: the NASA CNEOS statistics page could not be opened in this run.
id: near-earth-asteroids
title: Known near-Earth asteroids
domain: safety
subfield: Seeing it coming
status: draft
summary: How many asteroids that pass near Earth have been found, in total and in the largest size classes that
  could cause regional or global damage. Finding them is the first step in planetary defence.
metric:
  name: Discovered near-Earth asteroids
  unit: asteroids
  direction: higher
  scale: linear
  explainer: 'A near-Earth asteroid is a small body whose orbit brings it close to the Earth''s orbit. Astronomers
    count the ones they have found, and sort them by size, because the size of an asteroid governs how much
    damage it could do if it struck. The NASA page reports two size classes, objects larger than 140 metres and
    objects larger than 1 kilometre, alongside the total of all sizes. Finding an asteroid is not the same as
    knowing its path, and the counts do not show how many remain undiscovered. The page gives separate estimates
    of the remaining population, so read the discovered count together with those estimates.'
chart:
  primary: coverage-meter
series:
- id: all-sizes
  label: All sizes
- id: larger-than-140-m
  label: Larger than 140 m
- id: larger-than-1-km
  label: Larger than 1 km
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Only one dated snapshot was read, from the NASA page of 15 April 2026 whose infographic reflects data as of
    3 December 2025. The page gives remaining-to-find estimates of about 50 asteroids larger than 1 km and about
    14,000 larger than 140 m; these are not stored because they are estimates. The NASA CNEOS discovery statistics
    page (https://cneos.jpl.nasa.gov/stats/totals.html) is the preferred primary source, but it could not be opened in
    this run, so its figures are not verified against this page. Add time series from it, or from the monthly updates,
    before the status is set to live.'
