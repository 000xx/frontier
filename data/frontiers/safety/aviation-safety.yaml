id: aviation-safety
title: Aviation safety
domain: safety
subfield: Fewer deaths and failures
status: live
summary: How often commercial airliners have fatal accidents, measured per million flights. It shows whether flying has
  become safer as traffic has grown.
metric:
  name: Fatal airliner accidents per million commercial flights
  unit: accidents per million flights
  direction: lower
  scale: linear
  explainer: 'The rate divides the number of fatal accidents involving commercial airliners (aircraft with more than 14
    seats, passenger or cargo) by the number of worldwide departures, then multiplies by one million. Dividing by
    flights keeps the measure fair when traffic grows: a rising count of accidents could still mean a falling risk per
    trip. The series excludes corporate jets and military transport. Hijackings with fatalities are counted with the
    airliner accidents. Because one accident can be rare, a single year can swing, so read the long trend rather
    than one point.'
chart:
  primary: race-to-zero
  secondary:
  - record-chart
sources:
- id: owid-aviation-safety
  name: Our World in Data, fatal airliner accidents per million commercial flights (Aviation Safety Network and ICAO, via World Bank)
  url: https://ourworldindata.org/grapher/fatal-airliner-accidents-per-million-flights
  kind: dataset
  primary: true
  notes: 'Chart page opened 2026-11-10. It names the Aviation Safety Network (2024) and ICAO via the World Bank (2026)
    as sources, and states that Our World in Data''s work is CC BY while third-party data is subject to the providers''
    licence terms. The Aviation Safety Network''s own terms could not be checked in this run: its page was blocked to
    the agent. Owner to confirm the ASN terms before the series is treated as cleared. The CSV is read by the fetcher
    (scripts/fetchers/aviation_safety.py). The series has no value for 1972 in this copy.'
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'The source publishes this series with its annual update. The fetcher reads the OWID CSV and changes only years
    it can match. Deaths per year, a count of fatal accidents and the passenger-departures denominator are not in this
    frontier yet: they need a source whose terms are confirmed before they are added.'
events:
- date: '2022'
  kind: dataset
  title: The series ends at 0.48 fatal accidents per million flights in 2022, against 6.46 in 1970
  why_it_matters: The rate is about a thirteenth of its 1970 level, so the long trend is clear even though single
    years swing.
  url: https://ourworldindata.org/grapher/fatal-airliner-accidents-per-million-flights
- date: '2017'
  kind: milestone
  title: 2017 is the lowest year in the series, at 0.28 fatal accidents per million flights
  why_it_matters: One record low does not show a steady trend; every later year from 2018 to 2022 stayed above it.
  url: https://ourworldindata.org/grapher/fatal-airliner-accidents-per-million-flights
