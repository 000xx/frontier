events:
- date: '2002-06'
  kind: milestone
  title: Earth-Simulator takes the number-one spot at 35.86 TFlop/s
  why_it_matters: The top score jumped from 7.23 TFlop/s on the previous list to almost five times that in one step, a reminder that the top spot can change hands by a wide margin.
  url: https://top500.org/lists/top500/2002/06/
- date: '2004-11'
  kind: milestone
  title: BlueGene/L beta-System overtakes Earth-Simulator at 70.72 TFlop/s
  why_it_matters: The top score doubled again within two and a half years, which shows how quickly the peak moved in the early 2000s.
  url: https://top500.org/lists/top500/2004/11/
- date: '2008-06'
  kind: milestone
  title: Roadrunner's score passes 1 PFlop/s for the first time in this record
  why_it_matters: The number-one score rose from 478.20 TFlop/s in November 2007 to 1,026 TFlop/s, the first time the top system in this record passed a petaflop.
  url: https://top500.org/lists/top500/2008/06/
- date: '2022-06'
  kind: milestone
  title: Frontier's score of 1,102 PFlop/s puts the top system above one exaflop
  why_it_matters: Above one exaflop per second on the benchmark, the top machine was running at a speed that had been a long-term target for high-performance computing.
  url: https://top500.org/lists/top500/2022/06/
- date: '2026-06'
  kind: milestone
  title: LineShine debuts at number one with 2,198.40 PFlop/s
  why_it_matters: The new top system scored more than 20% above the number-two system on the list, which is a larger lead than the top spot usually shows.
  url: https://top500.org/lists/top500/2026/06/
about:
  what: "The speed of the fastest computer on the TOP500 list, measured by how many calculations a second it sustains on a standard benchmark."
  why: "The largest machines are how researchers model the climate, simulate fusion plasmas and new materials, and train some AI systems. The top speed shows how much computation a single project can call on."
