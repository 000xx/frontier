# Records are transcribed by hand from the TOP500 list pages (top500.org/lists/top500/YYYY/MM/).
# Values are converted to PFlop/s on one scale; each record's conditions field keeps the figure as published.
id: supercomputers
title: Supercomputer speed (TOP500 number one)
domain: computing
subfield: Chips and hardware
status: live
summary: The speed of the fastest supercomputer on the TOP500 list, checked every June and November since June 1993. It shows how the top machine's benchmark score has grown from about 60 GFlop/s to over 2 EFlop/s.
metric:
  name: Rmax, number-one system
  unit: PFlop/s
  direction: higher
  scale: log
  explainer: TOP500 ranks the world's largest computers twice a year, in June and November. Each system is run on the High Performance Linpack (HPL) benchmark, and Rmax is the speed it reaches on that test, counted in floating-point operations per second. This tracker follows only the top system on each list and records a new entry only when the top system changes or its score improves. Early lists published scores in GFlop/s and later ones in TFlop/s or PFlop/s; the tracker converts them all to PFlop/s, so the same number can look different on the source page. A benchmark score is not the same as how fast a machine runs real research code, and that gap is worth keeping in mind when reading the line.
chart:
  primary: record-chart
  secondary:
  - reign-timeline
sources:
- id: top500-lists
  name: TOP500 lists
  url: https://top500.org/lists/top500/
  kind: dataset
  primary: true
  notes: One edition per June and November, at /lists/top500/YYYY/MM/. The site shows no licence for reusing list data; see top500-imprint. Opened 2026-11-09 for each edition from 1993-06 to 2026-06.
- id: top500-imprint
  name: TOP500 imprint and logo usage
  url: https://top500.org/imprint
  kind: other
  notes: Says the site is copyright 1993-2026 TOP500.org and that TOP500 is a registered trademark. It gives no terms for reusing list data. The logo page (top500.org/resources/top500-logo-usage/) allows logo use only for referencing the list and its data. Opened 2026-11-09.
update:
  cadence: quarterly
  last_checked: 2026-11-09
  notes: The list changes twice a year, so a quarterly check catches each new edition within three months. The November 2008 page gives the Roadrunner score as 1,105 TFlop/s in its table and 1.059 PFlop/s in its article; the table value is used. The November 2018 table header says GFlop/s, but the article says 143.5 petaflops, so 143.5 PFlop/s is used.
