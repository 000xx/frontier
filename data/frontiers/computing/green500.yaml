# Records are transcribed by hand from the number-one entry on each Green500 list (top500.org/lists/green500/YYYY/MM/).
# A record is a list whose number-one efficiency is above every earlier number-one in this file. The lists from 2007 to 2012
# could not be opened in this run, so the record history starts with the June 2013 list.
id: green500
title: Most energy-efficient supercomputer (Green500 number one)
domain: computing
subfield: Chips and hardware
status: live
summary: The best performance per watt on the Green500 list, which ranks supercomputers by how many floating-point operations they complete for each watt of power. The top figure has risen from about 3 GFlops/W in 2013 to about 73 GFlops/W in 2025, more than twenty-fold.
metric:
  name: Efficiency of the number-one system
  unit: GFlops/W
  direction: higher
  scale: linear
  explainer: "The Green500 is a twice-yearly companion to the TOP500 list. It takes the same benchmark run, High Performance Linpack (HPL), and divides the speed the machine reaches by the power it draws while doing so. The result is counted in GFlops per watt, billions of floating-point operations per second for each watt. A machine that is fast but power-hungry can rank low, so the list is a measure of how much useful computing each unit of energy buys. This tracker follows only the number-one system on each list and adds a record only when the top score is higher than every earlier top score in the file. The source does not always give the same figure for the same machine from one list to the next, because power measurements and reporting rules have changed. So the line can go down on the source page even when the machine has not changed, and the tracker does not show those drops. A benchmark score on a single test is not a measure of how efficiently a machine runs real research code."
chart:
  primary: record-chart
  secondary:
  - reign-timeline
sources:
- id: green500-lists
  name: Green500 lists (number-one entry per edition)
  url: https://top500.org/lists/green500/2026/06/
  kind: dataset
  primary: true
  notes: One edition each June and November, at /lists/green500/YYYY/MM/. The June 2026 and November 2025 editions show the same top system and score. Editions from 2007 to 2012 returned errors when opened in this run, and All editions were read through a page summariser rather than copied directly, so each value should be spot-checked against its page before it is treated as final. Pages show no reuse statement, so only the single number-one entry from each list is recorded, with a link. Opened 2026-11-09 for each edition from 2013-06 to 2026-06, except where noted.
- id: wikipedia-green500
  name: Wikipedia, Green500
  url: https://en.wikipedia.org/wiki/Green500
  kind: other
  notes: Secondary. Used only as a cross-check. It gives the number-one for November 2012 (Beacon, 2.499 GFLOPS/W) and dates Shoubu's 7.032 GFLOPS/W to August 2015, which the June 2015 list does not match. It does not state a licence. Opened 2026-11-09.
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Lists come out in June and November, so a quarterly check catches each edition within three months. The November 2026 edition was not yet published when this was checked. Open points for the owner: (1) Shoubu appears at 7031.4 MFlops/W on the June 2015 and November 2015 lists, and at 6673.84 on June 2016, so the same machine can drop without any change in the machine; the tracker keeps the 2015 record and does not add the 2016 entry; (2) Shoubu system B is 18.404 on June 2018 and 17.604 on November 2018, so the November 2018 entry is not a record and is not added; (3) DGX SaturnV Volta (15.113 on June 2019) and A64FX prototype (16.876 on November 2019) are below the June 2018 record, so neither is added; (4) Henri scores 65.40 on November 2023 against 65.396 on June 2023, which is a rounding difference, so no new record is added; (5) JEDI reports 72.733 on June 2025 and KAIROS reports 73.282 on November 2025; (6) the November 2014 record is shown as ASUS ESC4000 FDR/G2S, the name the list gives, while Wikipedia calls it L-CSC at GSI Darmstadt; (7) the 2007 to 2012 editions are not added because the pages could not be opened in this run, so earlier records are missing; (8) all records are confirmed, which follows the supercomputers frontier, but the owner should decide whether the list counts as an independent registry.'
