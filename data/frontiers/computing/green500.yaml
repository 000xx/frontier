events:
- date: '2015-06'
  kind: milestone
  title: Shoubu, a RIKEN system, takes the number-one efficiency score above 7 GFlops/W
  why_it_matters: The top score more than doubled in two years, and the lead came from a machine built on PEZY-SC accelerator chips.
  url: https://top500.org/lists/green500/2015/06/
- date: '2016-06'
  kind: setback
  title: Shoubu's score falls on the June 2016 list
  why_it_matters: The same machine is listed at 6673.84 MFlops/W in June 2016, below its 2015 figure, so the list's figures can move for reasons other than the hardware.
  url: https://top500.org/lists/green500/2016/06/
- date: '2018-11'
  kind: setback
  title: Shoubu system B drops from 18.404 to 17.604 GFlops/W
  why_it_matters: The top system's score falls between two consecutive lists, which shows that a record can be lost in the reporting even when the hardware has not changed.
  url: https://top500.org/lists/green500/2018/11/
- date: '2025-11'
  kind: milestone
  title: KAIROS takes the top score at 73.282 GFlops/W
  why_it_matters: JEDI held the top score at 72.733 GFlops/W on the June 2024 and June 2025 lists before KAIROS passed it.
  url: https://top500.org/lists/green500/2025/11/
