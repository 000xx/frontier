id: ml-hardware
title: Fastest AI chips at tensor FP16 and BF16 (Epoch AI datasheet data)
domain: computing
subfield: Chips and hardware
status: live
summary: The highest tensor FP16/BF16 performance of any AI accelerator released up to each date, from Epoch
  AI's collection of about 180 GPUs, TPUs and other AI chips, with the figures taken from hardware datasheets.
  It shows how much arithmetic a single chip can do in the number formats that AI models are trained in.
metric:
  name: Best tensor FP16/BF16 performance of an AI accelerator (datasheet)
  unit: TFLOP/s
  direction: higher
  scale: log
  explainer: 'An AI chip spends most of its time multiplying and adding numbers in matrices. FLOP/s counts
    how many floating-point operations a chip can do per second, and a TFLOP/s is a trillion of them. FP16
    and BF16 are two 16-bit number formats that AI models are commonly trained and run in, and "tensor" refers
    to the chip''s dedicated matrix units. Epoch AI compiles these figures for more than 180 accelerators from
    the manufacturers'' hardware datasheets, rather than from measurements, so each figure is the maker''s own
    stated peak. The value on this page is the one in Epoch''s column for tensor FP16/BF16 performance. Epoch''s
    documentation does not say on the page whether that figure is dense or sparse, so the owner should treat
    that detail as unconfirmed. A record is set when a newer chip exceeds every chip released before it. The
    line rises by about a thousandfold in under a decade, which is why it is drawn on a log scale. A high
    peak says little about the speed a model achieves on the chip, which depends on memory, networking and
    software.'
chart:
  primary: record-chart
  secondary:
  - threshold-gauge
series:
- id: tensor-fp16-bf16
  label: Best tensor FP16/BF16 accelerator (datasheet)
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Records are rebuilt from Epoch''s ml_hardware.csv by scripts/fetchers/ml_hardware.py; do not edit
    them by hand. Values are the column "Tensor-FP16/BF16 performance (FLOP/s)" divided by 10^12. A chip is a
    record when its figure beats every chip released on an earlier date. Status claimed is used because the
    figures are manufacturer datasheet values compiled by Epoch, not measurements.'
