# Records are transcribed from Paul Zimmermann's integer factoring records page (factored by the 2003 to 2020 teams).
# RSA-260 and RSA-896 are company and individual announcements from 2026, checked only by their authors; bit
# lengths for RSA-240 to RSA-260 are taken from the Wikipedia RSA numbers table, which the factoring page does not give.
id: rsa-factoring
title: Largest RSA number factored
domain: computing
subfield: Networks and security
status: live
summary: The largest RSA modulus anyone has split into its two prime factors, measured in bits, from 576 bits in 2003 to 896 bits in 2026. RSA keys are safe only while factoring them stays out of reach, so each record shows how far the attack has come.
metric:
  name: Bits in the largest RSA number factored
  unit: bits
  direction: higher
  scale: linear
  explainer: 'RSA is a public-key scheme. A public key is a large number n that is the product of two secret primes,
    and the scheme is safe as long as nobody can split n back into its two primes. The records here are factorisations
    of such numbers, which mainly show how much computing a given size needs. Many records were set on numbers from
    RSA Laboratories public challenge, which ended in 2007; later numbers continue the same list. The number field sieve is the method behind every record here. The academic records
    used about 900 to 2,700 core-years of compute, and the cost rises steeply with size. A record does not by
    itself break any key in use: it shows the effort needed for a number of a given length, which is what key-size
    choices depend on. Results are counted in bits, the binary length of the number.'
chart:
  primary: record-chart
  secondary:
  - reign-timeline
sources:
- id: zimmermann-factoring-records
  name: Paul Zimmermann, Integer factoring records
  url: https://members.loria.fr/PZimmermann/records/factor.html
  kind: dataset
  primary: true
  notes: Lists RSA-576, RSA-200, RSA-768, RSA-240 and RSA-250 with dates and the names of the teams. The page has no copyright or reuse statement, so only facts are recorded here. It does not list RSA-260 or RSA-896. Opened 2026-11-09.
- id: wikipedia-rsa-numbers
  name: Wikipedia, RSA numbers
  url: https://en.wikipedia.org/wiki/RSA_numbers
  kind: other
  notes: Secondary. Used for bit lengths (RSA-200, RSA-240, RSA-250, RSA-260, RSA-896) and to cross-check dates. It gives RSA-240 as 2019-11, where the Zimmermann page gives 2 December 2019. Page text is CC BY-SA; no sentences are copied. It states that the RSA Factoring Challenge ended in 2007. Opened 2026-11-09.
- id: cognition-rsa-260
  name: Cognition, Factoring RSA-260 (blog post)
  url: https://cognition.com/blog/factoring-rsa-260
  kind: report
  notes: Company announcement by Cognition, describing work by an engineer and the company's AI agent. Claims the factors were produced on 3 September 2026. Verification is internal only (a test factorisation and a checker run); no independent party or peer review is named. Status is therefore claimed. Opened 2026-11-09.
- id: postquantum-rsa-896
  name: Post-quantum news article on the RSA-896 claim
  url: https://postquantum.com/security-pqc/rsa-896-factored-claude-gpus/
  kind: news
  notes: Reports an announcement by Stephen A. Weis dated 19 September 2026. The article multiplied the two published primes and checked their size and primality. It states that the compute claims (about 30 GPU-years, 10 days, and Claude's role) rest on the announcer's own word and have no independent check. Status is therefore claimed. Its secondary coverage is said to contain errors. Opened 2026-11-09.
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Records come from the Zimmermann page, cross-checked against Wikipedia. Open points for the owner: (1) RSA-260 and RSA-896 are company or individual claims with no independent check; the owner should decide whether to keep them as records or mark them as disputed; (2) RSA-896 is not an RSA Laboratories challenge number (the challenge ended in 2007), so the series mixes challenge numbers with later numbers; (3) RSA-240 is dated 2019-11 on Wikipedia and 2019-12-02 on the Zimmermann page, and the Zimmermann date is used; (4) the RSA-896 article says its secondary sources (Crypto Briefing, LavX News) contain errors, so the primary Weis announcement should be read before the record is confirmed; (5) older records (2003 to 2020) are marked claimed because the peer-review status of each was not checked in this run.'
