- date: '2026-09-19'
  value: 896
  holder: Stephen A. Weis (with Claude)
  conditions: RSA-896, 270 digits; GPU port of CADO-NFS, up to 2,048 GPUs, about 30 GPU-years over 10 days
  status: claimed
