events:
- date: '2026-09-09'
  kind: milestone
  title: Cognition publishes its RSA-260 factorisation, run on spare GPU capacity
  why_it_matters: The record came from company-owned spare compute rather than a university cluster, and the company's own tools were part of the work.
  url: https://cognition.com/blog/factoring-rsa-260
- date: '2026-09-19'
  kind: news
  title: Announcement of an RSA-896 factorisation that has not been independently checked
  why_it_matters: The factors can be multiplied and tested by anyone, but the compute claims rest on the announcer alone, so the owner should treat the record as unconfirmed.
  url: https://postquantum.com/security-pqc/rsa-896-factored-claude-gpus/
- date: '2020-02-28'
  kind: milestone
  title: RSA-250 factored by a six-person academic team
  why_it_matters: The record used the open-source CADO-NFS software, and it is the most recent academic entry on the Zimmermann page.
  url: https://members.loria.fr/PZimmermann/records/factor.html
