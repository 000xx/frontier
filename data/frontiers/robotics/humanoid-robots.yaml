id: humanoid-robots
title: Humanoid robots in commercial work
domain: robotics
subfield: Capability
status: draft
summary: How far humanoid robots, machines built with a human-like body, have moved from prototypes to paid work in factories and warehouses. It tracks each company's stage as its own announcements describe it.
metric:
  name: Humanoid robot programmes in commercial use
  unit: programmes
  direction: higher
  scale: linear
  explainer: 'A humanoid robot has a body shaped roughly like a person''s, usually two arms and two legs, so it
    can use tools and spaces built for people. Most are still at the demonstration or trial stage. Each
    candidate is placed at the furthest stage its own company or customer has described: a prototype shown
    off, a pilot with one customer, a signed commercial agreement, or work that is paid for. Companies
    describe their progress in their own words, so the stage is a claim until an independent source
    confirms it.'
chart:
  primary: stage-timeline
stages:
- Prototype
- Pilot
- Commercial agreement
- Paid deployment
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'No machine-readable source; candidates come from company and press announcements. Only two
    companies have been checked, both from sources opened in full. Dates for the Agility pilot and
    commercial agreements were not given in the source, so they are not in the history. Still to add:
    other humanoid makers with announced customers, each with a dated stage. Check quarterly, and treat
    any stage change as a company claim until the customer confirms it.'
