# Cost per genome and cost per megabase: observations come from the NHGRI Sequencing Cost Data Table, read through the
# DataHub CSV copy (see the sources). Values are copied as the copy gives them, in USD, with no interpolation.
# The NHGRI workbook itself could not be read in this run; see the notes before setting status to live.
id: genome-sequencing-cost
title: Cost of sequencing a human genome
domain: biology
subfield: Reading life
status: draft
summary: The estimated cost of reading one human-sized genome, and of reading one megabase of DNA, as the National Human Genome Research Institute tracks it. The estimate fell from about $95 million in September 2001 to about $525 in May 2022, the last row in the copy.
metric:
  name: Cost of sequencing one human-sized genome
  unit: USD
  direction: lower
  scale: log
  explainer: 'Sequencing reads the letters of a DNA molecule. NHGRI reports two costs. The first is the cost of
    determining one megabase, a million bases, of DNA sequence at a set quality. The second is an estimate of the
    cost of sequencing a human-sized genome, which the fact sheet takes as 3,000 megabases. The genome figure is an
    estimate, not the price of any particular project. Sequencing used Sanger-based capillary machines until
    late 2007. From January 2008 the series reflects second-generation platforms, and the human genome figure
    after that date comes from re-sequencing against a reference genome. The break in 2008 is a change in method,
    so the steep drop around it does not measure one machine getting faster. The scale is logarithmic because the
    cost fell by more than a factor of 10,000 over the period.'
chart:
  primary: cost-curve
series:
- id: cost-per-genome
  label: Cost per human-sized genome
- id: cost-per-megabase
  label: Cost per megabase
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'The NHGRI fact sheet says NHGRI plans to update these data regularly, but the page was last updated on 16 May 2023
    and the table it links is the May 2022 file. The DataHub copy ends at 2022-05. Check the NHGRI page for a newer table.
    If one exists, open the workbook itself (the fetch of the .xls returned binary data in this run), add rows after the last
    date, and do not change earlier rows unless NHGRI restates them. The fact sheet does not state a currency; the USD label
    is set by this project and is to be confirmed by the owner. The genome figure is not simply cost per megabase times
    3,000; the fact sheet does not state the coverage behind it in the text read here.'
sources:
- id: nhgri-table
  name: NHGRI, Sequencing Cost Data Table (Sequencing_Cost_Data_Table_May2022.xls)
  url: https://www.genome.gov/sites/default/files/media/files/2023-05/Sequencing_Cost_Data_Table_May2022.xls
  kind: dataset
  primary: true
  notes: 'Not read. A WebFetch of this file returned binary data and no rows, and curl to genome.gov was refused by the
    proxy. The values in this file were taken from the DataHub copy below, which states that it comes from this NHGRI table.
    Terms: none stated on the fact sheet, which says NHGRI welcomes people to download the graphs and use them in presentations
    and teaching materials. No licence is stated for the table itself.'
- id: nhgri-fact-sheet
  name: "NHGRI, DNA Sequencing Costs: Data (fact sheet)"
  url: https://www.genome.gov/about-genomics/fact-sheets/DNA-Sequencing-Costs-Data
  kind: other
  notes: 'Read on 2026-11-09. Gives the two metric definitions, the 3,000 megabase genome assumption, the January 2008 change
    in platform, and the page date (last updated 16 May 2023). States no currency and no licence. Its footer links to a copyright
    page, which was not read.'
- id: datahub-copy
  name: "DataHub, Genome sequencing costs (CSV copy of the NHGRI table)"
  url: https://datahub.io/core/genome-sequencing-costs
  kind: dataset
  notes: 'Read on 2026-11-09 through the redirect target of https://datahub.io/core/genome-sequencing-costs/_r/-/data/sequencing_costs.csv,
    which is https://r2.datahub.io/clv2flx730000jr086z9k9ntn/main/raw/data/sequencing_costs.csv. Licence stated on the DataHub page:
    Open Data Commons Public Domain Dedication and License v1.0 (ODC-PDDL-1.0). Page last updated 9 February 2026. Its metadata
    gives coverage as 2001 to 2023, but the CSV ends at 2022-05. The values were copied by reading the file through WebFetch, not
    by byte comparison with NHGRI''s workbook, so they are unverified against the primary file.'
