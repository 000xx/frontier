events:
- date: '2008-01'
  kind: milestone
  title: Sequencing cost per genome drops from about $7 million to about $3 million in the copy's first 2008 row
  why_it_matters: The change to second-generation machines cut the cost by more than half in a single step, which is why this series reads as a change of method rather than gradual progress.
  url: https://www.genome.gov/about-genomics/fact-sheets/DNA-Sequencing-Costs-Data
- date: '2009-10'
  kind: milestone
  title: Estimated cost of a human-sized genome falls below $100,000 in the DataHub copy
  why_it_matters: Below $100,000, whole-genome sequencing became affordable for many more research labs than before.
  url: https://datahub.io/core/genome-sequencing-costs
- date: '2019-02'
  kind: milestone
  title: Estimated cost of a human-sized genome falls below $1,000 in the DataHub copy
  why_it_matters: The figure crossed the $1,000 level, a figure often cited as a rough target, and every later row in the copy stays below it.
  url: https://datahub.io/core/genome-sequencing-costs
- date: '2022-05'
  kind: dataset
  title: Last row of the NHGRI series in the DataHub copy, at about $525 per genome
  why_it_matters: The series stops in May 2022 in this copy, so readers should not treat the last value as today's price until NHGRI publishes a newer table.
  url: https://datahub.io/core/genome-sequencing-costs
about:
  what: "What it costs to read the full DNA sequence of one person."
  why: "The first human genome took an international project more than a decade. As the cost of a genome fell, sequencing moved from a research feat to a routine tool for diagnosing rare diseases, guiding cancer treatment and studying whole populations."
