# Observations are the size of GenBank, NCBI's archive of publicly shared nucleotide sequences, at each flat-file release
# from December 1982 (release 3) to August 2026 (release 273). Each release is keyed by its month. Figures are read from the
# release table on NCBI's GenBank statistics page, opened 2026-11-09 (the page was read through WebFetch, so the values are
# checked against the refresh workflow's dry run before the status is set to live). The table covers traditional GenBank
# records only. The fetcher is scripts/fetchers/genbank_size.py.
id: genbank-size
title: GenBank size
domain: biology
subfield: Reading life
status: live
summary: How much DNA and RNA sequence data the NIH's GenBank archive holds, counted in bases and in sequence records
  at each release. It is a simple measure of how much sequence biology has produced and shared in public.
metric:
  name: Bases in GenBank (traditional records)
  unit: bases
  direction: higher
  scale: log
  explainer: 'A base is one letter of DNA or RNA, one of A, C, G, T or U. GenBank is a public archive, run by the US National
    Library of Medicine, where researchers deposit sequences and where the collection is published in numbered releases,
    roughly every two months. The release table counts the bases and sequence records in the traditional part of the
    archive. It leaves out the large batch-submitted sets, such as whole-genome shotgun assemblies, so the totals are lower
    than the full archive. Growth is rapid, so the chart uses a log scale. Read the trend rather than a single release,
    because some releases add whole projects at once, and some counts fall between releases as the archive is rebuilt. A
    falling count is a fact of the source and is kept, not hidden.'
chart:
  primary: record-chart
series:
- id: bases
  label: Bases
- id: sequences
  label: Sequence records
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Observations come from the release table on the GenBank statistics page. The fetcher adds new releases and
    updates the last three when their figures change; older releases are kept, and changes to them are printed in the run
    log only. Still to add: a reading list.
    Open point for the owner: the table shows some releases with fewer bases or sequences than the release before (bases
    fall at releases 227 and 267, sequences at releases 227 and 235), so these are kept as published.'
sources:
- id: ncbi-genbank-statistics
  name: NCBI, GenBank statistics (release table)
  url: https://www.ncbi.nlm.nih.gov/genbank/statistics
  kind: dataset
  primary: true
  notes: Read on 2026-11-09. The table lists release, date, bases and sequences for traditional GenBank records, and says
    that it excludes CON-division and set-based (WGS, TSA, TLS) records. Values were read through WebFetch and must match the
    dry run of scripts/fetchers/genbank_size.py.
- id: ncbi-genbank-current
  name: NCBI, GenBank current release
  url: https://www.ncbi.nlm.nih.gov/genbank/release/current/
  kind: dataset
  notes: Read on 2026-11-09. It gives the flat-file release as 273.0 dated August 15 2026, with 8236878868450 bases and
    267383895 sequences for traditional records, matching the statistics table at that time. The dry run of 2026-11-10 found a later release, 274 dated October 2026, with 9384961284424 bases and 269895537 sequences; it is added here from that run. It also gives 6409108932
    set-based sequences, which this frontier does not count.
- id: ncbi-policies
  name: NCBI, Website and Data Usage Policies and Disclaimers
  url: https://www.ncbi.nlm.nih.gov/home/about/policies/
  kind: other
  notes: Read on 2026-11-09. Its section on molecular data says that NCBI itself places no restrictions on the use or
    distribution of the data it holds, naming GenBank. Its copyright section says that material created by or for the US
    government is in the public domain, and notes that some material on the site may be protected by copyright. Only facts
    (counts) are recorded here, each with a link, and no copy of the table is kept.
events:
- date: '1997-08'
  kind: milestone
  title: GenBank passes one billion bases with release 102 in August 1997
  why_it_matters: 'Release 101 in June 1997 held about 967 million bases; release 102 held about 1.05 billion, the first
    release above that mark in the table.'
  url: https://www.ncbi.nlm.nih.gov/genbank/statistics
- date: '2009-02'
  kind: milestone
  title: GenBank passes 100 million sequence records with release 170 in February 2009
  why_it_matters: 'Release 169 in December 2008 held about 98.9 million sequence records; release 170 held about 101.8
    million, so the count of records crossed a round number at this release.'
  url: https://www.ncbi.nlm.nih.gov/genbank/statistics
- date: '2021-10'
  kind: milestone
  title: GenBank passes one trillion bases with release 246 in October 2021
  why_it_matters: 'Release 245 in August 2021 held about 941 billion bases and release 246 about 1.01 trillion, so the
    archive first reached a trillion bases in this release.'
  url: https://www.ncbi.nlm.nih.gov/genbank/statistics
- date: '2025-06'
  kind: dataset
  title: The release 267 base count falls below release 266 in the published table
  why_it_matters: 'Release 266 in April 2025 is listed at about 5.79 trillion bases and release 267 in June 2025 at about
    5.23 trillion, while sequence records rise. The page does not explain the fall, so the frontier keeps the figure as
    published and flags it for the owner.'
  url: https://www.ncbi.nlm.nih.gov/genbank/statistics
