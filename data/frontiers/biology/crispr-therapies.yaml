# CRISPR-based therapies by stage. Four candidates, each from sources opened in this run:
# Casgevy (FDA announcement, 8 December 2023); lonvo-z (Intellia release and HCPLive, 8 September 2026, company claims);
# nex-z (Intellia release, 27 January 2026, company); risto-cel (Beam release, 7 May 2026, company).
# Only candidates with a stage stated in those sources are added. Other CRISPR programmes are not yet covered.
id: crispr-therapies
title: CRISPR therapies
domain: biology
subfield: Writing and editing life
status: draft
summary: How far the first CRISPR-based medicines have travelled from the laboratory to approval, and how many
  more are in trials, with the regulatory filings and safety holds that decide when each one reaches patients.
metric:
  name: CRISPR-based therapies by stage
  unit: therapies
  direction: higher
  scale: linear
  explainer: 'CRISPR is a system that bacteria use to recognise and cut DNA, which researchers have adapted to edit
    the genetic code of cells. A therapy built on it can cut a gene, or in some newer designs change one letter of
    DNA without cutting both strands. Medicines move through the same stages as other drugs: early safety trials,
    larger efficacy trials, a regulator''s review of the application, approval, and then use by patients. A
    company announcement of a filing or result is not the same as a regulator''s decision, and a clinical hold
    can pause a trial while safety is checked. The stage shows how far a therapy has got, not whether it will
    work for everyone who receives it.'
chart:
  primary: stage-timeline
stages:
- Preclinical
- Phase 1
- Phase 1/2
- Phase 2
- Phase 3
- Regulatory review
- Regulatory approval
- Rollout
series:
- id: therapies
  label: CRISPR-based therapies
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Four candidates are added. Casgevy is the only approved one here, from the FDA announcement of 8 December
    2023. The lonvo-z filing and the nex-z and risto-cel trial statuses come from company releases, so they are
    claimed, not confirmed by a regulator. Next checks: the FDA decision on lonvo-z (PDUFA target 10 March 2027); the
    MAGNITUDE (ATTR-CM) clinical hold, which was still under FDA discussion in January 2026; the risto-cel BLA, which
    the company expects as early as year-end 2026. Not yet covered: other CRISPR programmes, including Verve and
    others. Owner: base editors such as risto-cel use a CRISPR guide but change single DNA letters rather than
    cutting; please decide whether they belong in this frontier. The Casgevy developer is not named in the FDA
    announcement, so the developer field is left out.'
