events:
- date: '2021-07-22'
  kind: dataset
  title: First AlphaFold DB release, with about 350,000 predicted structures
  why_it_matters: Puts a first large set of predicted protein shapes into a free public database.
  url: https://ebi-biows.gitdocs.ebi.ac.uk/blog/2022-07-28-new-afdb-release
- date: '2022-07-28'
  kind: dataset
  title: AlphaFold DB expands to over 200 million predicted structures
  why_it_matters: Covers almost the whole of UniProt, the main catalogue of known protein sequences, so most known proteins now have a predicted shape.
  url: https://ebi-biows.gitdocs.ebi.ac.uk/blog/2022-07-28-new-afdb-release
- date: '2022-11-01'
  kind: dataset
  title: Meta releases the ESM Metagenomic Atlas with more than 600 million structures
  why_it_matters: Adds a second, separate open collection of predicted structures, drawn from proteins found in environmental DNA sequences.
  url: https://ai.meta.com/blog/protein-folding-esmfold-metagenomics/
- date: '2026-03-17'
  kind: dataset
  title: AlphaFold DB adds 1.7 million predicted homodimers
  why_it_matters: Moves the database from single proteins toward protein complexes, which show how proteins bind each other; the count of complexes is separate from the count of single-chain structures.
  url: https://www.news-medical.net/news/20260317/AlphaFold-Database-expands-with-millions-of-predicted-protein-complexes.aspx
