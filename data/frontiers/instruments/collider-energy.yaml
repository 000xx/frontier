events:
- date: '2009-12'
  kind: milestone
  title: The LHC passes the Tevatron with 2.36 TeV collisions
  why_it_matters: The energy record moved back to Europe after 24 years at Fermilab, months before the LHC's
    full-energy physics began.
  url: https://physicstoday.aip.org/news/lhc-now-worlds-most-powerful-collider
- date: '2022-07-05'
  kind: milestone
  title: LHC Run 3 starts at 13.6 TeV
  why_it_matters: This is the current record, a modest step above the 13 TeV of Run 2.
  url: https://cms.cern/node/2106
- date: '2026-05-27'
  kind: news
  title: Updated European strategy backs an electron-positron Future Circular Collider
  why_it_matters: The tunnel it needs could later hold a proton collider of up to 100 TeV, the most likely
    route to a new record; a decision to build is expected by 2028.
  url: https://www.innovationnewsnetwork.com/cern-backs-future-circular-collider-in-new-european-strategy-for-particle-physics/70049/
- date: '2026-06'
  kind: milestone
  title: The LHC stops for Long Shutdown 3
  why_it_matters: With the collider off until it restarts as the High-Luminosity LHC, targeted for June 2030, the
    record cannot move for years.
  url: https://www.sciencetimes.com/articles/62039/20260706/large-hadron-collider-waves-goodbye-it-enters-long-shutdown-3-after-nearly-20-years-service.htm
