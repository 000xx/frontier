# Records are transcribed by hand from the pages listed under sources; each value was read in this run.
# A record is a collider reaching a higher centre-of-mass collision energy than any earlier collider of its kind.
# Hadron and electron-positron colliders are separate series and should not be ranked against each other.
id: collider-energy
title: Highest collision energy in a particle collider
domain: instruments
subfield: Big projects
status: live
summary: The highest energy at which particle beams have been smashed together, from the first proton collider in
  1971 to the Large Hadron Collider's 13.6 TeV today. Higher energy lets physicists make heavier particles and
  look at nature on smaller scales.
metric:
  name: Highest centre-of-mass collision energy reached
  unit: TeV
  direction: higher
  scale: log
  explainer: 'A collider accelerates two beams of particles in opposite directions and steers them into each
    other. The energy available to make new particles is the centre-of-mass energy, the total energy of the
    two colliding particles. It is quoted in electronvolts: a teraelectronvolt (TeV) is a trillion of them.
    By Einstein''s E = mc², more energy means heavier particles can appear in the debris, so each new energy
    record opens a window on things no earlier machine could make. Colliding two beams head-on wins far more
    usable energy than firing one beam at a fixed target, which is why colliders took over in the 1970s.
    Protons are made of smaller parts (quarks and gluons), so only part of a proton collision''s energy goes
    into any single interaction; electron-positron collisions are cleaner but electrons lose energy as
    radiation when bent in a ring, which has kept their record far lower. The two kinds are shown as
    separate series. Today''s proton record is set by the Large Hadron Collider at CERN, which stopped in
    mid-2026 for a long upgrade into the High-Luminosity LHC. A proton machine of up to 100 TeV has been
    proposed for a new 91 kilometre tunnel near Geneva, but it would come decades from now, if at all.'
chart:
  primary: record-chart
  secondary:
  - reign-timeline
series:
- id: hadron
  label: Proton and antiproton colliders
- id: electron-positron
  label: Electron-positron colliders
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Open points for the owner: (1) every record rests on a lab announcement, a lab history page, a
    trade-magazine report or a Fermilab review that was not checked for a journal, so all are claimed; the
    energies are not in doubt, but no peer-reviewed paper was opened for them. (2) The ISR value is its
    maximum energy; the date is its first collisions (27 January 1971), and the date it first reached 62 GeV
    was not found. (3) The Tevatron reached 1.8 TeV during Run I, but no date for that step was read, so it is
    missing; the 1.96 TeV record is dated to the start of Run II in March 2001. (4) Fermilab''s Shiltsev
    review says the LHC took the lead in colliding beam energy on 29 November 2009, the day its beams reached
    1.18 TeV each; the 2.36 TeV collisions followed in December, and that month is used. (5) The 13 TeV date
    is the start of physics data taking; first test collisions at that energy came earlier and were not dated
    in the source read. (6) Electron-positron coverage holds only LEP''s final energy; earlier lepton records
    are not yet added. Heavy-ion collision energies are not covered. Wikipedia and the CERN timeline could
    not be opened in this run.'
