# Records are transcribed by hand from the pages listed under sources; each value was read in this run.
# A record is a working optical telescope whose single primary mirror (one piece or segmented) is wider than
# every earlier one. Telescopes that combine separate mirrors on one mount, and those whose usable aperture is
# smaller than their mirror, are not counted.
id: largest-telescope
title: Largest optical telescope
domain: instruments
subfield: Seeing and measuring
status: live
summary: The diameter of the biggest working optical telescope mirror, and the three giant telescopes meant to
  overtake it. A wider mirror collects more light and sees finer detail, so each jump has opened new parts of
  the universe to study.
metric:
  name: Primary mirror diameter of the largest working optical telescope
  unit: metres
  direction: higher
  scale: linear
  explainer: 'A telescope''s main job is to gather light. The amount it collects grows with the area of its
    primary mirror, so doubling the diameter gives four times the light and lets astronomers see objects four
    times fainter in the same time. A wider mirror can also, in principle, resolve finer detail, although for
    ground-based telescopes the blurring of the atmosphere gets in the way unless the telescope corrects for
    it with a deformable mirror (adaptive optics). For most of the twentieth century the limit was how big a
    single piece of glass could be cast, polished and held in shape as the telescope tilted. The 5 metre
    Hale telescope held the record for almost three decades before a 6 metre Soviet telescope passed it. The way past that wall was to build the mirror from many hexagonal
    segments, each kept in line by computer-controlled supports, which is how the 10 metre Keck telescopes
    and the slightly larger Gran Telescopio Canarias were made. The next generation uses the same idea on a
    much bigger scale: Europe''s Extremely Large Telescope will have a 39 metre mirror made of 798 segments,
    while the Giant Magellan Telescope combines seven 8.4 metre mirrors. These projects take decades and
    billions to build, so their progress is tracked here as stages rather than as records.'
chart:
  primary: record-chart
  secondary:
  - stage-timeline
  - to-scale-lineup
series:
- id: single-aperture
  label: Largest single-aperture optical telescope
stages:
- Design
- Construction
- Telescope first light
- Science operations
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Coverage starts in 1917 with the Hooker telescope; earlier record holders are not yet added. Open
    points for the owner: (1) the status scale was written for experimental results. The size of a built
    telescope is not in doubt, but only the Gran Telescopio Canarias is backed by an independent registry
    (Guinness World Records), so it is the only record marked confirmed; the others rest on an observatory,
    agency, encyclopedia or magazine page and are marked claimed. (2) Telescopes with a large mirror but a
    smaller usable aperture (such as SALT and the Hobby-Eberly Telescope) and those that combine two mirrors
    on one mount (the Large Binocular Telescope) are left out by the definition above; no figures for them
    were read in this run. (3) The Hooker and Hale apertures are given in inches by their sources and are
    converted here (1 inch = 2.54 cm). (4) Wikipedia pages could not be opened in this run. Check ESO''s ELT
    timeline first, then GMTO, TMT and news for the three giant telescopes.'
