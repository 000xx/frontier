candidates:
- id: elt
  name: Extremely Large Telescope (ELT)
  developer: European Southern Observatory
  kind: 39 metre segmented mirror (798 segments), Cerro Armazones, Chile
  stage: Construction
  history:
  - stage: Design
    date: '2006-12'
    source: eso-elt-timeline
    note: ESO Council approves a detailed study.
  - stage: Construction
    date: '2014-12'
    source: eso-elt-timeline
    note: ESO Council approves construction in two phases.
  key_result: Telescope first light planned for March 2029 and first science in December 2030, per ESO
  source: eso-elt-timeline
  note: In March 2025 ESO announced that telescope first light is now planned for March 2029.
- id: gmt
  name: Giant Magellan Telescope (GMT)
  developer: GMTO Corporation (international consortium)
  kind: 25.4 metre aperture from seven 8.4 metre mirrors, Atacama Desert, Chile
  stage: Construction
  key_result: Described as 40% under construction in January 2026; science observations expected in the 2030s
  source: eurekalert-gmt-2026
  note: Entered the NSF Major Facilities Final Design Phase in June 2025, a step before it can seek federal
    construction funding.
- id: tmt
  name: Thirty Meter Telescope (TMT)
  developer: TMT International Observatory
  kind: 30 metre segmented mirror, Mauna Kea, Hawaii (preferred site)
  stage: Construction
  key_result: Stalled since protests blocked construction in 2019; no first-light date set
  source: civilbeat-tmt-2026
  note: In September 2026 the project declined Spain's offer of up to 1 billion euros to build on La Palma and
    kept Mauna Kea as its preferred site, which still needs approval from the Mauna Kea oversight authority.
events:
- date: '2007-07-13'
  kind: milestone
  title: Gran Telescopio Canarias sees first light with a 10.4 metre mirror
  why_it_matters: It edged past the Keck telescopes using the same segmented-mirror design and still holds the
    record for a single optical telescope.
  url: https://www.guinnessworldrecords.com/world-records/largest-single-optical-telescope
- date: '2014-12'
  kind: milestone
  title: ESO approves construction of the 39 metre Extremely Large Telescope
  why_it_matters: The first of the giant telescopes to be fully committed, it would nearly quadruple the record
    diameter.
  url: https://elt.eso.org/about/timeline/
- date: '2025-03-14'
  kind: setback
  title: ELT telescope first light moves to March 2029
  why_it_matters: The new date pushes back the moment the record could change hands, a reminder that schedules for one-off machines like this slip.
  url: https://eso.org/public/announcements/ann25001/
- date: '2025-06-12'
  kind: news
  title: Giant Magellan Telescope enters the NSF final design phase
  why_it_matters: It is the step before US federal construction money, and the NSF chose to back this
    telescope rather than the TMT.
  url: https://www.eurekalert.org/news-releases/1087222
- date: '2026-09-30'
  kind: setback
  title: Thirty Meter Telescope turns down Spain's offer to move to La Palma
  why_it_matters: Staying with Mauna Kea keeps the project tied to a site where construction has been blocked
    since 2019, while US federal support has gone to its rival.
  url: https://www.civilbeat.org/2026/09/tmt-doubles-down-on-mauna-kea-declines-spains-1b-proposal/
