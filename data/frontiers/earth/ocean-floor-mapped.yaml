observations:
- date: '2020'
  value: 19
  source: nippon-2020
  note: Up from 15 percent the year before, as the release reports it.
- date: '2021'
  value: 20.6
  source: gebco-2021
  note: GEBCO_2021 grid.
- date: '2022'
  value: 23.4
  source: nippon-2022
  note: 2022 grid; reported as an increase of 10.1 million square kilometres over the 2021 release.
- date: '2023'
  value: 24.9
  source: nippon-2023
  note: Latest GEBCO grid figure at announcement; the article reports an increase of 5.4 million square kilometres over the previous year.
- date: '2024'
  value: 26.1
  source: oceannews-2024
- date: '2025'
  value: 27.3
  source: nippon-2025
  note: Described by the project as mapped to modern standards.
- date: '2026'
  value: 28.7
  source: iho-2026
  note: 2026 grid, described as mapped without the modern standards wording.
events:
- date: '2020-06-21'
  kind: milestone
  title: Seabed 2030 reports 19 percent of the seafloor mapped
  why_it_matters: The share rose four points in a year, which set the starting pace for the rest of the series.
  url: https://en.nippon-foundation.or.jp/news/articles/2020/20200621-45318.html
- date: '2022-06-29'
  kind: milestone
  title: Mapped share reaches 23.4 percent in the 2022 grid
  why_it_matters: The 2022 grid added 10.1 million square kilometres over the 2021 release, a clear step toward the 2030 goal.
  url: https://tnfsa.nippon-foundation.or.jp/news/855147
- date: '2025-06-21'
  kind: milestone
  title: Mapped share reaches 27.3 percent, described as modern standards
  why_it_matters: With about 73 percent of the ocean floor still unmapped to modern standards, the goal depends on the pace of new surveys.
  url: https://tnfsa.nippon-foundation.or.jp/news/2756701
- date: '2026-04-28'
  kind: milestone
  title: Mapped share reaches 28.7 percent in the 2026 grid
  why_it_matters: The share rose 1.4 points in the latest year, while closing the remaining gap by 2030 would need roughly 18 points a year.
  url: https://iho.int/en/global-seabed-mapping-reaches-new-milestone-as-five-million-square-kilometres-added-in-a-year
