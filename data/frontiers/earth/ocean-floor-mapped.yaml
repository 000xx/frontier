# Observations are the yearly figures from the Nippon Foundation-GEBCO Seabed 2030 Project.
# Each value is the share of the world ocean floor the project reports as mapped, as given in the announcement cited.
# A year is the year of the GEBCO grid release the announcement reports; where an announcement gives no year, the year of the announcement is used (see notes).
id: ocean-floor-mapped
title: Ocean floor mapped to modern standards
domain: earth
subfield: Observing the Earth
status: live
summary: How much of the world's ocean floor has been mapped to modern standards, as counted each year by the
  Nippon Foundation-GEBCO Seabed 2030 Project, and how far that is from a full map by 2030.
metric:
  name: Share of the world's ocean floor mapped to modern standards
  unit: percent
  direction: higher
  scale: linear
  explainer: 'Most of the ocean floor has never been measured in detail. Ships and some aircraft collect depth
    soundings, and the Seabed 2030 project gathers those surveys from many countries and combines them into the
    GEBCO grid, a single global depth map. Each year the project reports what share of the seafloor is covered
    by data at modern resolution. The figure is a share of area, not a measure of accuracy, and it depends on
    which grid release is used, so compare years only as the project reports them. Each year is a different
    grid release, and the project has announced its figures at different times of the year, from April to
    June. The 2026 figure of 28.7 percent is described as the share of seafloor mapped, without the "modern
    standards" wording used in 2025. Reaching 100 percent is the project''s stated aim for 2030.'
  target:
    value: 100
    label: 'Whole ocean floor mapped to modern standards: the Seabed 2030 project''s stated goal of completing the
      mapping of the world''s ocean floor by 2030'
    by: '2030'
chart:
  primary: coverage-meter
series: []
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Figures are read from the project''s yearly announcements and the GEBCO grid release pages. The project''s
    own site, seabed2030.org, could not be fetched in this run, so no figure was taken from its home page; check
    its news page first on the next run and replace the newest year there if it differs. Announcements have come
    between April and June (2020 on 21 June, 2022 on 29 June, 2023 on 6 June, 2024 and 2025 on 21 June, 2026 on
    28 April). Terms: seabed2030.org gives a copyright line of "Copyright © 2020-2026, Seabed 2030 Project" and
    no licence or attribution condition for its data; its disclaimer says the data is not for navigation or for any
    purpose involving safety at sea. GEBCO places the GEBCO Grid in the public domain, requires users to acknowledge
    its source and not to suggest official status or endorsement, and points to accompanying documentation for the
    wording. The recommended citation given with the GEBCO_2025 Grid is: GEBCO Bathymetric Compilation Group 2025
    (2025), The GEBCO_2025 Grid, a continuous terrain model for oceans and land at 15 arc-second intervals, NERC EDS
    British Oceanographic Data Centre NOC, https://doi.org/10.5285/37c52e96-24ea-67ce-e063-7086abc05f29. No GEBCO
    grid data is copied into this repository; only the yearly percentages are stored, each with its announcement.'
sources:
