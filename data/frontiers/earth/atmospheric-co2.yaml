# Observations are annual means of CO2 measured at Mauna Loa Observatory, Hawaii, for 1959 to 2025.
# They come from NOAA's Global Monitoring Laboratory annual-mean file (co2_annmean_mlo.txt), which is public domain.
# The values were first seeded from a GitHub copy of that file (datasets/co2-ppm, opened 2026-11-10 via raw.githubusercontent.com);
# the NOAA file itself could not be opened by WebFetch in this run (permission request not answered); the fetcher
# (scripts/fetchers/atmospheric_co2.py) read it in a dry run, which reported "No change" for all 67 years before this went live.
# Values are given to two decimal places as NOAA publishes them.
id: atmospheric-co2
title: Atmospheric CO2 at Mauna Loa
domain: earth
subfield: Climate and pollution
status: live
summary: The yearly average concentration of carbon dioxide in the air, measured at the Mauna Loa Observatory since 1958.
  It is the longest continuous record of the gas that drives most of the warming, and it shows how far the atmosphere
  has moved away from its pre-industrial level.
metric:
  name: Annual mean CO2 concentration, Mauna Loa Observatory
  unit: ppm
  direction: lower
  scale: linear
  explainer: 'Carbon dioxide is measured as a dry-air mole fraction, in parts per million, at Mauna Loa on the island of
    Hawaii. The site sits high above the local vegetation and far from big cities, so the readings track the global
    background. Each year is the average of all the valid measurements taken that year. The number rises every year because
    burning fossil fuels puts more carbon into the air than natural sinks remove. The yearly rise also varies with
    climate and vegetation, so single-year jumps say less than the long trend. Progress here means a slower rise and,
    eventually, a fall.'
chart:
  primary: record-chart
series:
- id: mauna-loa-annual
  label: Mauna Loa annual mean
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'NOAA updates the annual mean once a year, early in the year after. To update, run the atmospheric_co2 fetcher or
    open the NOAA file and add any new year. The fetcher refuses to drop existing years or change existing values.'
sources:
- id: noaa-mlo-annual
  name: 'NOAA Global Monitoring Laboratory, trends in atmospheric carbon dioxide, Mauna Loa annual mean'
  url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_annmean_mlo.txt
  kind: dataset
  primary: true
  notes: 'Public domain (US government work). Dataset page: https://gml.noaa.gov/ccgg/trends/. This file was not opened by
    WebFetch in this run; its values come from the GitHub copy below and are to be checked by the fetcher dry run.
    Credit line suggested: "Data: NOAA Global Monitoring Laboratory".'
- id: github-co2-ppm-copy
  name: 'datasets/co2-ppm, Mauna Loa annual CO2 CSV (GitHub copy of the NOAA annual means)'
  url: https://raw.githubusercontent.com/datasets/co2-ppm/master/data/co2-annmean-mlo.csv
  kind: dataset
  notes: 'Opened 2026-11-10. Used only to seed the observations; not copied into the repository. Its licence was not checked,
    so no dataset folder was made. Values must match NOAA (checked by the fetcher).'
- id: noaa-400ppm-news
  name: 'NOAA GML news, CO2 at Mauna Loa Observatory reaches new milestone: tops 400 ppm (10 May 2013)'
  url: https://gml.noaa.gov/news/7074.html
  kind: press
  notes: 'Opened 2026-11-10. NOAA and Scripps both report the daily mean, not a monthly or annual mean.'
- id: scripps-may-2026-peak
  name: 'UC San Diego Today, Annual carbon dioxide peak reaches 432 parts per million (11 June 2026)'
  url: https://today.ucsd.edu/story/annual-carbon-dioxide-peak-reaches-432-parts-per-million
  kind: press
  notes: 'Opened 2026-11-10. Scripps gives 432.00 ppm for May 2026; the article quotes NOAA at 432.3 ppm and does not explain
    the difference. Monthly peak, not an annual mean; not in the observations.'
events:
- date: '2013-05-10'
  kind: milestone
  title: Daily average CO2 at Mauna Loa passes 400 ppm for the first time
  why_it_matters: The air over Hawaii crossed a symbolic line that had not been reached since measurements began in 1958.
  url: https://gml.noaa.gov/news/7074.html
- date: '2026-06-11'
  kind: milestone
  title: The May 2026 monthly peak at Mauna Loa reaches about 432 ppm
  why_it_matters: The seasonal peak is now more than 30 ppm above where the record stood when the 400 ppm line was first passed.
  url: https://today.ucsd.edu/story/annual-carbon-dioxide-peak-reaches-432-parts-per-million
