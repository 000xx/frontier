- id: carbonbrief-2025-record
  name: Carbon Brief, Analysis: fossil-fuel CO2 emissions to set new record in 2025, as land sink recovers (13 November 2025)
  url: https://www.carbonbrief.org/analysis-fossil-fuel-co2-emissions-to-set-new-record-in-2025-as-land-sink-recovers/
