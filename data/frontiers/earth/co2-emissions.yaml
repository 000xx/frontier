  url: https://ourworldindata.org/grapher/annual-co2-emissions-per-country
  kind: dataset
  primary: true
  notes: 'Page opened 2026-11-09. Data licence CC BY 4.0 (Our World in Data), with the Global Carbon Project as the original
    provider. Credit line suggested: "Data: Global Carbon Budget (2025), processed by Our World in Data".'
