# Observations are yearly world emissions of carbon dioxide from fossil fuels and cement, in billion tonnes, for 1900 onward.
# They come from Our World in Data's copy of the Global Carbon Budget (annual-co2-emissions-per-country, World rows),
# which is CC BY 4.0 with the Global Carbon Project as the original provider. The grapher CSV could not be opened by WebFetch
# in this run (only its page), so the values are to be written from the fetcher (scripts/fetchers/co2_emissions.py) dry-run log,
# which reads the same CSV; the file's observations are filled in only from that log and then checked to match.
id: co2-emissions
title: World fossil CO2 emissions
domain: earth
subfield: Climate and pollution
status: draft
summary: The yearly carbon dioxide released by burning fossil fuels and making cement, summed over the world.
  It is the main flow that adds to the atmospheric build-up, so it shows whether the climate problem is shrinking.
metric:
  name: Annual CO2 emissions from fossil fuels and cement, world
  unit: Gt CO2
  direction: lower
  scale: linear
  explainer: 'Each year, the carbon in coal, oil and gas burned, plus the carbon released when cement is made, is
    converted to tonnes of carbon dioxide and added up for every country. The total excludes land-use change such as
    forest clearing, which is tracked separately in the carbon budget. Emissions are territorial, so goods made in one
    country and used in another count where they are made. The number has risen for most of the period since 1900, with
    short dips in wars and recessions. Progress means emissions falling steadily, not only in one year.'
chart:
  primary: record-chart
series:
- id: world-fossil-co2
  label: World fossil CO2 and cement
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'The Global Carbon Budget is published each November, and the Our World in Data copy follows it. Update by running
    the co2_emissions fetcher once the new year appears in the World rows. Fossil CO2 for the latest year is revised in
    later editions, so revised values are written and flagged for review.'
sources:
