  title: The Global Carbon Project projects a further rise in fossil CO2 for 2025
  why_it_matters: The year's projected rise of about one percent means the annual fossil total keeps climbing rather than turning down.
  url: https://cger.nies.go.jp/gcp/news/20251113.html
- date: '2025-11-13'
  kind: milestone
  title: Analysts expect 2025 to be a new record for fossil and cement CO2
  why_it_matters: The projection puts the yearly total at a new peak of about 38 billion tonnes, which is the level the cuts have to bring down from.
  url: https://www.carbonbrief.org/analysis-fossil-fuel-co2-emissions-to-set-new-record-in-2025-as-land-sink-recovers/
