# Observations are annual global mean surface temperature anomalies, in degrees Celsius against NASA's 1951 to 1980 baseline, for 1880 to 2025.
# They come from NASA GISS's Global Land-Ocean Temperature Index (GLB.Ts+dSST.csv), which is public domain.
# The values were seeded from a GitHub copy of the GISTEMP annual rows (datasets/global-temp, opened 2026-11-10), then 12 values
# were corrected to NASA's two-decimal figures. The NASA CSV was not opened by WebFetch in this run; the fetcher dry run
# (scripts/fetchers/global_temperature.py) read it and reports "No change" for every year.
id: global-temperature
title: Global surface temperature
domain: earth
subfield: Climate and pollution
status: live
summary: The average temperature of the Earth's land and ocean surface, shown as the difference from a fixed 1951 to 1980 baseline.
  It is the headline measure of how much the planet has warmed, year by year.
metric:
  name: Annual global surface temperature anomaly (land and ocean)
  unit: °C
  direction: lower
  scale: linear
  explainer: 'Each year, thousands of weather stations on land and ship and buoy measurements at sea are combined into a
    global average. That average is compared with the average for 1951 to 1980, so the number is an anomaly, not a
    temperature. A value of zero means no change from that baseline. The series rises because the atmosphere is warming,
    and single years wobble with natural cycles such as El Nino, so the long trend matters more than one year. Progress
    here means a slower rise and, eventually, no further warming.'
chart:
  primary: record-chart
series:
- id: gistemp-land-ocean
  label: NASA GISTEMP, land and ocean annual mean
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'NASA GISS revises past years as data are corrected, so each update can change older values. The fetcher
    writes any revised value and refresh review rules then decide whether it is merged automatically. NASA publishes
    the annual figure only once the year is complete, so the current year is left out until then.'
sources:
- id: nasa-gistemp-annual
  name: NASA GISS, Global Land-Ocean Temperature Index (GISTEMP v4), annual means
  url: https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv
  kind: dataset
  primary: true
  notes: 'US government work, public domain. Credit line suggested: "Data: NASA Goddard Institute for Space Studies (GISTEMP)".
    Not opened by WebFetch in this run (permission request not answered); values are checked by the fetcher dry run.
    Dataset page: https://data.giss.nasa.gov/gistemp/.'
- id: github-global-temp-copy
  name: datasets/global-temp, annual GISTEMP rows (GitHub copy)
  url: https://raw.githubusercontent.com/datasets/global-temp/master/data/annual.csv
  kind: dataset
  notes: 'Opened 2026-11-10. Used only to seed observations; not copied into the repository. Licence not checked.'
- id: nasa-2024-warmest
  name: NASA Scientific Visualization Studio, 2024 is the Warmest Year on Record (published 10 January 2025)
  url: https://svs.gsfc.nasa.gov/14743
  kind: press
  notes: 'Opened 2026-11-10. States 2024 was about 1.28 degrees above the 1951 to 1980 baseline.'
- id: copernicus-2024-threshold-press
  name: Xinhua report via The Star, Earth passes critical climate change threshold in 2024 (11 January 2025)
  url: https://www.thestar.com.my/news/world/2025/01/11/earth-passes-critical-climate-change-threshold-in-2024-scientists
  kind: news
  notes: 'Opened 2026-11-10. Relays Copernicus Climate Change Service findings; not read directly from Copernicus.'
events:
- date: '2025-01-10'
  kind: milestone
  title: NASA's analysis puts 2024 as the warmest year in the modern record
  why_it_matters: The year averaged about 1.28 degrees above the 1951 to 1980 baseline, the highest annual value in this series so far.
  url: https://svs.gsfc.nasa.gov/14743
- date: '2025-01-10'
  kind: milestone
  title: Copernicus says 2024 was the first calendar year to pass a milestone set by world leaders
  why_it_matters: A separate European analysis reached the same record year and tied it to the long-term warming goals.
  url: https://www.thestar.com.my/news/world/2025/01/11/earth-passes-critical-climate-change-threshold-in-2024-scientists
