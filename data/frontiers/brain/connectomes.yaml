id: connectomes
title: Connectomes
domain: brain
subfield: Mapping and reading the brain
status: live
summary: The largest brain or whole-nervous-system wiring diagram ever completed, counted by neurons, from a
  worm with 302 neurons to a fly's brain and nerve cord with about 166,000. Each step has come from a map that
  traces every cell and connection, not a sample.
metric:
  name: Neurons in the largest complete connectome
  unit: neurons
  direction: higher
  scale: log
  explainer: 'A connectome is a wiring diagram: every neuron in an animal''s nervous system, and every connection
    between them, traced from electron-microscope images of slices of tissue. Counting neurons is a rough
    measure of how much of a nervous system has been mapped, and it is the only measure we track here.
    Only complete maps count, meaning every neuron in the chosen part of the nervous system has been traced.
    Larger partial maps, such as a single region or a sample of cubic millimetres of mouse cortex, are
    reported as events but are not counted as records, because a sample cannot be compared with a whole
    nervous system. Human connectomes are not yet close: no complete human map exists.'
chart:
  primary: record-chart
  secondary:
  - scale-ladder
  - coverage-meter
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Records were read from press releases and a news summary of each paper, because the Nature
    (FlyWire) and Cell (male central nervous system) papers could not be opened from the update environment.
    Check the papers themselves at the next run. The Janelia release gives a count of more than 166,000 neurons
    while Sci.News reports 166,700; the record keeps 166000, the lower figure the release states. MICrONS
    (mouse cortex) is an event, not a record, because it is a sample of about 200,000 cells, not a complete
    nervous system. Partial fly maps, such as the adult nerve cord and central brain, are also left out of
    records for the same reason. Owner to confirm this rule for "complete".'
