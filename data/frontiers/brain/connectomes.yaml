  kind: paper
  title: MICrONS cubic millimetre of mouse cortex in Nature
  why_it_matters: Maps more than 200,000 cells and 523 million synapses in a sample of mouse cortex; a large step, but a sample rather than a complete nervous system, so it is not a record.
  url: https://sciencedaily.com/releases/2025/04/250409114838.htm
