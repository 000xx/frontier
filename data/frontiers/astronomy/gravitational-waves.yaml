# Observations are generated by hand from the catalog releases listed under sources.
id: gravitational-waves
title: Gravitational-wave detections
domain: astronomy
subfield: Stars, black holes and signals
status: live
summary: The running count of confident gravitational-wave detections from merging black holes and neutron
  stars, counted by the LIGO, Virgo and KAGRA catalog release that reports them. Each release adds a batch
  of events from one observing run, so the count rises in steps rather than continuously.
metric:
  name: Confident gravitational-wave detections (cumulative)
  unit: events
  direction: higher
  scale: linear
  explainer: 'A gravitational wave is a ripple in space-time, and the detectors are kilometre-scale laser
    interferometers that measure it. A candidate counts as a detection in the catalogs only when its probability
    of being a real astrophysical signal, not detector noise, is above 0.5. The collaborations publish
    their results in catalog releases that each cover one observing run or part of one, so the total only
    moves when a new release is out, and an earlier release can be revised by a later one.'
chart:
  primary: record-chart
  secondary:
  - live-counter
series:
- id: cumulative-all-runs
  label: Cumulative, all observing runs to date
- id: o3a-catalogs
  label: Third observing run, first half (O3a) catalogs
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Check the LIGO, Virgo and KAGRA catalog pages first, then GWOSC, for any release after GWTC-4.0.
    GWTC-5.0 is a draft on arXiv dated 24 June 2026 and is not yet counted here: its headline total of
    390 does not reconcile with the 218 in GWTC-4.0 and needs checking against the final release. No reading
    list yet: none of the links were opened for this purpose.'
