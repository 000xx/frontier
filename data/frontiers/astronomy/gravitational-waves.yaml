  value: 90
  series: cumulative-all-runs
  source: gwtc-3-record
  note: 'GWTC-3, end of O3b (1 November 2019 to 27 March 2020 UTC). Stated as 90 candidates with p_astro above 0.5 across the first three observing runs; 17 are reported for the first time.'
- date: '2024-01'
