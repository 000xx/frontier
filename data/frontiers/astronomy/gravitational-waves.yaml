- date: '2019-10-01'
  value: 39
  series: o3a-catalogs
  source: gwtc-2-record
  note: 'GWTC-2, first half of O3 (1 April to 1 October 2019 UTC). Covers O3a only.'
- date: '2019-10-01'
  value: 44
  series: o3a-catalogs
  source: gwtc-2-1-arxiv
  note: 'GWTC-2.1, O3a only. Stated as a subset of 44 candidates with p_astro above 0.5, including 8 new high-significance candidates.'
