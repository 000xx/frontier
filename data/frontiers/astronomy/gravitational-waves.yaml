events:
- date: '2015-09-14'
  kind: milestone
  title: First direct detection of gravitational waves, GW150914, from two merging black holes
  why_it_matters: It proved that the detectors could catch a real ripple in space-time, and that black holes
    can pair up and merge.
  url: https://research.birmingham.ac.uk/en/publications/observation-of-gravitational-waves-from-a-binary-black-hole-merge/
- date: '2017-08-17'
  kind: milestone
  title: GW170817, the first merger of two neutron stars seen in gravitational waves and in light
  why_it_matters: Light from the same collision was seen by telescopes, which tied the signal to a specific
    galaxy and showed that these mergers forge heavy elements.
  url: https://ligo.org/science-summaries/GW170817MMA/
- date: '2025-08'
  kind: dataset
  title: LVK releases the O4a strain data alongside the GWTC-4.0 catalog
  why_it_matters: Public strain data let outside researchers recheck the catalog and find new signals themselves.
  url: https://ligo.org/science-summaries/O4a_catalog_omnibus/
- date: '2026-06-24'
  kind: paper
  title: GWTC-5.0 draft extends the catalog through the second part of the fourth run
  why_it_matters: A draft would add the second half of the fourth observing run, but its headline total still
    has to be reconciled with the earlier release before the count moves.
  url: https://arxiv.org/pdf/2605.27225
