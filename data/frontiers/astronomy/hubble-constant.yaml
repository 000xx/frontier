  group: Early universe
- id: cepheid-ladder
  label: Distance ladder calibrated with Cepheids
  group: Local
- id: red-giant-ladder
  label: Distance ladder calibrated with red giants (TRGB)
  group: Local
- id: lensing-time-delays
  label: Gravitationally lensed quasar time delays
  group: Local, no ladder
- id: masers
  label: Water megamasers
  group: Local, no ladder
- id: standard-sirens
  label: Gravitational-wave standard sirens
  group: Local, no ladder
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Each observation is one headline result, dated by its first arXiv submission, read from the abstract.
    Only headline values are recorded, not every variant in each paper. Open points for the owner:
    (1) the schema needs a metric direction, but neither higher nor lower is progress here; "higher" is a
    placeholder and the site should not call any value a record. (2) The two CCHP red-giant results quote
    statistical and systematic errors separately and give no total, so low and high are left out rather than
    combined by us; decide whether to show them added in quadrature. (3) The ACT DR6 value is a combination
    with Planck, CMB lensing and DESI DR1 baryon acoustic oscillations, since the abstract gives no ACT-only
    value. (4) The H0DN value is a community combination of several local methods, mostly the Cepheid ladder,
    and is filed under that series. (5) The WMAP nine-year abstract gives no H0 value, so WMAP is not included.
    Check for new SH0ES, CCHP, H0DN, TDCOSMO, ACT, SPT, Planck and DESI results.'
