events:
- date: '2017-10-16'
  kind: milestone
  title: First Hubble constant from gravitational waves
  why_it_matters: A single neutron-star merger gave a value with no distance ladder at all, opening a third,
    independent route that will sharpen as more mergers are seen.
  url: https://arxiv.org/abs/1710.05835
- date: '2021-12-08'
  kind: paper
  title: SH0ES reaches 1 km/s/Mpc precision and a 5σ gap with Planck
  why_it_matters: The local measurement became precise enough that chance alone could no longer explain the
    disagreement with the early-universe value.
  url: https://arxiv.org/abs/2112.04510
- date: '2024-08-12'
  kind: paper
  title: Red-giant distances from JWST give a value between the two camps
  why_it_matters: An independent ladder calibration sits closer to the microwave-background value, which keeps
    alive the possibility that the tension comes from measurement errors rather than new physics.
  url: https://arxiv.org/abs/2408.06153
- date: '2025-06-25'
  kind: paper
  title: South Pole Telescope alone gives 66.66, 6.2σ below SH0ES
  why_it_matters: A microwave-background experiment independent of Planck lands on the low side, so the
    early-universe value no longer rests on one satellite.
  url: https://arxiv.org/abs/2506.20707
- date: '2026-04-10'
  kind: paper
  title: Community consensus puts the local value at 73.50 ± 0.81
  why_it_matters: Pooling many local methods reached about 1% precision and widened the stated gap with the
    early universe to 7.1σ.
  url: https://www.aanda.org/articles/aa/abs/2026/04/aa57993-25/aa57993-25.html
