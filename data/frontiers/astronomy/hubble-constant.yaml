# Observations are transcribed by hand from paper abstracts; each value was read in this run.
# low and high are the value minus and plus the uncertainty quoted in the abstract (68% level).
# Where a paper quotes statistical and systematic errors separately with no total, low and high are left out.
id: hubble-constant
title: Hubble constant and the Hubble tension
domain: astronomy
subfield: The universe at large
status: live
summary: How fast the universe is expanding today, measured in two very different ways that no longer agree.
  Nearby distance measurements give about 73 km/s per megaparsec, while the early-universe light of the cosmic
  microwave background, read through the standard model of cosmology, gives about 67, and both camps have
  shrunk their error bars until the gap is hard to explain away.
metric:
  name: Hubble constant, H0
  unit: km/s/Mpc
  direction: higher
  scale: linear
  explainer: 'The Hubble constant says how fast galaxies recede for each unit of distance: a value of 70 means
    a galaxy one megaparsec away (about 3.3 million light years) moves away at about 70 km/s, and one twice as
    far at twice that speed. There are two broad ways to get it. The local route builds a distance ladder:
    nearby stars of known brightness (Cepheid variables, or the brightest red giants) calibrate the distances to
    galaxies that host type Ia supernovae, and the supernovae then reach far enough to see the expansion. Other
    local routes skip the ladder, using the delayed flicker of quasars seen through gravitational lenses, water
    masers orbiting black holes, or the gravitational waves from merging neutron stars. The early-universe
    route measures the pattern of hot and cold spots in the cosmic microwave background and works forward to
    today with the standard cosmological model. The "Hubble tension" is that the Cepheid ladder gives values
    near 73 while the microwave background gives near 67, each now with an uncertainty below one unit. If both
    are right, the standard model is missing something. One team using red giant stars gets values in between,
    so whether the tension is real physics or an unrecognised error in some measurements is still argued over.
    Progress here is shrinking error bars and agreement between independent methods, not a higher or lower
    number.'
