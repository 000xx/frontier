records:
- date: '2006-09-14'
  value: 6.96
  holder: Subaru Telescope team (M. Iye et al.)
  conditions: IOK-1; Lyman-alpha emission line at 9,682 Å, Subaru spectroscopy
  status: peer_reviewed
  source: iye-2006
  note: The abstract says spectroscopic galaxy redshifts had been limited to below 6.6 before this. Ono
    et al. (2012) later measured the same galaxy at z = 6.965 at higher resolution.
- date: '2011-07-15'
  value: 7.213
  holder: Subaru/Keck team (Y. Ono et al.)
  conditions: GN-108036; Lyman-alpha emission line, Keck/DEIMOS, seen in two separate observing runs
  status: peer_reviewed
  source: ono-2012
  url: https://arxiv.org/abs/1107.3159
- date: '2011-12-17'
  value: 7.215
  holder: Subaru team (T. Shibuya et al.)
  conditions: SXDF-NB1006-2; single emission line taken to be Lyman-alpha
  status: peer_reviewed
  source: shibuya-2012
  note: The redshift assumes the single detected line is Lyman-alpha, as the abstract states. Only 0.002
    above the previous record.
- date: '2013-10-22'
  value: 7.51
  holder: S. L. Finkelstein et al.
  conditions: z8_GND_5296; emission line at 1.0343 µm taken to be Lyman-alpha, Keck/MOSFIRE
  status: peer_reviewed
  source: finkelstein-2013
  note: The abstract calls the line likely Lyman-alpha and makes no explicit record claim.
- date: '2015-02-18'
  value: 7.7302
  holder: P. A. Oesch et al.
  conditions: EGS-zs8-1; Lyman-alpha emission line, Keck/MOSFIRE
  status: peer_reviewed
  source: oesch-2015
  note: The abstract says the measurement sets a new redshift record for galaxies.
- date: '2015-07-09'
  value: 8.683
  holder: A. Zitrin et al.
  conditions: EGSY8p7; emission line at about 7.5σ taken to be Lyman-alpha, Keck/MOSFIRE, seen on two
    nights
  status: peer_reviewed
  source: zitrin-2015
- date: '2016-03-01'
  value: 11.09
  holder: P. A. Oesch et al.
  conditions: GN-z11; Lyman break in Hubble WFC3/IR slitless grism spectrum
  status: peer_reviewed
  source: oesch-2016
  note: JWST NIRSpec spectra from several emission lines later gave z = 10.603 (Bunker et al. 2023), lower
    than this grism value but still the most distant galaxy known until December 2022.
- date: '2022-12-08'
  value: 13.2
  holder: JADES (E. Curtis-Lake et al.)
  conditions: JADES-GS-z13-0; Lyman break in JWST NIRSpec prism spectrum
  status: peer_reviewed
  source: curtis-lake-2022
  note: Value 13.20 from Table 1 of the paper. The paper says the highest spectroscopic redshift before
    it was GN-z11 at z = 10.957.
- date: '2024-05-28'
  value: 14.32
  holder: JADES (S. Carniani et al.)
  conditions: JADES-GS-z14-0; Lyman break in JWST NIRSpec spectrum, z = 14.32 (+0.08/−0.20)
  status: confirmed
  source: carniani-2024
  note: Two independent ALMA detections of an oxygen line (Schouws et al. 2025; Carniani et al.) confirmed
    the galaxy at z = 14.1793 ± 0.0007, lower than the NIRSpec value but within its error bar.
- date: '2025-05-16'
  value: 14.44
  holder: MoM survey (R. P. Naidu et al.)
  conditions: MoM-z14, COSMOS field; sharp Lyman break in JWST NIRSpec prism spectrum, z = 14.44 ± 0.02
  status: peer_reviewed
  source: naidu-2025
  note: Published in The Open Journal of Astrophysics on 2026-01-30 (refereed).
events:
- date: '2010-10-20'
  kind: paper
  title: A z = 8.55 galaxy claimed from a single faint line
  why_it_matters: Had it held up, it would have pushed the record past 8.5 five years early, and it shows how
    much rides on one faint emission line.
  url: https://arxiv.org/abs/1010.4312
- date: '2013'
  kind: setback
  title: Deeper spectra find no trace of the z = 8.55 line
  why_it_matters: An independent team with data that should have shown the line at 5σ saw nothing, so the
    claim is not counted as a record here.
  url: https://uhra.herts.ac.uk/id/eprint/4517/
- date: '2023-02-14'
  kind: paper
  title: JWST revises GN-z11 down from z = 11.09 to z = 10.603
  why_it_matters: Sharper spectra from several lines replaced the Hubble estimate, a reminder that a record
    value can move even when the galaxy stays among the most distant.
  url: https://arxiv.org/abs/2302.07256
- date: '2025-03-20'
  kind: milestone
  title: Two ALMA teams independently detect oxygen in JADES-GS-z14-0
  why_it_matters: A second instrument and a different kind of signal pinned the redshift at 14.18, turning a
    Webb break measurement into an independently confirmed one.
  url: https://astrobiology.com/2025/03/20/oxygen-has-been-discovered-in-the-most-distant-known-galaxy-jades-gs-z14-0/
- date: '2026-01-16'
  kind: paper
  title: PAN-z14-1 confirmed at z = 13.53, the fourth most distant galaxy known
  why_it_matters: More bright galaxies keep turning up near z = 14, which strengthens the case that the early
    universe made bright galaxies faster than models expected.
  url: https://arxiv.org/abs/2601.11515
