# Records are transcribed by hand from the papers listed under sources; each value was read in this run.
# Add a record only when a spectroscopic redshift beats every earlier one; photometric candidates never count.
id: most-distant-galaxy
title: Most distant galaxy
domain: astronomy
subfield: The universe at large
status: live
summary: The highest redshift measured with a spectrum for any galaxy, which is the same as asking how
  close to the Big Bang we have seen a galaxy. The record crept up by fractions of a redshift unit for a
  decade, then jumped from about 11 to above 14 once the James Webb Space Telescope began taking spectra.
metric:
  name: Highest spectroscopically confirmed galaxy redshift
  unit: redshift (z)
  direction: higher
  scale: linear
  explainer: 'Light from a distant galaxy is stretched on its way to us by the expansion of the universe.
    Redshift, written z, says by how much: at z = 14 every wavelength arrives fifteen times longer than
    it left. Higher redshift means the light set out earlier, so the record is also a record for how young
    a universe we have seen; a galaxy at z of about 14 is seen as it was roughly 300 million years after the
    Big Bang. Many faint galaxies have estimated redshifts from their colours in images, but those estimates
    can be badly wrong, for example when a dusty nearby galaxy mimics a distant one. Only a spectrum, which
    shows either a sharp drop in light at a known wavelength (the Lyman break) or a line from a known element,
    pins the redshift down, so only spectroscopic results count here. Even spectra can be revised: a faint
    line can fail to reappear in later data, and a low-resolution break gives a less precise value than a
    line does.'
chart:
  primary: record-chart
  secondary:
  - reign-timeline
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Every record was read from the paper abstract (arXiv) or, for JADES-GS-z13-0, from the paper
    text and Table 1. Dates are the first arXiv submission dates. A record is a galaxy whose spectroscopic
    redshift beats every earlier spectroscopic galaxy redshift; quasars and gamma-ray bursts are not
    counted. Coverage starts in 2006 (IOK-1); earlier records are not yet added. Open points for the owner:
    (1) UDFy-38135539 (Lehnert et al. 2010, z = 8.5549, Nature) is left out of the records because an
    independent team could not reproduce its line (Bunker et al. 2013); it is listed as events instead. The
    claim was never withdrawn, so it is not marked retracted; decide whether it should appear on the chart.
    (2) GN-z11 is recorded at its 2016 grism value of z = 11.09; JWST spectra later put it at 10.603, which is
    still a z > 10 galaxy, so the record stands with a note. (3) JADES-GS-z14-0 is recorded at its NIRSpec
    value of 14.32; two ALMA detections refined it to about 14.18. MoM-z14 at 14.44 beats both values.
    (4) The journal for Curtis-Lake et al. was not confirmed from the publisher in this run; Wikipedia
    cites it as published in a Nature journal. (5) The Open Journal of Astrophysics page for MoM-z14 could
    not be opened (blocked fetch); the journal, volume and DOI come from the ISTA repository record.
    Check arXiv astro-ph.GA and JWST programme news for new z_spec claims; ignore photometric candidates.'
