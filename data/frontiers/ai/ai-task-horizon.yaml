events:
- date: '2025-03-18'
  kind: paper
  title: METR introduces the 50% time horizon and finds it doubling about every seven months
  why_it_matters: It turned scattered benchmark scores into one human-scaled number with a long trend,
    which became a common yardstick for forecasting AI agent progress.
  url: https://arxiv.org/abs/2503.14499
- date: '2026-01-22'
  kind: paper
  title: METR note sets out what the time horizon does and does not measure
  why_it_matters: Its own authors warn that the number is not how long an agent can work alone, varies
    a lot by domain, and has error bars of about a factor of two.
  url: https://metr.org/notes/2026-01-22-time-horizon-limitations/
- date: '2026-01-29'
  kind: dataset
  title: METR releases Time Horizon 1.1 with a larger task suite and new infrastructure
  why_it_matters: More long tasks tightened the estimates for top models, moved some models' values by
    more than half, and put the post-2023 doubling time near four months.
  url: https://metr.org/blog/2026-01-29-time-horizon-1-1/
- date: '2026-03-03'
  kind: news
  title: METR corrects a regularisation error in its curve fitting
  why_it_matters: The fix lowered recent models' 50% horizons by up to 20%, so figures published before
    March 2026 are not comparable with later ones.
  url: https://metr.org/notes/2026-03-20-impact-of-modelling-assumptions-on-time-horizon-results/
- date: '2026-05-08'
  kind: milestone
  title: METR puts an early Claude Mythos Preview at 16 hours or more, beyond what its tasks can reliably
    measure
  why_it_matters: It is the first result METR flags as past the reliable range of its own suite, with
    a 95% interval running from about 8.5 to 55 hours.
  url: https://the-decoder.com/metr-says-it-can-barely-measure-claude-mythos-palo-alto-networks-warns-of-autonomous-ai-attackers/
- date: '2026-09-08'
  kind: setback
  title: METR stops actively updating its time-horizons page
  why_it_matters: The best-known public series of agent horizons has no scheduled new entries, so later
    frontier models may go unmeasured on this scale.
  url: https://metr.org/time-horizons/
