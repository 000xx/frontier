- level: 5min
  title: Measuring AI Ability to Complete Long Software Tasks (blog post)
  author: METR
  kind: article
  url: https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/
- level: 1hr
  title: Clarifying limitations of time horizon
  author: Thomas Kwa (METR)
  kind: article
  url: https://metr.org/notes/2026-01-22-time-horizon-limitations/
  note: What the number does not mean, from one of the paper's authors.
- level: deep
  title: Measuring AI Ability to Complete Long Software Tasks (NeurIPS 2025)
  author: Thomas Kwa, Ben West, Joel Becker et al.
  kind: paper
  url: https://arxiv.org/abs/2503.14499
about:
  what: "The length of software task an AI agent can complete on its own, measured by how long the same task takes a skilled person. METR, the group behind the measure, reports the task length at which an agent succeeds about half the time."
  why: "Most benchmark scores say little about whether a system can carry a long piece of work through to the end. Task length is a more direct sign of how much real work could be handed over, which bears on both the economic effect of AI and its risks."
