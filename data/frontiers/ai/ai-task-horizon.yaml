id: ai-task-horizon
title: AI task-completion time horizon
domain: ai
subfield: Capability
status: paused
summary: How long a software task can be, measured in the time a skilled human needs for it, before frontier
  AI agents fail it as often as they succeed, according to METR's measurements. It is the most widely
  cited single number for how fast AI agents are getting more capable at long, multi-step work.
metric:
  name: 50% task-completion time horizon
  unit: minutes of human expert time
  direction: higher
  scale: log
  explainer: 'METR collects a few hundred software engineering, machine-learning research and cybersecurity
    tasks and times skilled people doing them, from a few seconds to many hours. It then runs an AI agent
    on every task several times, fits a curve of the agent''s success rate against the human time for
    each task, and reads off the task length at which the agent is predicted to succeed half the time.
    A 2-hour horizon means the agent succeeds about half the time on tasks that take a skilled human
    about 2 hours. It does not mean the agent works for 2 hours (agents are usually much faster than
    people), that it can do any 2-hour job, or that its work is reliable enough to hand over: at an
    80% success rate METR''s horizons are several times shorter. The number only applies to METR''s
    own kind of task, which is well specified and automatically scored; METR finds much shorter horizons
    on messier tasks and in other domains such as visual computer use. The error bars are wide, often
    a factor of two or more each way, and grow for the strongest models because METR''s suite has few
    tasks they cannot already do; METR says results above about 16 hours are unreliable. METR has changed
    its task suite (Time Horizon 1.0 had 170 tasks, 1.1 has 228) and corrected its curve fitting in
    March 2026, and each change shifts every model''s number, so values are only comparable within one
    series on this chart. The long-run trend, a doubling roughly every seven months since 2019 and faster
    since 2024, is what METR itself treats as the main result, more than any single model''s value.'
chart:
  primary: record-chart
  secondary:
  - forecast-fan
  - pace-board
series:
- id: paper-neurips-2025
  label: Original paper (NeurIPS 2025)
  group: Time Horizon 1.0 task suite
- id: th1-0-jan-2026
  label: Time Horizon 1.0, METR estimates as of 29 Jan 2026
  group: Time Horizon 1.0 task suite
- id: th1-1-jan-2026
  label: Time Horizon 1.1, first estimates (29 Jan 2026, before the March 2026 fit correction)
  group: Time Horizon 1.1 task suite
- id: th1-1-corrected
  label: Time Horizon 1.1, after the 3 March 2026 fit correction (current; incomplete)
  group: Time Horizon 1.1 task suite
update:
  cadence: quarterly
  last_checked: '2026-11-10'
  notes: 'Paused on 2026-11-09: on 2026-09-08 METR said its time-horizons page is no longer actively updated,
    so the site''s main AI capability line is now the ai-capabilities-index frontier (Epoch Capabilities
    Index). The th1-1-corrected series was filled from METR''s benchmark_results_1_1.yaml by the refresh
    workflow; scripts/fetchers/ai_task_horizon.py still runs daily and will add any model METR publishes
    later. Pre-correction series are kept on purpose: they are what METR published at the time, they are
    labelled by method and date so they are never mixed with corrected values, and the project rules
    say superseded values get a note rather than deletion. Claude Mythos Preview (early) is kept as an
    event only: METR''s figure is a lower bound (at least 16 hours) with no point estimate, which a record
    value cannot express. Epoch AI''s benchmark_data.zip also carries a copy of METR''s horizons (metr_time_horizons_external.csv),
    which could serve as a cross-check.'
sources:
- id: metr-time-horizons
  name: METR, "Task-Completion Time Horizons of Frontier AI Models" (live page and data)
  url: https://metr.org/time-horizons/
  kind: dataset
  primary: true
  notes: Links agent results at https://metr.org/assets/benchmark_results_1_1.yaml and task results at
    https://metr.org/assets/task_results_1_1.yaml. Page footer reads "© 2026 METR. All rights reserved."
    and no data licence is stated, so nothing is copied; records cite METR's published figures. Update
    log, read 2026-11-09, shows models added up to Claude Mythos Preview (early) on 2026-05-08, a fitting
    correction on 2026-03-03, and on 2026-09-08 a note that the page is no longer actively updated. Caveats
    METR gives on the page are that results above 16 hours are unreliable with the current suite; some models were
    measured long after release and others not at all, so the page is not a full record of the most capable
    models; human baseline times probably overstate how long experienced professionals take; and the tasks
    are mostly software, ML and cybersecurity, so the number does not describe automation of whole jobs.
    The per-model table is drawn by script from the YAML and is not in the page text.
- id: metr-th11-post
  name: METR, "Time Horizon 1.1" (29 January 2026)
  url: https://metr.org/blog/2026-01-29-time-horizon-1-1/
  kind: report
  notes: Table "Changes to Model Horizon Estimates" gives each model's 50% horizon and confidence interval
    under TH1 and TH1.1. Figures predate the 3 March 2026 fitting correction and the post carries no
    erratum. All rights reserved.
- id: metr-paper
  name: T. Kwa, B. West, J. Becker et al. (METR), "Measuring AI Ability to Complete Long Software Tasks",
    NeurIPS 2025 (Advances in Neural Information Processing Systems 38), arXiv:2503.14499
  url: https://proceedings.neurips.cc/paper_files/paper/2025/hash/85069585133c4c168c865e65d72e9775-Abstract-Conference.html
  kind: paper
  notes: Refereed, Main Conference Track; DOI 10.52202/085713-3086. Values were read from the proceedings
    PDF. The arXiv version is licensed CC BY 4.0. The paper gives most per-model horizons only in figures;
    only those printed as numbers are used.
- id: metr-github
  name: METR, eval-analysis-public (GitHub)
  url: https://github.com/METR/eval-analysis-public
  kind: dataset
  notes: Source of the model release dates used as record dates (data/external/release_dates.yaml, read
    2026-11-09 via raw.githubusercontent.com). The README says "See LICENSE file" but the repository
    has no licence file, so default copyright applies and no file is copied here. Computed horizons are
    DVC outputs and are not committed; rechecked 2026-11-09 at commit 52cb829 (5 March 2026), which still
    has no benchmark_results_1_1.yaml. Its release-date file stops at models released up to 5 February 2026
    (Claude Opus 4.6, GPT-5.3-Codex); GPT-5.4, Gemini 3.1 Pro and Claude Mythos Preview are not in it.
- id: metr-modelling-note
  name: A. Barry (METR), "Impact of modelling assumptions on time horizon results" (research note, 20 March
    2026)
  url: https://metr.org/notes/2026-03-20-impact-of-modelling-assumptions-on-time-horizon-results/
  kind: report
  notes: Describes the 3 March 2026 fix to the logistic fit and how alternative modelling choices move
    the estimates. METR notes get less review than its research posts.
- id: metr-limitations-note
  name: T. Kwa (METR), "Clarifying limitations of time horizon" (research note, 22 January 2026)
  url: https://metr.org/notes/2026-01-22-time-horizon-limitations/
  kind: report
- id: decoder-mythos
  name: The Decoder, "METR says it can barely measure Claude Mythos" (10 May 2026)
  url: https://the-decoder.com/metr-says-it-can-barely-measure-claude-mythos-palo-alto-networks-warns-of-autonomous-ai-attackers/
  kind: news
