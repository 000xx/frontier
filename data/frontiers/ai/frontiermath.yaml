  kind: paper
  title: FrontierMath paper released, with the best models solving under 2% of problems
  why_it_matters: Set a maths test built to stay unsolved for years, with fresh problems that models
    could not have memorised.
  url: https://arxiv.org/abs/2411.04872
- date: '2025-01-23'
  kind: news
  title: Epoch sets out OpenAI's funding of FrontierMath and its access to the problems
  why_it_matters: Readers need to know that one developer owns and can see most of the core problems;
    Epoch keeps a holdout set with unseen solutions to check results.
  url: https://epoch.ai/blog/openai-and-frontiermath
- date: '2026-06-12'
  kind: dataset
  title: Epoch releases FrontierMath v2 after finding errors in 42% of problems
  why_it_matters: Scores on the corrected set are not directly comparable with the original, which is
    why this page tracks the two versions separately.
  url: https://epoch.ai/benchmarks/frontiermath-tiers-1-3-v2
