id: frontiermath
title: AI on FrontierMath research-level maths problems
domain: ai
subfield: AI doing science
status: live
summary: The best score any AI model has reached on FrontierMath Tiers 1 to 3, a set of several hundred
  unpublished, hard maths problems written by mathematicians, as evaluated by Epoch AI. It shows how far
  models are from doing the kind of mathematics that takes experts hours or days.
metric:
  name: Best FrontierMath Tiers 1-3 score
  unit: '% of problems solved'
  direction: higher
  scale: linear
  limit:
    value: 100
    label: Every problem solved
    source: epoch-benchmarks
  explainer: 'FrontierMath is a benchmark made by Epoch AI with expert mathematicians. Each problem is
    new and unpublished, so a model cannot have seen it during training, and each has an exact answer
    that a computer checks automatically, with no human grading. The problems are sorted by difficulty:
    Tiers 1 to 3 hold problems that would take an expert researcher hours, and the hardest days, and a
    smaller Tier 4 goes further still. Models work on each problem with a Python environment, can run
    code to test ideas, and submit an answer that is either right or wrong. When the benchmark appeared in
    late 2024 the best models solved under 2% of problems. In June 2026 Epoch released a corrected second
    version after finding errors in many problems, so this page keeps the two versions as separate lines
    rather than joining them. A high score means a model can reliably reach correct answers to hard,
    well-posed problems; it does not mean the model can choose good research questions or write full
    proofs. Two caveats: the benchmark was funded by OpenAI, which owns the core problems and can see most
    of them, although Epoch keeps a holdout set whose solutions OpenAI has not seen; and scores come from
    Epoch''s own runs, which can differ from numbers that developers report.'
chart:
  primary: record-chart
  secondary:
  - threshold-gauge
series:
- id: tiers-1-3-v1
  label: Tiers 1-3, original version
- id: tiers-1-3-v2
  label: Tiers 1-3, corrected version (v2, from June 2026)
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Records are rebuilt from Epoch''s benchmark_data.zip by scripts/fetchers/frontiermath.py; do
    not edit them by hand. Values are Epoch''s mean_score column times 100, rounded to two decimals; the
    file also has a "Best score (across scorers)" column, which is not used. A model is a record when its
    score beats every model with an earlier release date in the same version. Dates are model release
    dates as Epoch lists them, not evaluation dates, so a model evaluated late can enter the record line
    at an earlier date. Status confirmed is used because Epoch, an independent organisation, runs the
    evaluations. Tier 4 and FrontierMath Erdos are in the same file but not tracked here.'
