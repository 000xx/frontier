# Edit the other fields by hand; never edit the records directly.
id: ai-capabilities-index
title: AI general capability (Epoch Capabilities Index)
domain: ai
subfield: Capability
status: live
summary: The best general capability score any AI model has reached, on Epoch AI's Epoch Capabilities
  Index, which pools results from more than 50 benchmarks into one scale. It replaces METR's time horizon
  as this site's main AI capability line, because Epoch updates it as new models come out.
metric:
  name: Epoch Capabilities Index (ECI)
  unit: ECI points
  direction: higher
  scale: linear
  explainer: 'Any single AI benchmark has a short useful life: it starts too hard for every model, then
    within a year or two the best models score near the top and it stops telling them apart. Epoch AI''s
    index gets around this by putting many benchmarks on one shared scale. It treats each benchmark as
    having a difficulty and each model as having a capability, and fits both at once from every result
    it has, so a model is credited more for doing well on hard benchmarks than on easy ones. Because old
    and new benchmarks overlap in the models they test, a 2023 model and a 2026 model can be placed on
    the same scale even though no single test fits both. The numbers are only meaningful relative to each
    other: in the current file Claude 3.5 Sonnet sits at 130 and GPT-5 at 150, and a gap of a few points
    is within Epoch''s uncertainty for most models. Every time Epoch adds results it refits the whole
    scale, so past models'' scores can shift slightly; this site follows Epoch''s latest file rather than
    freezing old values. The index measures what benchmarks measure, mostly knowledge, reasoning, maths
    and coding questions with checkable answers, not how useful a model is for open-ended real work. The
    open-weights line shows the best model whose weights anyone can download, which tends to trail the
    overall frontier by some months.'
chart:
  primary: record-chart
  secondary:
  - pace-board
series:
- id: all-models
  label: Best model of any kind
- id: open-weights
  label: Best open-weights model
update:
  cadence: weekly
  last_checked: '2026-11-12'
  notes: 'Records are rebuilt automatically each day from Epoch''s file by scripts/fetchers/epoch_eci.py;
    do not edit them by hand. Status confirmed is used because the scores are computed by Epoch, an independent
    research organisation, not announced by the model developers; some of the underlying benchmark results
    are from external sources that Epoch collects and cites. Dates are the model dates as Epoch lists
    them. Artificial Analysis was considered as the source: its Intelligence Index is published in numbered
    versions (v4.1 and so on), so a long-run line would need care across versions, and its API comes in
    tiers under its own Terms of Use and Data Platform Terms; Epoch (CC BY 4.0, open download) was chosen.'
sources:
- id: epoch-eci
  name: Epoch AI, Epoch Capabilities Index (scores file)
  url: https://epoch.ai/eci
  kind: dataset
  primary: true
  notes: Scores file https://epoch.ai/data/eci_scores.csv, copied unchanged to data/datasets/epoch-eci/
    (CC BY 4.0; credit line in NOTICE.md). Method documentation at https://epoch.ai/data/eci-documentation;
    fitting code at https://github.com/epoch-research/eci-public (MIT). Epoch also publishes per-benchmark
    results in https://epoch.ai/data/benchmark_data.zip, including a copy of METR's time horizons.
- id: epoch-benchmark-data
  name: Epoch AI, "Use this data" (benchmarking data and licence)
  url: https://epoch.ai/benchmarks/use-this-data
  kind: other
  notes: States that Epoch's data is free to use, distribute and reproduce with credit, under CC BY.
