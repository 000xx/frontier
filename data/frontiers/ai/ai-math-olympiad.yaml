id: ai-math-olympiad
title: AI at the International Mathematical Olympiad
domain: ai
subfield: AI doing science
status: live
summary: The best score an AI system has reached on the year's International Mathematical Olympiad
  problems, out of 42, from silver-medal level in 2024 to gold in 2025 and reported perfect scores in
  2026. It is a widely understood yardstick for AI mathematical reasoning.
metric:
  name: Best AI score on the year's IMO problems
  unit: points out of 42
  direction: higher
  scale: linear
  limit:
    value: 42
    label: Perfect score (six problems, 7 points each)
    source: deepmind-imo-2025
  explainer: 'The International Mathematical Olympiad is the world championship of school mathematics.
    Each July, secondary-school students from more than a hundred countries sit two papers of four and a
    half hours, with three problems in each. Every problem is worth 7 points, so 42 is a
    perfect score, and answers are full written proofs, marked by the IMO''s coordinators. Roughly one
    contestant in ten wins gold. The problems need no advanced theory but do need real insight,
    which made the IMO a long-standing target for AI. Comparing AI with students is not straightforward:
    early systems had problems translated by hand into a formal proof language and took days rather than
    hours, some labs had their answers graded by people they chose rather than by the IMO, and only some
    results were certified by IMO coordinators. Each record here says how the result was produced and
    who graded it. Status confirmed is used only where IMO coordinators graded and certified the result;
    a lab''s own announcement is claimed. A perfect score on the IMO does not mean an AI can do new
    research: olympiad problems are set so that a solution exists and fits in a few pages, which open
    research questions do not promise.'
chart:
  primary: record-chart
  secondary:
  - threshold-gauge
series:
- id: imo-score
  label: Best AI score on that year's IMO
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Facts transcribed from the pages listed in sources; no dataset exists. One record per system that
    set or matched the best score. Dates are announcement dates where known. The 2026 entries rest on a
    single newspaper report (Ambito, 2026-08-01) that names the companies but not the systems, gives the
    score only as the maximum, and does not say the IMO certified the results; the IMO''s 2026 edition page
    and other primary announcements could not be opened in this run, so they are claimed and dated by
    month. Check them against IMO or company announcements in the next run. OpenAI''s 2025 result was
    announced by the company and graded outside the IMO process. DeepSeekMath-V2''s gold-level result on
    the 2025 problems (5 of 6 solved) came months after the contest, so it is an event, not a record.'
