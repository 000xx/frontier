# Records are rebuilt from Epoch AI's benchmark data by scripts/fetchers/chess_puzzles.py.
# Edit the other fields by hand; never edit the records directly.
id: chess-puzzles
title: AI solving chess puzzles (Epoch chess puzzles benchmark)
domain: ai
subfield: Capability
status: live
summary: The best score any AI model has reached on Epoch AI's chess puzzles benchmark, 100 novel chess
  positions each with one best move judged by the Stockfish engine, as run by Epoch AI. It tests whether
  a model can find the strongest move in a position it has not seen before.
metric:
  name: Best chess puzzles score (Epoch AI runs)
  unit: '% of puzzles solved'
  direction: higher
  scale: linear
  limit:
    value: 100
    label: Every puzzle solved
    source: epoch-benchmarks
  explainer: 'Epoch AI published the chess puzzles benchmark on 10 December 2025. It has 100 novel puzzles,
    generated by a program with a chess engine, so they are not taken from published puzzle collections.
    The model is given each position as a FEN string, which is a standard text description of a board, and
    must submit the single best next move for the side to move. The best move is judged by Stockfish, a
    strong chess engine. Scoring is an exact match against the answer key. Epoch says the highest score by a
    frontier model was below 40% at launch, and it has since changed the scoring: version 2 scores are not
    directly comparable with version 1, and version 1 scores are no longer shown. A high score means a model
    can find the best move in fresh positions; it does not show ability at playing whole games.'
chart:
  primary: record-chart
  secondary:
  - threshold-gauge
series:
- id: epoch-runs
  label: Best model, Epoch AI runs
update:
  cadence: quarterly
  last_checked: '2026-11-13'
  notes: 'Records are rebuilt from Epoch''s benchmark_data.zip (member chess_puzzles.csv) by
    scripts/fetchers/chess_puzzles.py; do not edit them by hand. Values are Epoch''s mean_score times 100,
    rounded to two decimals. A model is a record when its score beats every model with an earlier release
    date. Dates are model release dates as Epoch lists them. Epoch says version 2 scores are not directly
    comparable with version 1 (see the benchmark page); the file is used as Epoch provides it.'
sources:
- id: epoch-benchmarks
  name: Epoch AI, Benchmarking hub data (benchmark_data.zip)
  url: https://epoch.ai/benchmarks/use-this-data
  kind: dataset
  primary: true
  notes: 'File https://epoch.ai/data/benchmark_data.zip (updated 2026-11-09 when read), member
    chess_puzzles.csv. Licence CC BY 4.0 for Epoch data. Credit line: "Data: Epoch AI, Benchmarking hub (epoch.ai/benchmarks), CC BY 4.0."'
events:
- date: '2025-12-10'
  kind: dataset
  title: Epoch publishes its chess puzzles benchmark, 100 novel positions scored against Stockfish
  why_it_matters: A test built from freshly generated positions, so a model cannot have memorised the answers.
  url: https://epoch.ai/benchmarks/chess-puzzles
- date: '2025-12-15'
  kind: news
  title: Epoch reports GPT-5.2 ranks first or second on most of its own benchmarks, including the new chess puzzles benchmark
  why_it_matters: Shows the benchmark was in use from its first weeks, and that top models were still far from solving it.
  url: https://substack.com/@epochai/note/c-187985664
