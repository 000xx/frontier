id: ai-data-centers
title: Power of the largest AI data center
domain: ai
subfield: Cost and scale
status: draft
summary: The electrical power capacity of the largest AI data center in operation or under construction
  at each date, as estimated by Epoch AI from satellite imagery, permits and company disclosures. It
  tracks how fast the physical build-out behind AI training is growing.
metric:
  name: Facility power of the largest tracked AI data center
  unit: MW
  direction: higher
  scale: log
  explainer: 'Training the largest AI models now needs hundreds of thousands of AI chips in one place,
    and the binding limit is often electricity: a site has to get grid connections, power plants or
    turbines, and cooling built before the chips can run. Power capacity is therefore a good single
    measure of how big an AI data center is. Developers rarely publish it, so Epoch AI estimates it
    independently. Its analysts look at satellite and aerial images of each site, count and size the
    cooling equipment such as chillers and cooling towers, and check the result against permits and
    company disclosures. From power they estimate how many chips the site can hold and
    what it cost. The figure used here is total facility power, which includes the computers plus cooling,
    lighting and other overheads; the computers alone draw less, and each record also gives that IT power.
    Epoch records each site''s status as of dated milestones, so the line steps up when a site expands or
    a bigger one comes online. Epoch also projects future milestones from construction plans; those are
    left off this line until their date has passed. The hub only covers the largest sites Epoch has
    identified, mostly in the United States, so a large site it has not yet found would be missing.'
chart:
  primary: record-chart
  secondary:
  - scale-ladder
  - pace-board
series:
- id: largest-site
  label: Largest tracked site
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Records are rebuilt from Epoch''s data_center_timelines.csv by scripts/fetchers/ai_data_centers.py;
    do not edit them by hand. A timeline row is a record when its facility power (Power (MW)) beats every
    row dated before it across all sites. Rows dated after the day of the run are Epoch''s projections and
    are skipped. Status confirmed is used because the figures are Epoch''s independent estimates, not
    developer announcements; they are estimates with real uncertainty, which the schema cannot express.'
