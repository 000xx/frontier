id: gpu-clusters
title: Largest tracked AI supercomputer (GPU clusters)
domain: ai
subfield: Cost and scale
status: live
summary: The largest AI compute cluster in Epoch AI's GPU Clusters data, measured in H100 equivalents by the
  date each one became operational. Epoch's dataset covers only part of the world's clusters, so this line
  shows the largest tracked cluster, not the largest that exists.
metric:
  name: Largest tracked AI cluster by H100 equivalents
  unit: H100-equivalents
  direction: higher
  scale: log
  explainer: 'A GPU cluster is a set of graphics chips linked together to train and run AI models. Epoch AI
    keeps a list of these clusters and supercomputers, drawn from model training reports, news articles, press
    releases and web searches, and it estimates each cluster''s size in H100 equivalents. The H100 is a widely
    used NVIDIA data-centre GPU, so the count compares different chips on one scale. Epoch says its dataset
    covers an estimated 10 to 20 per cent of existing global aggregate GPU cluster performance as of March 2025,
    so this page shows the largest tracked cluster, not the largest one that exists. Epoch also says planned
    systems carry lower confidence, so this page uses only clusters the dataset marks as existing. Epoch says its sources include training reports, news articles and press releases, so the counts are estimates. The line rises from 4 H100 equivalents in 2010 to 275,796 in 2025, nearly five orders of magnitude, which is why it uses a log scale. A large cluster does not by itself show that a model trained on it
    is better, since results also depend on the data, the algorithms and how long the run lasted.'
