update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Records are rebuilt from Epoch''s gpu_clusters.csv by scripts/fetchers/gpu_clusters.py; do not edit
    them by hand. The fetcher uses rows with Status "Existing" and Include in Standard Analysis "True" that have
    a first operational date and an H100-equivalent count. A cluster is a record when its count beats every
    cluster with an earlier first operational date. Status claimed is used because the counts and dates are
    Epoch estimates from public sources, not independent measurements. The dataset page says it was updated on
    13 March 2026; the file had 482 rows when read, while the page says over 500.'
