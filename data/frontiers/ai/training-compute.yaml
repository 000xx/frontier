id: training-compute
title: Training compute of the largest AI models
domain: ai
subfield: Cost and scale
status: draft
summary: The largest amount of computation used to train any notable AI model, by publication date, as
  estimated by Epoch AI. It is the clearest single measure of how fast AI training has scaled up.
metric:
  name: Estimated training compute of the largest notable model
  unit: FLOP
  direction: higher
  scale: log
  explainer: 'Training a neural network means running a huge number of arithmetic operations on numbers
    with a decimal point, called floating-point operations or FLOP. The total count for a training run is
    a rough measure of how much computing went into the model, and it depends on three things together:
    how big the model is, how much data it sees, and how many passes it makes over that data. Larger
    training runs have been the main way AI labs have made models more capable over the past fifteen
    years, which is why this number is watched closely, and why some rules, such as the EU AI Act, use a
    compute threshold to decide which models face extra obligations. Most developers do not publish the
    figure. Epoch AI, an independent research group, estimates it from what is disclosed: model size and
    data size, or the number and type of chips and how long they ran. Each estimate carries Epoch''s own
    confidence rating, and some of the largest recent figures are rough. The chart is a log scale because
    the record has grown by many powers of ten: each step up is a model that used more compute than any
    notable model published before it. Epoch counts a model as notable if it was state of the art, widely
    cited or widely used, or otherwise historically important, so very large but obscure runs may be
    missing.'
chart:
  primary: record-chart
  secondary:
  - scale-ladder
  - pace-board
series:
- id: notable-models
  label: Largest notable model
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Records are rebuilt from Epoch''s notable models file by scripts/fetchers/training_compute.py;
    do not edit them by hand. A model is a record when its estimated training compute beats every notable
    model with an earlier publication date. Status follows Epoch''s confidence rating for each estimate:
    confirmed when Epoch rates it Confident (an independent estimate from disclosed details), claimed
    otherwise (Likely, Speculative or no rating). The schema has no status for an independent but
    uncertain estimate, so claimed here does not mean the developer announced the figure. Epoch revises
    estimates and adds models, so past records can change between runs. The file itself is not copied;
    only the facts listed in each record are stored.'
