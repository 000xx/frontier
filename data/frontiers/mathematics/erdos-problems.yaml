# Items are generated by scripts/import_erdos_problems.py.
# Edit the other fields by hand; edit the dataset, not the items, for status changes.
id: erdos-problems
title: Erdős problems
domain: mathematics
subfield: Open problems
status: draft
summary: The problems Paul Erdős posed, as collected on erdosproblems.com, with the status of each and
  the stories behind recent progress. Since late 2025 AI systems have contributed to many of them, which
  makes the list a visible test of machine help in research mathematics.
metric:
  name: Problem status
  unit: problems
  direction: higher
  scale: linear
  explainer: 'Paul Erdős left behind more than a thousand problems in number theory, graph theory, geometry
    and other areas, and erdosproblems.com gathers them with a number for each. This page lists each problem
    with its status in the community database maintained by Thomas Bloom and Terence Tao (proved, disproved,
    otherwise solved, or open), links to its page, and the developments behind recent progress. The problems
    range from famous conjectures to questions that were simply overlooked, so a count of how many are
    solved says little. Since October 2026 erdosproblems.com no longer shows statuses or a solved count,
    so that the problems are read as questions to understand rather than as a scoreboard, and this page
    follows that choice: it shows no headline count or solved-over-time chart.'
chart:
  primary: problem-list
update:
  cadence: weekly
  last_checked: '2026-11-09'
  notes: Items come from scripts/import_erdos_problems.py. AI involvement comes from the AI-contributions
    wiki, which was frozen on 2026-06-30, so later AI contributions are not marked. Deliberately no solved
    count or count-over-time series, at the request implied by erdosproblems.com's 2026-10-06 change;
    revisit only with the maintainers' agreement.
sources:
- id: erdos-database
  name: Erdős problems database (teorth/erdosproblems), maintained by Thomas Bloom and Terence Tao
  url: https://github.com/teorth/erdosproblems
  kind: dataset
  primary: true
  notes: Apache-2.0. Crowdsourced and unofficial; erdosproblems.com is the more reliable source where
    they differ. Copied into data/datasets/erdos-problems/.
- id: ai-contributions-wiki
  name: AI contributions to Erdős problems (wiki of the teorth/erdosproblems repository)
  url: https://github.com/teorth/erdosproblems/wiki/AI-contributions-to-Erd%C5%91s-problems
  kind: other
  notes: No longer updated after 2026-06-30. Its authors ask that it not be read as a benchmark or leaderboard.
    Only per-problem facts are used, not its text.
- id: erdosproblems-com
  name: Erdős problems (erdosproblems.com), by Thomas Bloom
  url: https://www.erdosproblems.com/
  kind: registry
  notes: The official list each item links to. Since 2026-10-06 it no longer displays statuses or solved
    counts. No terms of use or licence found, so nothing is copied from it.
- id: quanta-2026-08
  name: 'Quanta Magazine: How AI tore through a mathematical community (2026-08-03)'
  url: https://www.quantamagazine.org/how-ai-tore-through-a-mathematical-community-20260803/
  kind: news
- id: epoch-frontiermath-erdos
  name: 'Epoch AI: Announcing FrontierMath: Erdős'
  url: https://epoch.ai/latest/announcing-frontiermath-erdos
  kind: report
events:
- date: '2025-08-31'
  kind: dataset
  title: Terence Tao launches a crowdsourced database of the Erdős problems
  why_it_matters: It gave every problem a machine-readable status, formalisation flag and sequence links,
    which is what makes counting progress across the whole list possible.
  url: https://terrytao.wordpress.com/2025/08/31/a-crowdsourced-project-to-link-up-erdosproblems-com-to-the-oeis/
- date: 2025-12
  kind: setback
  title: A claimed AI solution of problem 333 turns out to be in a 1977 paper by Erdős
  why_it_matters: It showed that an AI "solution" to a listed open problem can be a rediscovery, and pushed
    the community to search the literature before announcing results.
  url: https://www.quantamagazine.org/how-ai-tore-through-a-mathematical-community-20260803/
- date: '2026-01-12'
  kind: paper
  title: Write-up of the Lean proof resolving problem 728, found with GPT-5.2 Pro and Aristotle
  why_it_matters: The AI-contributions wiki regards this as the first autonomous, non-trivial AI solution
    of an Erdős problem, with the machine proof checked in Lean before a human wrote it up.
  url: https://arxiv.org/abs/2601.07421
- date: '2026-05-03'
  kind: paper
  title: Problem 1196 on primitive sets, first solved by an AI query, is written up and extended by Tao
    and co-authors
  why_it_matters: It was a problem experts had already worked hard on, and the new technique also settled
    several related conjectures.
  url: https://terrytao.wordpress.com/2026/05/03/primitive-sets-and-von-mangoldt-chains-erdos-problem-1196-and-beyond/
- date: '2026-05-20'
  kind: paper
  title: Mathematicians verify and condense an OpenAI counterexample to the unit distance conjecture (problem
    90)
  why_it_matters: An AI system overturned a famous 1946 conjecture that had drawn wide expert attention,
    and leading mathematicians checked the argument and traced its ideas.
  url: https://arxiv.org/abs/2605.20695
- date: '2026-06-30'
  kind: dataset
  title: The AI-contributions wiki for Erdős problems stops being updated
  why_it_matters: The main record of which problems AI helped with now ends in June 2026, so later AI
    involvement can only be found case by case.
  url: https://github.com/teorth/erdosproblems/wiki/AI-contributions-to-Erd%C5%91s-problems
- date: '2026-09-01'
  kind: dataset
  title: 'Epoch AI releases FrontierMath: Erdős, 68 open problems to be solved in Lean'
  why_it_matters: It turns hard open Erdős problems picked by Thomas Bloom into a machine-checked test,
    and the best model at launch solved only 2 of 68.
  url: https://epoch.ai/latest/announcing-frontiermath-erdos
- date: '2026-10-06'
  kind: news
  title: erdosproblems.com stops showing problem statuses and solved counts
  why_it_matters: The list's own maintainer chose to stop presenting it as a scoreboard, and the community
    database moved its tallies off its front page in step.
  url: https://github.com/teorth/erdosproblems/blob/main/STATISTICS.md
reading: []
connections: []
