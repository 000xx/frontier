# Items are written by hand from the pages listed under sources; each value was read in this run.
# One item per Busy Beaver value for 2-symbol Turing machines, measured in steps (S(n), written BB(n)).
id: busy-beaver
title: Busy Beaver values
domain: mathematics
subfield: Open problems
status: live
summary: The longest any small computer program of a given size can run before stopping. Only the first five
  values are known; the fifth took a worldwide online collaboration and a machine-checked proof in 2024, and
  the sixth is so large it may never be pinned down.
metric:
  name: Busy Beaver values proven (2-symbol Turing machines)
  unit: values
  direction: higher
  scale: linear
  explainer: 'A Turing machine is the simplest model of a computer: a head that moves along a tape of 0s and 1s,
    following a small table of rules that depends on which state it is in. The Busy Beaver number BB(n) asks:
    of all machines with n states that eventually stop when started on a blank tape, which one runs longest,
    and for how many steps? Tibor Radó defined it in 1962 as one of the simplest functions no computer can
    calculate in general. To prove a value you must find the champion and then show that every other machine
    of that size either stops sooner or runs forever, which means settling each machine''s fate one by one.
    BB(5) = 47,176,870 was proposed in 1989 and only proven in 2024, when the bbchallenge collaboration
    checked all 181,385,789 five-state machines with a proof verified by the Coq (now Rocq) proof assistant.
    For six states, some machines behave like famously unsolved problems in number theory, so a proof may
    be out of reach; what is known is a lower bound so large it needs towers of exponents just to write.
    This frontier lists each value and whether it is proven; it does not track machines with more symbols.'
chart:
  primary: countdown-grid
  secondary:
  - problem-list
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Values are step counts, S(n), as used by bbchallenge. BB(1) to BB(4) and their dates come from the
    reference column in Petersen (2017); the original papers were not opened. Open points for the owner: (1) the
    bbchallenge wiki dates the BB(5) proof to June 2024, and the public announcement was on 2 July 2024; the
    item uses June 2024. (2) The BB(5) paper (arXiv:2509.12337) was not checked for journal publication. (3)
    The BB(6) lower bound is written as the wiki gives it, 10↑↑10↑↑10↑↑8; Scott Aaronson''s post of 28 June
    2025 states the same June 2025 result as more than 2↑↑2↑↑2↑↑9. Such numbers cannot be stored in the
    schema''s numeric fields, so it is kept as text. (4) The bbchallenge wiki is CC BY 4.0; only facts are
    recorded, with credit to bbchallenge. No stated wishes about use were found. The statement in the
    explainer that some six-state machines resemble unsolved number theory problems rests on the
    "Antihydra" machine mentioned on the wiki''s 2025 review page; the comparison is ours. Check the
    bbchallenge wiki and forum for new BB(6) bounds.'
