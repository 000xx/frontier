  kind: milestone
  title: bbchallenge announces a machine-checked proof that BB(5) = 47,176,870
  why_it_matters: The first new Busy Beaver value in over 40 years was settled by an open online collaboration
    and checked by a proof assistant, not by trusting a computer search.
  url: https://discuss.bbchallenge.org/t/july-2nd-2024-we-have-proved-bb-5-47-176-870/237
