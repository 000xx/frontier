update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Coverage is limited to dimensions whose lower bound changed since 2022. Open points for the owner: (1)
    earlier bounds are recorded only where a source dates them (Leech 1967 for dimensions 17 to 21). Ganzhinov
    gives the previous bounds as 500 in dimension 10 and 1606 in dimension 14, citing the Nebe-Sloane table
    without dates; Ma et al. give previous bounds for dimensions 25 to 31 without dates. These are kept in record
    notes, not as records. (2) Only Ganzhinov''s paper was confirmed as refereed (Linear Algebra and its
    Applications, 2025). The Cohn-Li, Ma et al. (PackingStar) and Ho papers were found only as arXiv preprints,
    and AlphaEvolve''s result is a company announcement, so all four are claimed. Lower bounds come with explicit
    sphere arrangements that can be checked by computer, but no independent check was read here. (3) Ho''s 2026
    bound in dimension 19 is above Cohn and Li''s. (4) Ma et al. also report generalised kissing numbers and a
    rational arrangement in dimension 13 below the record; neither is tracked. Check arXiv math.MG and
    math.CO, and AI lab announcements, for new bounds.'
