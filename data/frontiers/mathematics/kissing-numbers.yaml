events:
- date: '2022-07-17'
  kind: paper
  title: Ganzhinov improves the kissing number bounds in dimensions 10, 11 and 14
  why_it_matters: These were the first gains in dimensions below 16 in about two decades, by a doctoral student
    using highly symmetric line systems.
  url: https://www.aalto.fi/en/news/researcher-cracks-new-kissing-number-bounds-besting-ai-in-the-process
- date: '2024-11-07'
  kind: paper
  title: Cohn and Li beat Leech's 1967 bounds in dimensions 17 to 21
  why_it_matters: Constructions that had stood for 57 years were improved, starting from an undergraduate class
    project.
  url: https://arxiv.org/abs/2411.04916
- date: '2025-05-14'
  kind: news
  title: AlphaEvolve raises the 11-dimensional bound from 592 to 593
  why_it_matters: An AI coding agent edged one sphere past a record that a mathematician had set three years
    earlier.
  url: https://spectrum.ieee.org/deepmind-alphaevolve
- date: '2025-11-17'
  kind: paper
  title: Reinforcement-learning system reports new bounds in dimensions 25 to 31
  why_it_matters: Seven bounds moved at once, by up to several thousand spheres, which suggests the
    higher dimensions still have plenty of room for search.
  url: https://arxiv.org/abs/2511.13391
- date: '2026-03-11'
  kind: paper
  title: New 19-dimensional bound of 11,948 overtakes Cohn and Li
  why_it_matters: The 17 to 21 dimension bounds, untouched for decades, are now moving again within months.
  url: https://arxiv.org/abs/2603.10425
