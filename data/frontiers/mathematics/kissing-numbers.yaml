# Records are transcribed by hand from the papers and pages listed under sources; each value was read in this run.
# One series per dimension. A record is a lower bound on the kissing number in that dimension, set by an explicit
# arrangement of spheres. Only dimensions whose bound changed since 2022 are tracked; earlier values appear only
# where a source gives a date for them.
id: kissing-numbers
title: Kissing number lower bounds
domain: mathematics
subfield: Best known values
status: live
summary: How many equal spheres can touch one sphere at the same time, in spaces of 10 to 31 dimensions. After
  decades without change, the best known arrangements have improved in many dimensions since 2022, some found
  by mathematicians and some by AI search systems.
metric:
  name: Best known lower bound on the kissing number
  unit: spheres
  direction: higher
  scale: log
  explainer: 'Put a ball on a table and ask how many balls of the same size can be arranged around it so that each
    one touches it. In two dimensions (coins on a table) the answer is 6, and in three dimensions it is 12. This
    count is the kissing number, and the same question can be asked in any number of dimensions. The exact answer
    is known only in a handful of dimensions; everywhere else mathematicians have a lower bound, set by the best
    arrangement anyone has found, and an upper bound, proved by showing no arrangement can do better. This
    frontier tracks the lower bounds. Raising one is a construction problem: you write down the centres of
    the touching spheres and check that none of them overlap, which anyone can verify with a computer. That
    makes the problem a natural test for computer search, and since 2025 AI systems such as Google DeepMind''s
    AlphaEvolve have found some of the improvements, alongside new constructions by mathematicians. The
    question matters beyond geometry because good sphere arrangements in high dimensions are closely tied to
    error-correcting codes used to send data reliably. Each dimension is its own series, and the numbers grow
    so fast with dimension that the chart uses a log scale.'
