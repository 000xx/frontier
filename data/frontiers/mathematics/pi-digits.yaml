# Records are transcribed by hand from the y-cruncher records page (numberworld.org/y-cruncher/records.html).
# The page lists the date each result was announced and completed; the completion date is used here.
# Earlier computations (1949 to 2009) are not on that page and are not added: the Wikipedia chronology
# has them but flags several entries as unverified, so they are left out until a verified source is found.
id: pi-digits
title: Digits of pi computed
domain: mathematics
subfield: Computation
status: live
summary: The most decimal digits of pi that anyone has computed, from 5 trillion in 2010 to 314 trillion in 2025. Every record since 2010 on the source page was set with y-cruncher, run on servers and workstations that the record-setters assembled or rented.
metric:
  name: Decimal digits of pi computed
  unit: decimal digits
  direction: higher
  scale: log
  explainer: 'Pi is the ratio of a circle''s circumference to its diameter. It is irrational, so its decimal
    expansion never ends and never repeats, and no one can write all of it down. A digit record is the largest
    number of digits that someone has computed and checked. Each record is a computer run that can take months,
    and the intermediate results are too large to hold in memory, so the runs depend heavily on disk storage. Records are checked with a second, independent formula whose results must
    match the last digits of the main run. The digit count is not a test of mathematical insight; it is a test
    of computing hardware and of how well the software handles disks. The chart uses a log scale because each
    record is usually several times larger than the one before.'
chart:
  primary: record-chart
  secondary:
  - reign-timeline
sources:
- id: ycruncher-records
  name: y-cruncher records page (Pi records)
  url: https://numberworld.org/y-cruncher/records.html
  kind: dataset
  primary: true
  notes: Lists each Pi record with announced and completed dates, digit count, names, hardware and the verification method. The page has no copyright or reuse statement, so only the individual facts are recorded here, each with a link to this page. Opened 2026-11-09.
- id: wikipedia-pi-chronology
  name: Wikipedia, Chronology of computation of pi
  url: https://en.wikipedia.org/wiki/Chronology_of_computation_of_pi
  kind: other
  notes: Secondary. Used only to check the period before 2010 and to find that the record list has gaps. Several of its entries are flagged as unverified or failing verification, and it lists a 1995 run with an uncertain hour count, so it is not used for any record value. Wikipedia text is CC BY-SA; no sentences are copied. Opened 2026-11-09.
- id: storagereview-coverage
  name: Tom's Hardware, report on the 314 trillion digit run
  url: https://www.tomshardware.com/pc-components/storage/pi-calculating-record-shattered-at-314-trillion-digits-with-a-four-month-run-on-a-single-server-storagereview-retakes-the-crown-thanks-to-storage-bandwidth
  kind: news
  notes: The headline gives 314 trillion digits and the body gives 314 million. The 314 trillion figure is taken from the y-cruncher records page, not from this article. Opened 2026-11-09.
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Records come from the y-cruncher records page. The page dates each record twice (announced and completed); the completion date is used. Open points for the owner: (1) the page lists a 2.5 trillion digit run by newalex (completed 2019-05-09) that is below the 5 trillion record of 2010, so it is not a record and is not added; (2) the Tom''s Hardware report of the 314 trillion run gives 314 million in its body text; (3) the page lists no y-cruncher version for any row, so the software version is not recorded; (4) every record is claimed: the sources read give a self-check (a second formula that must match the last digits) but no independent confirmation; (5) the Wikipedia chronology disagrees with the y-cruncher page on several dates and holders, for example for the 2025 runs; (6) the 1949 to 2009 history is not yet added.'
