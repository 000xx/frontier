  why_it_matters: The source lists this run with modest hardware, which shows how far a small machine could go by 2010.
  url: https://numberworld.org/y-cruncher/records.html
- date: '2022-03-21'
  kind: milestone
  title: 100 trillion digits passed on a rented cloud instance
  why_it_matters: A cloud configuration reached the 100 trillion digit mark, so the record no longer needed owned hardware.
  url: https://numberworld.org/y-cruncher/records.html
- date: '2025-11-19'
  kind: milestone
  title: 314 trillion digits, the current record on the page
  why_it_matters: The source lists two AMD Epyc processors and 1.5 TB of RAM for this run, so the record was set on a small server rather than a supercomputer.
  url: https://numberworld.org/y-cruncher/records.html
