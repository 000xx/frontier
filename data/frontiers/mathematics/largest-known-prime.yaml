# Records are transcribed from the GIMPS table and checked against the PrimePages table.
# Edit the other fields by hand; add records only from pages opened in the update run.
id: largest-known-prime
title: Largest known prime
domain: mathematics
subfield: Computation
status: live
summary: The largest prime number anyone has proved prime, measured in decimal digits, from the first
  computer search in 1952 to today. Almost every record since 1952 is a Mersenne prime, a number of the
  form 2 to the power p minus one, and most come from a volunteer network that runs the same tests on
  spare computers.
metric:
  name: Digits in the largest known prime
  unit: decimal digits
  direction: higher
  scale: log
  explainer: 'A prime is a whole number greater than one that has no divisors except one and itself.
    The largest known prime is the one with the most digits among those whose primality has been proved.
    Since 1952 nearly every record has been a Mersenne prime, written 2^p − 1 for a prime exponent p.
    Testing such a number is cheap compared with testing a random number of the same size, because the
    Lucas-Lehmer test works directly on the exponent. That is why records are almost all Mersenne primes.
    The number of digits grows very quickly with the exponent (doubling p roughly doubles the digit count),
    so the chart uses a log scale. A record needs a full, reproducible primality proof, and the strongest
    records are run again on different hardware and software before they are announced. Digit counts are
    shown rather than the full numbers because the primes have tens of millions of digits.'
chart:
  primary: record-chart
  secondary:
  - reign-timeline
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Records come from the GIMPS table at mersenne.org/primes and were cross-checked against the
    PrimePages table at t5k.org/mersenne. The table is the ranking of Mersenne primes by exponent, so a
    record is the entry whose discovery date is later than every larger-digit prime found before it. Only the
    computer era (1952 on) is covered; the earlier list of Mersenne primes (exponents 2 to 127, 1456 to 1876)
    is not yet added. Open points for the owner: (1) the GIMPS table dates M42643801 to 2009-06-04, while its
    press release gives discovery on 2009-04-12; the 2009 entry is not a record, so no record is added for it;
    (2) M37156667 (table date 2008-09-06) is smaller than M43112609 (table date 2008-08-23) and so is not a
    record by discovery date, and its press release was not reachable (it redirects to the M43112609 page);
    (3) the press release for M43112609 gives its exponent as 243,112,609, which looks like a lost
    superscript, so the table value 43112609 is used; (4) the GIMPS page marks the 2024 entry as a
    provisional ranking because not all candidates between M82589933 and M136279841 have been eliminated;
    (5) the PrimePages page largest.html could not be read in this run (two client errors), so the
    PrimePages cross-check used the Mersenne table only. Records marked claimed have no independent
    verification statement in the sources read for this run. Dates are discovery dates from the GIMPS
    table, or from the press release where the table and press release differ.'
sources:
- id: gimps-primes
  name: GIMPS, Mersenne prime list (largest known primes)
  url: https://www.mersenne.org/primes/
  kind: registry
  primary: true
  notes: 'Run by the Great Internet Mersenne Prime Search. Copyright "©1996-2026 Mersenne Research, Inc.".
    Its Terms and Conditions say that GIMPS owns all collected data and may publish limited subsets of it for
    public reference. The terms give no licence to copy the list, so only individual facts are recorded here,
    each with a link. Ask the owner before copying the dataset.'
- id: gimps-press
  name: GIMPS press releases for individual Mersenne primes
  url: https://www.mersenne.org/primes/press/
  kind: press
  notes: Individual pages per exponent, for example M136279841.html. Used for discovery and verification
    details. The press pages carry no licence statement; the copyright line on the main site applies.
- id: primepages-mersenne
  name: PrimePages, Mersenne primes table (Chris Caldwell)
  url: https://t5k.org/mersenne/
  kind: registry
  notes: Used to cross-check digit counts and dates. The page credits its table to "Printed from the PrimePages
    <t5k.org> © Reginald McLean" and its author in the metadata as Chris K. Caldwell. No licence or reuse
    terms were found on the pages read, so only facts are recorded.
- id: primepages-largest
  name: PrimePages, the largest known primes (Chris Caldwell)
  url: https://t5k.org/notes/largest.html
  kind: registry
  notes: Named in the brief. Could not be read in this run (two client errors from the fetch tool). Not used
    for any value here.
