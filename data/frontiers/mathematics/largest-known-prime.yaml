events:
- date: '2013-02-05'
  kind: milestone
  title: Record prime found on a university computer, confirmed on three setups
  why_it_matters: A campus PC running volunteer software produced a record, and independent reruns on other hardware checked it before the announcement.
  url: https://www.mersenne.org/primes/press/M57885161.html
- date: '2016-01-07'
  kind: milestone
  title: A 2015 record sat unnoticed until a routine data check found it
  why_it_matters: A machine reported the result in September 2015, and it was recognised only months later, which shows that records can sit unseen in search output.
  url: https://www.mersenne.org/primes/press/M74207281.html
- date: '2018-12-21'
  kind: milestone
  title: Record prime found by a volunteer's home computer
  why_it_matters: One volunteer's ordinary processor found the record in 12 days, which shows that a distributed search can still reach the frontier with consumer hardware.
  url: https://www.mersenne.org/primes/press/M82589933.html
- date: '2024-10-21'
  kind: milestone
  title: Largest known prime, 2 to the power 136,279,841 minus one, announced
  why_it_matters: The number has 41 million digits, and the announcement followed several independent checks on different hardware, though GIMPS still calls its ranking provisional.
  url: https://www.mersenne.org/primes/press/M136279841.html
