# Items are transcribed by hand from IUPAC pages and laboratory news; each fact was read in this run.
# date_done is the date IUPAC approved the element's permanent name, which follows IUPAC/IUPAP recognition of its discovery.
id: superheavy-elements
title: Superheavy elements
domain: physics
subfield: Particles and matter
status: live
summary: The heaviest chemical elements, from 104 to 118, each made a few atoms at a time in particle accelerators
  and accepted into the periodic table only after an international review. The seventh row of the table has
  been full since 2016; the race now is to make element 119 or 120 and start an eighth row.
metric:
  name: Superheavy elements (atomic number 104 and above) with an IUPAC-approved name
  unit: elements
  direction: higher
  scale: linear
  explainer: 'Elements heavier than uranium do not survive in nature in useful amounts, so they are made by firing
    a beam of lighter nuclei at a target of heavy ones and hoping that, very occasionally, two nuclei fuse.
    For the heaviest elements this happens a handful of times in weeks or months of beam time, and the new
    nucleus lives for a fraction of a second before it decays. Labs identify it by the chain of decays that
    follows, which ends in known nuclei. Because the evidence is so thin, a claimed discovery is judged by a
    joint working party of the international unions of chemistry (IUPAC) and physics (IUPAP). Once that panel
    credits a team, the team proposes a name, and IUPAC approves it after a public comment period. Elements 104
    to 118 complete the seventh row of the periodic table. Element 119 and 120 would start the eighth, but
    making them needs targets of rare man-made elements and heavier beams than before, which lowers the odds
    of fusion further.'
chart:
  primary: natural-map
  secondary:
  - countdown-grid
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Each item was read from an IUPAC page or report, or from a laboratory or news page where stated. date_done
    is the naming date, the one date found for every element; discovery-recognition dates are in notes where read.
    Open points for the owner: (1) the IUPAC 1997 recommendations for elements 104 to 109 give the names but not
    the discoverers, so `by` is left empty for those; their discovery history (the "transfermium" disputes) is not
    covered yet. (2) The IUPAC page for element 110 does not name the discovering laboratory, so `by` is empty.
    (3) The LLNL news item dates the naming of 114 and 116 to 31 May 2012, the IUPAC Chemistry International page
    to 30 May 2012; the IUPAC date is used. (4) The iupac.org periodic table page could not be opened in this run
    (blocked fetch). (5) The JINR June 2026 report is internally inconsistent about whether the element 119 run
    had already started; check JINR, RIKEN and Berkeley Lab news for any element 119 or 120 claim. A claim alone
    would be an event; an item turns done only after IUPAC/IUPAP recognition and naming.'
