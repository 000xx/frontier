events:
- date: '2015-12-30'
  kind: milestone
  title: IUPAC credits the discoveries of elements 113, 115, 117 and 118
  why_it_matters: The decision completed the seventh row of the periodic table, four years after elements 114 and
    116 were credited.
  url: https://iupac.org/discovery-and-assignment-of-elements-with-atomic-numbers-113-115-117-and-118/
- date: '2016-11-28'
  kind: milestone
  title: Nihonium, moscovium, tennessine and oganesson approved as names
  why_it_matters: These are the most recent permanent additions to the periodic table; no element has joined since.
  url: https://iupac.org/iupac-announces-the-names-of-the-elements-113-115-117-and-118/
- date: '2024-07-22'
  kind: paper
  title: Berkeley Lab makes livermorium with a titanium-50 beam
  why_it_matters: Two atoms showed that beams heavier than calcium-48 can still make superheavy nuclei, the method
    any attempt at element 120 will need.
  url: https://arxiv.org/abs/2407.16079
- date: '2026-03-26'
  kind: news
  title: JINR announces searches for elements 119 and 120
  why_it_matters: The Dubna laboratory behind five of the last six elements is now aiming at the eighth row too, with
    first results hoped for in late 2026.
  url: https://www1.ru/en/articles/2026/03/26/novyi-element-tablicy-mendeleeva-sozdadut-v-rossii.html
- date: '2026-06-19'
  kind: news
  title: JINR advisers report the element 119 run under way
  why_it_matters: Its own physicists expect about a year to see a couple of atoms, so a claim is unlikely before 2027
    and recognition would take longer.
  url: https://jinrmag.jinr.ru/eng/2026/28/nb28.html
