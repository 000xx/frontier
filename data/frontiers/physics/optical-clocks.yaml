events:
- date: '2013-09-04'
  kind: milestone
  title: A strontium lattice clock overtakes the best ion clocks
  why_it_matters: Clocks that interrogate thousands of atoms at once had been the most stable; this one became the
    most accurate as well, ending a long run of ion-clock records.
  url: https://arxiv.org/abs/1309.1137
- date: '2019-02-20'
  kind: milestone
  title: First clock evaluated below one part in 10^18
  why_it_matters: Crossing 10^-18 was a long-standing goal, because it is the level at which a clock can sense a
    one-centimetre change in height.
  url: https://physics.aps.org/articles/v12/79
- date: '2024-03-15'
  kind: paper
  title: JILA strontium clock reaches 8.1×10^-19
  why_it_matters: The lattice clock took the record back from the aluminium ion, showing both designs are still
    improving fast.
  url: https://arxiv.org/abs/2403.10664
- date: '2025-07-14'
  kind: paper
  title: NIST aluminium ion clock published at 5.5×10^-19
  why_it_matters: A redesigned ion trap cut the remaining shifts and also made the clock much more stable, so it
    reaches its accuracy in far less averaging time.
  url: https://nist.gov/publications/high-stability-single-ion-clock-55-x-10-19-systematic-uncertainty
- date: '2026-10-13'
  kind: news
  title: BIPM keeps 2030 as the decision point for redefining the second
  why_it_matters: The official definition still rests on caesium; a switch to optical clocks depends on records
    like these being reproduced and compared between countries first.
  url: https://www.bipm.org/faq-redefinition-second
