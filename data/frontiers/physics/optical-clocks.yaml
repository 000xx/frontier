# Records are transcribed by hand from the papers listed under sources; each value was read in this run.
# A record is a clock whose evaluated total systematic uncertainty is lower than every earlier clock in its series.
id: optical-clocks
title: Most accurate atomic clocks
domain: physics
subfield: Precision measurement
status: live
summary: The smallest total systematic uncertainty reported for any atomic clock, which says how well a clock's
  ticking is understood. Optical clocks built on single trapped ions or on lattices of thousands of atoms have
  taken turns at the record, and the best now sit below one part in a billion billion.
metric:
  name: Total systematic uncertainty of the best atomic clock
  unit: fractional frequency
  direction: lower
  scale: log
  explainer: 'An atomic clock counts the oscillations of light that atoms absorb at one very exact frequency.
    Real atoms are nudged slightly by their surroundings: heat radiation from the room, the electric fields of
    the trap that holds them, their own motion, gravity and more. Each nudge shifts the frequency a tiny amount.
    Building a clock means measuring or calculating every such shift and correcting for it. The systematic
    uncertainty is the leftover doubt in all those corrections added together, written as a fraction of the
    clock frequency. A value of 1×10^-18 means the clock''s frequency is known to within one part in a billion
    billion, so it would gain or lose less than a second over the age of the universe. This is different from
    stability, which is how quickly a clock averages away random noise; the record here is for accuracy. The
    official second is still defined by caesium microwave clocks, which are far less accurate than the
    best optical clocks, and the international bodies that run the SI are preparing to
    redefine it with optical clocks. At this level a clock is sensitive to height: raising it by one centimetre
    changes its rate by about one part in 10^18, so such clocks can also measure gravity and test physics.'
chart:
  primary: record-chart
  secondary:
  - reign-timeline
series:
- id: single-ion
  label: Single trapped-ion clocks
- id: optical-lattice
  label: Neutral-atom optical lattice clocks
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Values are the total systematic uncertainty each paper reports, read from its abstract or text in this
    run. Dates are the first arXiv submission date, or the publication date where no arXiv date was read.
    Coverage starts in 2008; earlier caesium fountain and optical records are not yet added. Open points for
    the owner: (1) the 2008 NIST release says the mercury clock stayed the most accurate "by a margin of 20
    percent" over the aluminium clock, while the paper gives 1.6×10^-17 and 2.4×10^-17, a larger gap; the
    paper values are used. (2) Bloom et al. give 6×10^-18 in the abstract and 6.4×10^-18 in the text and
    table; 6.4×10^-18 is used. (3) No paper or NIST page read claims the 2025 aluminium ion result as a
    record; it is lower than the 2024 strontium value, and a trade article reports it as 41% more accurate
    than that clock. (4) Systematic uncertainty budgets are evaluated by each lab, not replicated, so every
    record is peer_reviewed and none is confirmed. Check NIST, JILA, PTB, RIKEN, NPL, SYRTE and other
    national labs, and arXiv physics.atom-ph, for new clock evaluations.'
