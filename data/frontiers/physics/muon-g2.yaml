# Records are transcribed by hand from the papers listed under sources; each value was read in this run.
# Values are the total relative uncertainty of each published measurement of the muon anomaly a_mu, in ppm.
# Two series: the best single experiment, and the experimental world average quoted in the same paper.
id: muon-g2
title: Muon magnetic moment (g-2)
domain: physics
subfield: Precision measurement
status: live
summary: How precisely the muon's magnetic strength has been measured. Fermilab's final 2025 result pinned it
  down to 127 parts per billion, four times better than Brookhaven's 2006 result, as a test of whether
  unknown particles are tugging on the muon.
metric:
  name: Relative uncertainty on the muon anomalous magnetic moment
  unit: ppm
  direction: lower
  scale: log
  explainer: 'The muon is a heavier cousin of the electron. Like a tiny bar magnet it lines up in a magnetic field
    and wobbles (precesses) around it at a rate set by its magnetic moment, written g. Simple quantum theory says
    g should be exactly 2, but the muon is constantly surrounded by short-lived virtual particles that nudge g
    slightly above 2. The size of that nudge, a_mu = (g - 2)/2, about 0.00116592, depends on every particle that
    exists, including any not yet discovered. So physicists measure a_mu very precisely and compare it with the
    Standard Model prediction: a clear difference would point to new physics. The experiments store muons in a
    ring-shaped magnet and time how fast their spins turn compared with how fast they circle. This
    frontier tracks the precision of the measurement, given as the total uncertainty in parts per million
    (ppm). For years the measurement and the prediction disagreed, but a new prediction in 2025, using
    a computer-based method for the hardest part of the theory, sits much closer to the measured value.'
chart:
  primary: record-chart
series:
- id: single-experiment
  label: Best single experiment
- id: world-average
  label: Experimental world average
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Coverage starts with the final Brookhaven result of 2006; the earlier CERN and intermediate Brookhaven
    results are not yet added. Dates are first arXiv submission. Open points for the owner: (1) all records are
    peer_reviewed; Fermilab''s values agree with Brookhaven''s, which is an independent check of the value but
    not of the uncertainty, so none is marked confirmed. (2) The world-average series starts in 2021 because no
    source read gives the world-average uncertainty before then. (3) Check for new experiments that
    could improve on Fermilab. (4) The theory side (the Muon g-2 Theory Initiative
    predictions) is described only in words; no theory values are recorded.'
