# Records are transcribed by hand from paper abstracts; each value was read in this run.
# Each record is the experiment's headline minimum limit, at the WIMP mass the abstract gives (stated in conditions).
id: dark-matter-limits
title: Dark matter WIMP search limits
domain: physics
subfield: Searches and limits
status: live
summary: How weakly a dark matter particle of the WIMP kind could interact with ordinary matter without having
  been seen yet, from the best underground xenon detectors. Each new result rules out more of the space where
  such particles could hide, and the limit has fallen about a thousandfold since 2012.
metric:
  name: Best spin-independent WIMP-nucleon cross-section upper limit (at its most sensitive mass, about 30 to 55 GeV/c²)
  unit: cm²
  direction: lower
  scale: log
  explainer: 'Most of the matter in the universe is invisible "dark matter". One long-favoured idea is that it is
    made of weakly interacting massive particles, or WIMPs, which would very occasionally bump into an atomic
    nucleus. Detectors buried deep underground to block cosmic rays watch tonnes of ultra-pure liquid xenon for
    the tiny flash and electric charge that such a bump would make. No convincing signal has been seen, so each
    experiment publishes an upper limit: the largest interaction strength (written as a cross section, in square
    centimetres) that a WIMP of a given mass could have without the detector having seen it, usually at 90%
    confidence. The limit is a curve across WIMP masses and is deepest for masses a few dozen times a proton''s.
    This frontier tracks the bottom of that curve, which sits at slightly different masses for different
    experiments, so neighbouring values are close but not exactly like for like. A lower number means more
    ground ruled out. Below a certain level the detectors start to see neutrinos from the Sun and from cosmic
    rays in the atmosphere, which mimic a WIMP; this "neutrino fog" makes further progress much harder.'
chart:
  primary: exclusion-map
  secondary:
  - record-chart
series:
- id: liquid-xenon
  label: Liquid xenon detectors (XENON, LUX, PandaX, LZ)
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Values are the headline minimum limit in each abstract, at the mass the abstract gives. Dates are first
    arXiv submission dates. A record is a minimum limit lower than every earlier one, whatever its mass; this
    mixes masses from 30 to 55 GeV/c², so for the owner: (1) a strict comparison at one fixed mass (say 40 GeV/c²)
    would need values read off each exclusion curve, which the abstracts do not give; (2) the LUX 2016 abstract
    quotes 2.2×10^-46 cm² at 50 GeV/c², not at its minimum, and the PandaX-II 2017 abstract gives no confidence
    level; (3) the schema cannot hold whole exclusion curves, which the exclusion-map chart would need, so only
    the minimum is recorded. Exclusion limits are not replicated by other experiments, so every record is
    peer_reviewed. Check LZ, XENONnT and PandaX-4T news and arXiv hep-ex for new results.'
