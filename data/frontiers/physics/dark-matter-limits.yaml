events:
- date: '2022-07-08'
  kind: milestone
  title: LZ's first run beats every earlier limit by about four times
  why_it_matters: A new generation of multi-tonne detectors arrived, and the first one to report moved the frontier
    further in one step than the previous four years had.
  url: https://arxiv.org/abs/2207.03764
- date: '2023-03-26'
  kind: paper
  title: XENONnT's first WIMP search finds nothing, at a weaker limit than LZ
  why_it_matters: A second multi-tonne detector saw no WIMPs either, which supports the null result even though its
    limit did not set a record.
  url: https://arxiv.org/abs/2303.14729
- date: '2025-02-25'
  kind: paper
  title: XENONnT reports 3.1 tonne-years with no WIMP signal
  why_it_matters: The European experiment tightened its own limit to 1.7×10^-47 cm² at 30 GeV/c², still above LZ, so
    the two now cross-check each other with large exposures.
  url: https://arxiv.org/abs/2502.18005
- date: '2026-09-03'
  kind: news
  title: LZ reports evidence of solar neutrinos scattering off xenon nuclei
  why_it_matters: Seeing boron-8 neutrinos at more than 3σ shows the detectors have reached the neutrino fog, the
    background that will make each further step down much harder.
  url: https://indico.global/event/15267/contributions/157669/
