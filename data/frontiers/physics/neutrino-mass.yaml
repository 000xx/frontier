events:
- date: '2022-06-13'
  kind: milestone
  title: KATRIN pushes the direct neutrino-mass limit below 1 eV
  why_it_matters: It was the first laboratory weighing sensitive enough to rule out neutrinos heavier than one
    electronvolt without leaning on cosmology.
  url: https://www.energy.gov/science/np/articles/direct-neutrino-mass-measurement-achieves-new-sub-electronvolt-sensitivity
- date: '2025-04-10'
  kind: paper
  title: KATRIN halves its limit to 0.45 eV
  why_it_matters: Using only part of its planned data, the experiment cut the allowed neutrino mass nearly in half
    again, and the result still fits a mass of zero.
  url: https://www.sfb1258.de/news-items/precision-scale-katrin-sets-new-record-neutrinos-weigh-less-than-045-ev-c2
- date: '2025-10-26'
  kind: milestone
  title: KATRIN completes 1000 days of measurement
  why_it_matters: Data taking is over, so the next limit, expected to reach below 0.3 eV, now depends only on the
    analysis of the full data set.
  url: https://www.mpi-hd.mpg.de/mpi/en/public-relations/news/news-item/1000-days-of-neutrino-mass-measurements
