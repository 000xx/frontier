# Records are transcribed by hand from the papers listed under sources; each value was read in this run.
# Only direct, laboratory measurements from tritium beta decay are counted; cosmological bounds are not.
id: neutrino-mass
title: Neutrino mass from direct measurements
domain: physics
subfield: Searches and limits
status: live
summary: The tightest laboratory upper limit on the mass of the electron neutrino, measured from the energies of
  electrons in tritium decay. Neutrinos are known to have some mass, but nobody has yet weighed one; the
  limit has fallen from a few electronvolts in the Mainz and Troitsk experiments to below half an electronvolt
  at KATRIN.
metric:
  name: Upper limit on the effective electron-antineutrino mass (direct, tritium beta decay)
  unit: eV/c²
  direction: lower
  scale: log
  explainer: 'Neutrinos switch between their three types as they travel, which is only possible if they have
    mass, but those oscillation experiments measure differences between masses, not the masses themselves.
    The most direct way to weigh a neutrino is to watch tritium, a radioactive form of hydrogen, decay. Each
    decay shares a fixed amount of energy between an electron and an antineutrino. Because some energy must
    go into the antineutrino''s mass, the very top of the electron energy spectrum is slightly cut off and
    reshaped. The experiments measure that endpoint region with huge electrostatic spectrometers and ask how
    heavy the neutrino could be without distorting it more than they see. So far the data are consistent with
    zero, and each result is an upper limit at a stated confidence level (95% for Mainz and Troitsk, 90% for
    KATRIN, so their numbers are not strictly like for like). Cosmology gives tighter limits on the sum of the
    three masses, but those depend on a model of the whole universe; this frontier tracks the model-independent
    laboratory route.'
  target:
    value: 0.3
    label: KATRIN's expected final sensitivity, stated as below 300 meV (90% CL) for the full 1000-day data set
chart:
  primary: record-chart
  secondary:
  - closing-bounds
series:
- id: tritium-beta-decay
  label: Tritium beta decay (Mainz, Troitsk, KATRIN)
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Values were read from the paper abstracts in this run. Dates are first arXiv submission dates. Open
    points for the owner: (1) Mainz and Troitsk quote 95% confidence limits and KATRIN 90%; the schema has no
    field for confidence level, so it is in the conditions text. (2) Troitsk gives three numbers (2.2 eV
    sensitivity, 2.12 eV Bayesian, 2.05 eV Feldman-Cousins); 2.05 eV is used. (3) The target is KATRIN''s
    expected final sensitivity from a June 2026 conference abstract, not a physical limit. (4) The schema has
    no lower-bound field for the closing-bounds chart; oscillation data imply a lower bound but no value for it
    was read in this run. KATRIN finished taking data in October 2025 and is analysing the full 1000-day data
    set; check KATRIN, KIT and MPIK news for the final result. Project 8 and other new methods would also count.'
