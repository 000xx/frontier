events:
- date: '2018-10-29'
  kind: milestone
  title: Parker Solar Probe passes Helios 2, fastest for 42 years
  why_it_matters: A record that had stood since 1976 fell before Parker's first close pass, with many faster
    passes still to come.
  url: https://www.nasa.gov/solar-system/parker-solar-probe-breaks-record-becomes-closest-spacecraft-to-sun/
- date: '2023-09-27'
  kind: milestone
  title: Parker reaches 394,736 mph on its 17th pass
  why_it_matters: The record kept climbing in steps as the orbit was pulled tighter, and this pass also set a
    new distance record.
  url: https://science.nasa.gov/?p=483211
- date: '2024-12-24'
  kind: milestone
  title: Parker makes its closest pass, about 430,000 mph and 3.8 million miles from the Sun's surface
  why_it_matters: This is the fastest any human-made object has gone, and the orbit is now fixed, so the record
    is likely to stand until a new mission dives closer.
  url: https://svs.gsfc.nasa.gov/14741/
