# Records are transcribed by hand from the NASA pages listed under sources; each value was read in this run.
# Speeds are heliocentric (relative to the Sun) at closest approach, in miles per hour as NASA reports them.
id: fastest-spacecraft
title: Fastest spacecraft
domain: extremes
subfield: Biggest, deepest, longest
status: live
summary: The highest speed any human-made object has reached, measured relative to the Sun. NASA's Parker Solar
  Probe took the record from Helios 2 in 2018 and pushed it to about 430,000 miles per hour in December 2024 by
  falling ever closer to the Sun.
metric:
  name: Highest speed relative to the Sun reached by a spacecraft
  unit: miles per hour
  direction: higher
  scale: linear
  explainer: 'Speed in space depends on what you measure it against. These records are heliocentric: the speed
    of the spacecraft relative to the Sun. The fastest objects are not the ones launched hardest but the ones
    that fall closest to the Sun. A spacecraft on a stretched-out orbit speeds up as it drops toward the Sun,
    the way a ball speeds up rolling downhill, and is fastest at its closest point, called perihelion. Getting
    close is the hard part: Earth itself moves around the Sun quickly, and a probe has to shed most of that
    sideways motion to fall inward. Parker Solar Probe did this with repeated flybys of Venus, each of which
    lowered its closest point, so every few passes it set new records for both distance and speed. NASA
    describes the December 2024 pass as the mission''s closest, and later passes follow the same orbit, so
    they repeat that speed instead of beating it. The figures here are the speeds the mission team reported, usually rounded.'
chart:
  primary: record-chart
  secondary:
  - reign-timeline
series:
- id: heliocentric
  label: Speed relative to the Sun at closest approach
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Open points for the owner: (1) all records come from NASA mission pages, so they are claimed; no
    independent tracking or refereed paper was opened. (2) The September 2020 value is from a NASA post written
    two days before that perihelion, so it is the planned speed. (3) NASA gives the December 2024 speed only as
    "about 430,000 miles per hour"; the earlier values are given more precisely. (4) The April 2021 value is
    given as "faster than 330,000 miles per hour". (5) Perihelia between those listed (for example the 2nd,
    3rd, 5th, 7th and 9th) are not added because they were not reported as new speed records in the pages
    read; check whether any of them set one. (6) Coverage starts with Helios 2; earlier record holders such
    as Helios 1 are not yet added. The NASA Parker blog index could not be opened in this run.'
