# Records are transcribed by hand from the pages listed under sources; each value was read in this run.
# Series hold different kinds of temperature and must not be ranked against each other.
id: coldest-temperature
title: Coldest temperatures made in the lab
domain: extremes
subfield: Physical extremes
status: live
summary: The lowest temperatures anyone has reached, a fraction of a billionth of a degree above absolute zero. Two
  very different systems hold the records, the magnetic spins of atomic nuclei inside a metal and clouds of
  atoms floating in a vacuum, and each now sits within about a tenth of a billionth of a degree of zero.
metric:
  name: Lowest temperature reached
  unit: picokelvin (pK)
  direction: lower
  scale: log
  explainer: 'Temperature measures how much random motion there is. Absolute zero, 0 kelvin, would mean none at
    all, and the laws of thermodynamics say it can be approached but never reached. Records are counted in
    picokelvin, trillionths of a degree. They come from two quite different kinds of system, and the word
    "temperature" means slightly different things in each. In a metal such as rhodium, the tiny magnets of the
    atomic nuclei can be cooled by magnetic tricks far below the temperature of the metal''s electrons and
    crystal lattice; the record there is the temperature of the nuclear spins alone. In a gas of atoms trapped
    with lasers and magnetic fields, the atoms are cooled into a Bose-Einstein condensate, and the cloud is then
    allowed to expand and refocused so that its atoms barely move; the record there is an effective temperature
    worked out from the leftover motion, sometimes in only two directions. Because of these differences each
    system is shown as its own series, and the numbers should not be compared directly.'
chart:
  primary: record-chart
  secondary:
  - scale-ladder
series:
- id: nuclear-spins
  label: Nuclear spins in a metal (spin temperature)
- id: atomic-gas
  label: Ultracold atomic gas (effective kinetic temperature)
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Values were read from the pages listed. Open points for the owner: (1) the nuclear-spin records come only
    from Aalto University''s own pages, which give years but no papers, so they are claimed; the papers were not
    found in this run. (2) The 2003 MIT result is 450 pK in Physics World and "500 picokelvin" (as a rounded "below
    500") in MIT News; 450 pK is used. MIT News says the previous lowest reported temperature was 3 nK but not who
    set it, so that earlier record is not added. (3) Kovachy et al. (2015) is an effective temperature in two
    dimensions only; Deppner et al. (2021) is in three. (4) The Aalto page also lists a negative absolute
    temperature in rhodium nuclear spins, which is not a low-temperature record and is left out. (5) Electron and
    bulk-material temperature records are not covered yet. Coverage starts in 1993.'
