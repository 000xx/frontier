events:
- date: '1999'
  kind: milestone
  title: Nuclear spins in rhodium cooled to 100 pK in Helsinki
  why_it_matters: The laboratory still lists it as the record, though it applies to the nuclear magnets alone, not
    to the metal as a whole.
  url: https://www.aalto.fi/en/otanano/ltl-milestones
- date: '2003-09-12'
  kind: paper
  title: MIT takes an atomic gas below 500 picokelvin
  why_it_matters: An atomic gas went below half a billionth of a degree, about six times colder than any gas
    reported before.
  url: https://physicsworld.com/a/bose-einstein-condensates-break-temperature-record
- date: '2014-07-25'
  kind: paper
  title: Matter-wave lensing reaches 50 pK, in two dimensions
  why_it_matters: Refocusing an expanding atom cloud, much as a lens refocuses light, gave an effective temperature
    about nine times below the 2003 gas record, though only along two directions.
  url: https://arxiv.org/abs/1407.6995
- date: '2021-09'
  kind: paper
  title: Drop-tower experiment reaches 38 pK in all three dimensions
  why_it_matters: Working in microgravity, the lensing trick slowed the atoms in all three directions, not just
    two, setting the current record for an atomic gas.
  url: https://physics.aps.org/articles/v14/119
