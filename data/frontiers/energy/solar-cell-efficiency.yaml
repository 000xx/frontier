id: solar-cell-efficiency
title: Solar cell efficiency
domain: energy
subfield: Solar
status: draft
summary: >-
  The highest certified share of sunlight that a solar cell turns into electricity, tracked
  separately for each cell technology. It is the longest-running and best-verified record
  table in clean energy.

metric:
  name: Conversion efficiency
  unit: "%"
  direction: higher
  scale: linear
  explainer: >-
    Efficiency is the share of the sunlight's energy hitting a cell that comes out as
    electricity. Records only count when an independent test lab measures the cell under
    standard conditions (a fixed light spectrum and a cell temperature of 25 °C), so results
    from different labs can be compared. Different technologies are tracked separately
    because they have different ceilings: cells that stack several light-absorbing layers can
    go far higher than a single layer of silicon.

chart:
  primary: record-chart
  secondary: [baton-chart, limit-bar, lab-to-world-gap]

series:
  - {id: multijunction, label: Multijunction cells, group: III-V}
  - {id: single-junction-gaas, label: Single-junction gallium arsenide, group: III-V}
  - {id: crystalline-silicon, label: Crystalline silicon, group: Silicon}
  - {id: thin-film, label: Thin-film technologies, group: Thin film}
  - {id: emerging-pv, label: Emerging photovoltaics, group: Emerging}
  - {id: hybrid-tandems, label: Hybrid tandems, group: Tandem}

update:
  cadence: monthly
  last_checked: 2026-11-09
  notes: >-
    Seeded from a 2024 news summary only. The NREL data file could not be downloaded from the
    build environment, so the full record history from 1976 still needs importing, and the
    records below are out of date. First update run: import the NREL data file, replace the
    seed records, and add the single-junction theoretical limit with a citation.

