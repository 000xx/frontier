update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Records come from the NLR data table (data/datasets/nlr-cell-efficiency), last modified by NLR
    on 2026-08-14. To update: check whether NLR has published a newer file, regenerate records.csv, then
    run scripts/import_nlr_cell_efficiency.py. Still to add: the theoretical single-junction limit with
    a citation, and the reading list.'
sources:
- id: nlr-data-table
  name: NLR Best Research-Cell Efficiency data table
  url: https://www.nlr.gov/docs/libraries/pv/cell-efficiency-data-table.xlsx
  kind: dataset
  primary: true
  notes: Every certified record cell since 1976, as charted by the National Laboratory of the Rockies
    (formerly NREL). Free to use and copy with credit to DOE/NLR/Alliance; see data/datasets/nlr-cell-efficiency/NOTICE.md.
- id: nlr-chart
  name: NLR Best Research-Cell Efficiency Chart
  url: https://www.nlr.gov/pv/cell-efficiency
  kind: dataset
  notes: Chart page. Only results confirmed by independent, recognized test labs (NLR, AIST, JRC-ESTI,
    Fraunhofer ISE and others) under standard test conditions are included.
