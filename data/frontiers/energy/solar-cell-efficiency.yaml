# Series and records are generated by scripts/import_nlr_cell_efficiency.py.
# Edit the other fields by hand; edit the dataset, not the records, for record changes.
id: solar-cell-efficiency
title: Solar cell efficiency
domain: energy
subfield: Solar
status: draft
summary: The highest certified share of sunlight that a solar cell turns into electricity, tracked separately
  for each cell technology. It is the longest-running and best-verified record table in clean energy.
metric:
  name: Conversion efficiency
  unit: '%'
  direction: higher
  scale: linear
  explainer: 'Efficiency is the share of the sunlight''s energy hitting a cell that comes out as electricity.
    Records only count when an independent test lab measures the cell under standard conditions (a fixed
    light spectrum and a cell temperature of 25 °C), so results from different labs can be compared. Different
    technologies are tracked separately because they have different ceilings: cells that stack several
    light-absorbing layers can go far higher than a single layer of silicon.'
chart:
  primary: record-chart
  secondary:
  - baton-chart
  - limit-bar
  - lab-to-world-gap
