# Observations are annual shares of world electricity generation for 2000 to 2025, all taken from one source:
# Ember's yearly electricity data, as republished in the Our World in Data table for World (OWID_WRL), opened 2026-11-09.
# Values are rounded to two decimal places from the source's full-precision figures.
# Wind and solar are the source's own columns. The low-carbon share is not a column in the source: it is the sum of
# the source's hydropower, solar, wind, nuclear, other renewables and bioenergy shares. That sum gives 39.42 for 2023
# and 40.91 for 2024, matching Ember's 2025 review (39.4 and 40.9), and 33.76 renewables for 2025, matching the 33.8
# percent Ember reports for 2026. The earlier observations from Ember's 2025 review are replaced by this single source.
# Ember's data catalogue lists a global yearly CSV; this run could not download it (robots rule), so OWID's copy was used.
id: clean-electricity-share
title: Clean electricity share
domain: energy
subfield: Grid and transition
status: live
summary: The share of the world's electricity that comes from low-carbon sources (renewables plus nuclear),
  with solar and wind shown separately. It shows how far the grid has moved away from fossil fuels.
metric:
  name: Share of global electricity generation from low-carbon sources
  unit: '%'
  direction: higher
  scale: linear
  explainer: 'Electricity generation is split by source: fossil fuels, nuclear, hydro, wind, solar and other
    renewables. Low-carbon power is the nuclear and renewable part, so the share is the fraction of all
    electricity produced worldwide that does not burn fuel. The measure says nothing about total demand: when
    demand grows fast, clean power can add a lot and still lose share, or gain share while fossil output
    also rises. Wind and solar are shown on their own because they are the fastest-growing parts of the
    renewable mix.'
chart:
  primary: coverage-meter
  secondary:
  - record-chart
series:
- id: low-carbon
  label: Low-carbon (renewables and nuclear)
- id: wind
  label: Wind
- id: solar
  label: Solar
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Ember publishes its Global Electricity Review once a year, and its yearly data download is updated monthly.
    To update, open Ember''s yearly data and the Our World in Data table for World, add the new year for each series
    (low-carbon as the sum of the non-fossil shares), and check whether earlier years have been revised. Still to add:
    the reading list.'
sources:
- id: ember-yearly-data
  name: Ember, yearly electricity data (global generation by source)
  url: https://ember-energy.org/data-catalogue/yearly-electricity-data/
  kind: dataset
  primary: true
  notes: Catalogue page opened 2026-11-09; it states that content is released under CC BY 4.0 and names Ember Energy
    Research CIC. The CSV itself (release_generation_yearly_global.csv) is disallowed for automated fetching by the
    file host's robots rule, so the figures were taken from the Our World in Data copy below. Ember's page gives no
    exact credit wording; see the notes on the credit line.
- id: owid-share-elec-by-source
  name: Our World in Data, share of electricity production by source (World), built from Ember data
  url: https://ourworldindata.org/grapher/share-elec-by-source
  kind: dataset
  notes: CSV opened 2026-11-09 at https://ourworldindata.org/grapher/share-elec-by-source.csv?country=OWID_WRL (the
    file returned contains all entities; the World rows for 1900 to 2025 were read from it). Used for every
    observation in this file. Cite both OWID and Ember.
- id: ember-ger-2025
  name: Ember, Global Electricity Review 2025 (2024 in review)
  url: https://ember-energy.org/latest-insights/global-electricity-review-2025/2024-in-review/
  kind: report
  notes: Used for the 2024 milestone event. Its 2023 and 2024 low-carbon figures (39.4 and 40.9) agree with the
    observations here. Content is released under CC BY 4.0.
- id: ember-ger-2026-energyconnects
  name: 'EnergyConnects: Renewables Topped Coal in Global Power Mix in 2025, Ember Says (April 2026)'
  url: https://www.energyconnects.com/news/renewables/2026/april/renewables-topped-coal-in-global-power-mix-in-2025-ember-says/
  kind: news
  notes: Press report of Ember's 2026 review. Relayed figures only; not read directly from Ember.
- id: ember-ger-2026-pv-tech
  name: 'pv-tech: Global solar generation met three-quarters of new power demand in 2025 (Ember)'
  url: https://www.pv-tech.org/global-solar-generation-met-three-quarters-of-new-power-demand-in-2025-ember
  kind: news
  notes: Press report of Ember's 2026 review. Relayed figures only; not read directly from Ember.
events:
- date: '2024'
  kind: milestone
  title: Low-carbon sources pass 40% of global electricity for the first time since the 1940s
  why_it_matters: The grid's clean share crossed the symbolic 40% line, and the record-setting growth came mainly from solar.
  url: https://ember-energy.org/latest-insights/global-electricity-review-2025/2024-in-review/
- date: '2025'
  kind: milestone
  title: Renewables overtake coal in the global power mix in 2025
  why_it_matters: Renewables produced more of the world's electricity than coal for the first time in the year, a clear break with the coal-dominated mix.
  url: https://www.energyconnects.com/news/renewables/2026/april/renewables-topped-coal-in-global-power-mix-in-2025-ember-says/
- date: '2025'
  kind: milestone
  title: Solar generation overtakes wind worldwide for the first time
  why_it_matters: Solar is now the largest of the two variable renewables, so its growth drives most of the rise in clean power.
  url: https://www.pv-tech.org/global-solar-generation-met-three-quarters-of-new-power-demand-in-2025-ember
