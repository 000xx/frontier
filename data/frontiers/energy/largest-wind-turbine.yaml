# Records are transcribed by hand from the pages listed under sources; each value was read in this run.
# A record is an installed wind turbine (prototype or first unit) with a higher rated power than any installed
# before it. Announced designs and nacelles on a factory floor do not count until the turbine is standing.
id: largest-wind-turbine
title: Most powerful wind turbine
domain: energy
subfield: Wind, heat and fuels
status: draft
summary: The highest rated power of any wind turbine actually installed, usually a prototype at a test site.
  Bigger turbines cut the cost of offshore wind, and since 2023 Chinese makers have pushed the record from 16 to
  26 megawatts in about two years.
metric:
  name: Rated power of the most powerful installed wind turbine
  unit: MW
  direction: higher
  scale: linear
  explainer: 'A wind turbine''s rated power is the most electricity it is designed to produce, reached once the
    wind is strong enough. It depends mostly on the size of the rotor: the power in the wind that a rotor can
    catch grows with the area its blades sweep, so a modest increase in blade length adds a lot of power. Bigger
    turbines matter most at sea, where foundations, cables, installation ships and maintenance trips cost
    much more per turbine; fewer, larger machines make each megawatt cheaper. New sizes are first put up as
    prototypes, often at onshore or coastal test sites, and tested before they are sold in numbers, so the record is held by a test machine, not a working wind farm. All figures here come from
    the manufacturers or trade press reporting their announcements. Rated power is not the same as output:
    how much a turbine actually generates depends on the wind where it stands.'
chart:
  primary: record-chart
  secondary:
  - to-scale-lineup
series:
- id: installed
  label: Most powerful installed turbine (any site)
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Draft because coverage starts only in 2023; earlier records (for example the Siemens Gamesa 14 MW, GE
    Haliade-X and Vestas V164 prototypes) need dated sources. Open points for the owner: (1) all records are
    company claims reported by the trade press, so they are claimed, except that Guinness World Records lists
    the Mingyang MySE 16-260 as the largest wind turbine as of its grid connection on 18 July 2023, marked
    confirmed. (2) Goldwind''s 16 MW turbine was reported as the first 16 MW unit installed offshore, about June
    2023; no exact date was read. (3) Sources disagree on whether some prototypes are offshore or at coastal or
    onshore test sites (Mingyang''s 20 MW in Hainan, Dongfang''s 18 MW in Shantou), so all are kept in one
    series. (4) The Dongfang 26 MW turbine is placed at Dongying, Shandong, by offshoreWIND.biz and at a test
    site off Fujian by heise; the record uses offshoreWIND.biz. Its installation was reported complete on 3
    September 2025 and is dated to that month. (5) The Siemens Gamesa 21.5 MW figure comes from press reports;
    no Siemens Gamesa release was opened. (6) CRRC''s 20 MW floating prototype (January 2025) and the CTG and
    Goldwind 20 MW turbine installed at sea (January 2026) did not exceed the record and are not records.'
