update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'Records come from the Wurzel & Hsu data set (data/datasets/wurzel-hsu-lawson), frozen as published
    in Phys. Plasmas 32, 112106 (2025). To update: check the GitHub repository for a new published data
    set or paper, rebuild results.csv with scripts/build_wurzel_hsu_results.py, then run scripts/import_wurzel_hsu_lawson.py.
    The repository''s live (unpublished) data set already has 7 more rows (FT 1981, HL-3 2025, W7-X 2024,
    four Z Facility shots); add them once they appear in a refereed version. Shots with Q_sci but no triple
    product (including every NIF ignition shot) are not records; they are covered by events and candidates.'
