# Series and records are generated by scripts/import_wurzel_hsu_lawson.py.
# Edit the other fields by hand; edit the dataset, not the records, for record changes.
id: fusion-performance
title: Fusion energy performance
domain: energy
subfield: Fusion
status: draft
summary: How close fusion experiments have come to producing more energy than it takes to heat their fuel,
  measured by the triple product of density, temperature and confinement time. Every major approach, from
  tokamaks to lasers, is tracked on the same scale.
metric:
  name: Fusion triple product
  unit: keV m^-3 s
  direction: higher
  scale: log
  explainer: A fusion fuel releases more energy than it loses only if it is hot enough, dense enough and
    holds its heat long enough. Multiplying those three numbers (ion density, ion temperature in keV,
    and energy confinement time) gives the triple product, a single score for how close an experiment
    is to the goal. For deuterium-tritium fuel, a plasma that heats itself (ignition) needs a triple product
    of roughly 3×10^21 keV m^-3 s at around 14 keV in the simplest case, and more in real plasmas whose
    temperature and density fall off toward the edge. Magnetic machines and laser-driven implosions define
    their density, temperature and time a little differently, but this compilation puts both on one scale.
    The second measure, scientific gain Q_sci, is the fusion energy out divided by the heating energy
    delivered to the fuel; above 1 is scientific breakeven.
  target:
    value: 2.9e+21
    label: 'Ignition for D-T fuel: minimum triple product about 2.9×10^21 keV m^-3 s at about 14 keV,
      for an idealised uniform plasma (Wurzel & Hsu 2022, Table 3, Q_fuel = ∞)'
  axes:
  - id: ion_temperature
    name: Ion temperature (peak T_i0 for magnetic confinement, burn-averaged ⟨T_i⟩_n for inertial)
    unit: keV
  - id: q_sci
    name: Scientific gain Q_sci (fusion energy or power out / heating energy or power in)
    unit: ratio
chart:
  primary: target-zone-scatter
  secondary:
  - threshold-gauge
  - record-chart
