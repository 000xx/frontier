stages:
- assembly
- operating
- scientific breakeven
candidates:
- id: nif
  name: National Ignition Facility (NIF)
  kind: Laser indirect drive
  stage: scientific breakeven
  history:
  - stage: scientific breakeven
    date: '2022-12-05'
    source: wurzel-hsu-2025
    note: Shot N221204, Q_sci 1.51 (3.1 MJ yield from 2.05 MJ of laser energy), Table IV.
  key_result: Q_sci 4.13 (8.6 MJ fusion yield from 2.08 MJ of laser energy), shot N250406 on 2025-04-07,
    D-T fuel, Table IV of Wurzel & Hsu 2025
  source: wurzel-hsu-2025
- id: sparc
  name: SPARC
  developer: Commonwealth Fusion Systems
  kind: Tokamak
  stage: assembly
  history:
  - stage: assembly
    date: 2025-03
    source: cfs-sparc-assembly
    note: Cryostat base installed in Devens, Massachusetts, the first piece of the machine.
  source: cfs-sparc-vessel
  note: In May 2026 CFS said SPARC was nearly 75% complete and that operations would begin in 2027, aiming
    for Q > 1. Wurzel & Hsu 2025 plot its projected peak triple product (6.2×10^21 keV m^-3 s) as a projection,
    not a result.
- id: iter
  name: ITER
  kind: Tokamak
  stage: assembly
  history:
  - stage: assembly
    date: '2020-07-28'
    source: ec-iter-assembly
    note: Official start of the assembly phase; the first major component went into the tokamak pit on
      26 May 2020.
  source: iter-baseline-2024
  note: The baseline proposed in July 2024 puts the start of research operation in 2034, D-D operation
    in 2035 and D-T operation in 2039, four years later than the previous plan. Wurzel & Hsu 2025 plot
    its projected peak triple product (7.4×10^21 keV m^-3 s) as a projection, not a result.
events:
- date: '2021-08-08'
  kind: milestone
  title: NIF shot N210808 yields 1.3 MJ, Q_sci 0.69
  why_it_matters: A laser-driven capsule came within a third of releasing as much fusion energy as the
    laser put in, a jump of roughly eight times over the best shot a few months earlier.
  url: https://arxiv.org/abs/2505.03834
- date: '2022-12-05'
  kind: milestone
  title: NIF achieves ignition and scientific breakeven (shot N221204, Q_sci 1.5)
  why_it_matters: For the first time, a controlled fusion experiment gave out more fusion energy than
    the energy delivered to its fuel.
  url: https://arxiv.org/abs/2505.03834
- date: 2023-10
  kind: milestone
  title: JET sets a 69 MJ fusion energy record in its final D-T campaign, then closes
  why_it_matters: Europe's largest tokamak ended forty years of operation with its biggest fusion output,
    leaving ITER a unique record of how a tritium-fuelled tokamak behaves.
  url: https://euro-fusion.org/eurofusion-news/dte3record/
- date: 2024-07
  kind: setback
  title: ITER proposes a new baseline with D-T operation in 2039
  why_it_matters: The flagship international tokamak will not test burning D-T plasmas until the end of
    the next decade, four years later than its previous plan.
  url: https://iter.org/sites/default/files/media/2024-07/baseline_press_conference_summary_july-2024_b.pdf
- date: 2025-01
  kind: milestone
  title: EAST holds a high-confinement plasma for 1066 seconds
  why_it_matters: Sustaining the high-confinement mode for over 17 minutes shows a superconducting tokamak
    can hold the regime power plants need for far longer than before, more than doubling EAST's own 403-second
    mark.
  url: https://www.physicsworld.com/a/chinas-experimental-advanced-superconducting-tokamak-smashes-fusion-confinement-record/
- date: '2025-02-12'
  kind: milestone
  title: WEST sustains a plasma for 1337 seconds
  why_it_matters: A second machine beat EAST's mark within weeks, a sign that pulses lasting tens of minutes
    are becoming repeatable across tokamaks rather than a one-off.
  url: https://irfm.cea.fr/en/2025/02/west-sets-a-new-plasma-duration-record/
- date: '2025-04-07'
  kind: milestone
  title: NIF reaches Q_sci 4.13 with an 8.6 MJ yield (shot N250406)
  why_it_matters: Gain on NIF has nearly tripled since the first ignition shot, so breakeven there is
    now repeatable rather than a single result.
  url: https://arxiv.org/abs/2505.03834
- date: 2025-11
  kind: dataset
  title: Wurzel and Hsu publish their updated Lawson-criterion compilation
  why_it_matters: The refereed update puts more than a hundred results from every major fusion approach
    on one triple-product scale and releases the data and code openly.
  url: https://github.com/swurzel/lawson-criterion-paper
reading:
- level: deep
  title: Continuing progress toward fusion energy breakeven and gain as measured against the Lawson criteria
  author: Samuel E. Wurzel, Scott C. Hsu
  kind: paper
  url: https://arxiv.org/abs/2505.03834
  note: The 2025 update, with data tables for every result on this page.
- level: deep
  title: Progress toward fusion energy breakeven and gain as measured against the Lawson criterion
  author: Samuel E. Wurzel, Scott C. Hsu
  kind: paper
  url: https://arxiv.org/abs/2105.10954
  note: The original 2022 paper, which explains the method and the ignition and breakeven thresholds.
