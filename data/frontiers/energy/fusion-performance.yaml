  primary: true
  notes: MIT licence. data/experimental_results_published_2025.pkl is the frozen data set behind the 2025
    paper; data/experimental_results.pkl is the authors' ongoing, unpublished version.
- id: wurzel-hsu-2025
  name: S. E. Wurzel and S. C. Hsu, "Continuing progress toward fusion energy breakeven and gain as measured
    against the Lawson criteria", Phys. Plasmas 32, 112106 (2025), arXiv:2505.03834
  url: https://arxiv.org/abs/2505.03834
  kind: paper
  notes: Data Tables I-IV of v6 (7 November 2025); DOI 10.1063/5.0297357. Every record value was checked
    against these tables.
- id: wurzel-hsu-2022
  name: S. E. Wurzel and S. C. Hsu, "Progress toward fusion energy breakeven and gain as measured against
    the Lawson criterion", Phys. Plasmas 29, 062103 (2022), arXiv:2105.10954
  url: https://arxiv.org/abs/2105.10954
  kind: paper
  notes: Source of the ignition target (Table 3) and of the methods the 2025 update reuses.
