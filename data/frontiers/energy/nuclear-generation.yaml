# Nuclear generation: observations are the world's nuclear electricity generation in terawatt-hours, 1990 to 2025. They are
# read by scripts/fetchers/nuclear_generation.py from Our World in Data's copy of Ember and Energy Institute data (grapher
# nuclear-energy-generation, World rows, nuclear column). The figures do not match two 2026 reports: the World Nuclear
# Association gives 2,702 TWh for 2025 and 2,667 TWh for 2024, and the World Nuclear Industry Status Report 2026 gives
# 2,703 TWh for 2025. OWID gives 2,811.57 and 2,777.11. The gap (about 110 TWh a year) is unexplained, so the frontier is
# draft until the owner decides which series to use.
id: nuclear-generation
title: Nuclear generation
domain: energy
subfield: Fission
status: draft
summary: The electricity generated by nuclear reactors worldwide each year. Nuclear is the largest source of low-carbon
  power that does not depend on the weather, so its output shows how much steady clean power the grid gets from existing plants.
metric:
  name: Nuclear electricity generation, world
  unit: TWh
  direction: higher
  scale: linear
  explainer: 'Generation is the electricity that reactors actually send out in a year, measured in terawatt-hours. It is
    different from capacity, which is how much a plant could produce if it ran at full power all the time. Generation
    rises when reactors are built, when existing reactors run more of the time, and when the fleet is kept running
    rather than shut early. It falls when reactors close, when outages last longer, or when plants are off for
    maintenance. Two reports for the same year can differ by a few percent because they use different reactor lists and
    different accounting for auxiliary power used at the plants.'
chart:
  primary: record-chart
series:
- id: nuclear
  label: Nuclear electricity generation
update:
  cadence: yearly
  last_checked: '2026-11-10'
  notes: 'Ember and the Energy Institute publish their annual data in the first half of each year. To update, run the
    nuclear_generation fetcher. Open item: resolve the difference from the World Nuclear Association and the World Nuclear
    Industry Status Report figures before the frontier is set to live.'
sources:
- id: owid-nuclear-energy-generation
  name: Our World in Data, electricity generation by source (nuclear, World), from Ember and Energy Institute data
  url: https://ourworldindata.org/grapher/nuclear-energy-generation
  kind: dataset
  primary: true
  notes: 'Page opened 2026-11-10. Lists Ember (2026) and Energy Institute Statistical Review of World Energy (2026) as
    sources, with OWID processing. OWID states its work is CC BY and third-party data follows the providers'' terms. The
    grapher CSV is read by the fetcher. The page did not state explicitly that the World series covers all nuclear generation.'
- id: wna-nuclear-2025
  name: World Nuclear News, Fresh record set for nuclear generation in 2025 (World Nuclear Outlook Report)
  url: https://world-nuclear-news.org/articles/fresh-record-set-for-nuclear-generation-in-2025
  kind: news
  notes: 'Opened 2026-11-10. Reports 2,702 TWh for 2025 and a previous record of 2,667 TWh. Used for the event and the
    open item.'
- id: wnisr-2026
  name: Anadolu Agency, report on record global nuclear output in 2025 (World Nuclear Industry Status Report 2026)
  url: https://www.aa.com.tr/en/energy/nuclear/china-drives-record-global-nuclear-output-as-generation-elsewhere-falls/59936
  kind: news
  notes: 'Opened 2026-11-10. Reports 2,703 TWh for 2025, China output up 7.6% and the rest of the world down 0.2%, citing the
    World Nuclear Industry Status Report 2026. The report itself was not opened.'
events:
- date: '2026-09'
  kind: news
  title: World Nuclear Association reports a record 2,702 TWh of nuclear output in 2025
  why_it_matters: The reported figure beat the previous year's record, but it is about 110 TWh below the Our World in Data series used here.
  url: https://world-nuclear-news.org/articles/fresh-record-set-for-nuclear-generation-in-2025
- date: '2026-09'
  kind: news
  title: Record 2,703 TWh of nuclear output in 2025, with China up 7.6 percent and the rest of the world down 0.2 percent
  why_it_matters: China's rise outweighed a small fall in the rest of the world, so the global gain rests mainly on one country's reactors.
  url: https://www.aa.com.tr/en/energy/nuclear/china-drives-record-global-nuclear-output-as-generation-elsewhere-falls/59936
