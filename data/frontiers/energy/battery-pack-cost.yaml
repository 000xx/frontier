# Battery pack cost: observations come from BloombergNEF's annual price survey, as stated in its public press releases.
# Each value is the headline figure in the release for that year. BNEF restates earlier years in later releases;
# the notes below record where the percentages it gives do not match the values it published.
id: battery-pack-cost
title: Battery pack cost
domain: energy
subfield: Batteries and storage
status: draft
summary: The average price of a lithium-ion battery pack, per kilowatt-hour of storage, as BloombergNEF tracks it each year.
  Falling pack prices are a large part of why batteries now power electric cars and grid storage.
metric:
  name: Volume-weighted average lithium-ion battery pack price
  unit: USD/kWh
  direction: lower
  scale: log
  explainer: 'A battery pack price is what a buyer pays for the packaged battery, divided by its energy capacity, so
    it is measured in dollars per kilowatt-hour. BloombergNEF''s headline figure weights each price by how many
    packs are sold at it, so large volumes count for more than a few unusual deals. The series is a yearly
    average across electric cars, buses, two- and three-wheelers and stationary storage. Each year it is set
    against the cost of the materials in the pack, so a rise can come from metal prices rather than from
    slower engineering. The scale is logarithmic because the price has fallen by about an order of magnitude
    since 2010, and equal slopes on a log chart mean equal percentage changes.'
chart:
  primary: cost-curve
series: []
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'BNEF publishes its battery price survey once a year, in early to mid December. Check whether a new press release
    has appeared; if so, add its year and do not change earlier years unless the new release restates them, and record
    any restatement in the observation note. The full survey, with chemistry, region and segment breakdowns, is paywalled.
    Only figures stated in public BNEF pages are used here. Not yet sourced: values before 2019 (the 2021 release gives
    the 2010 figure only as "above $1,200", and the 2019 release as "above $1,100"), so the 2010 to 2018 history is missing.
    BNEF restates its series: the 2024 release gives a 20% fall from 2023, but $139 to $115 is about 17%; the 2025 release
    gives an 8% fall from 2024, but $115 to $108 is about 6%; the 2023 release gives a 14% fall from 2022, but $151 to $139
    is about 8%. The published figures for those years therefore appear to have been revised, and the observations keep
    each year as first published. Real or nominal basis: see the observation notes.'
