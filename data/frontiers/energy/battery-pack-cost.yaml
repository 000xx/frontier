observations:
- date: '2019'
  value: 156
  source: bnef-2019-press
  note: Market average as published in the 2019 survey. Real or nominal basis not stated for this figure; the 2010 to 2019 decline is given in real terms. Volume-weighting not stated.
- date: '2020'
  value: 137
  source: bnef-2020-press
  note: Market average as published in the 2020 survey. Real or nominal basis not stated for this figure; the 2010 to 2020 decline is given in real terms. Volume-weighting not stated for the headline figure.
- date: '2021'
  value: 132
  source: bnef-2021-press
  note: Real 2021 dollars, per the release ("All prices are in real 2021 $, unless stated as nominal"). Headline volume-weighting not stated; the battery electric vehicle average of $118/kWh is described as volume-weighted.
- date: '2022'
  value: 151
  source: bnef-2022-press
  note: Volume-weighted average across all sectors, per the release. Described as a 7% rise in real terms, so the figure is treated as real. Restated later, since the 2023 release implies a 2022 value near $162.
- date: '2023'
  value: 139
  source: bnef-2023-press
  note: Real or nominal basis not stated for the headline figure. The same release gives its forecast in real 2023 dollars, so the series is treated as real. Volume-weighting stated for battery electric vehicle packs only.
- date: '2024'
  value: 115
  source: bnef-2024-press
  note: Real or nominal basis not stated in the release. Volume-weighting not stated. The release's 20% fall from 2023 does not match $139 to $115 (about 17%), which suggests a restated 2023 value.
- date: '2025'
  value: 108
  source: bnef-2025-press
  note: Headline figures are described as volume-weighted averages (2025 blog). The 93% fall since 2010 is given in real terms. Real or nominal basis of the $108 figure not stated. The release's 8% fall from 2024 does not match $115 to $108 (about 6%), which suggests a restated 2024 value.
events:
- date: '2025-12-09'
  kind: milestone
  title: BNEF's 2025 survey puts average pack prices at a new low of $108/kWh
  why_it_matters: Average pack prices fell again and stationary storage packs, now at $70/kWh, became the cheapest segment, which means cheap batteries are increasingly being bought for the grid rather than for cars.
  url: https://about.bnef.com/insights/commodities/lithium-ion-battery-pack-prices-fall-to-108-per-kilowatt-hour-despite-rising-metal-prices/
- date: '2024-12-10'
  kind: milestone
  title: BNEF records the largest annual fall since 2017, to $115/kWh
  why_it_matters: The drop came even as the metal prices in the pack were still high, showing that cuts in cell design and manufacturing can outweigh input costs.
  url: https://about.bnef.com/insights/clean-transport/lithium-ion-battery-pack-prices-see-largest-drop-since-2017-falling-to-115-per-kilowatt-hour/
- date: '2022-12-06'
  kind: setback
  title: BNEF records the first annual rise in average pack prices, to $151/kWh
  why_it_matters: Higher raw material costs and inflation reversed years of falling prices, a reminder that the decline depends on input costs as well as engineering.
  url: https://about.bnef.com/blog/lithium-ion-battery-pack-prices-rise-for-first-time-to-an-average-of-151-kwh/
- date: '2020-12-16'
  kind: milestone
  title: First reported sub-$100/kWh battery packs, while the market average stands at $137/kWh
  why_it_matters: Individual packs were now reported below the $100/kWh level that carmakers had long named as a target, even though the typical price was still well above it.
  url: https://about.bnef.com/insights/clean-energy/battery-pack-prices-cited-below-100-kwh-for-the-first-time-in-2020-while-market-average-sits-at-137-kwh/
