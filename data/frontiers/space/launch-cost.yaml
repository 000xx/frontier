# Launch cost to low Earth orbit.
# observations transcribe Table A1 of Jones (2018), one series per vehicle, values exactly as printed in
# thousands of US dollars per kg. Do not add figures from other compilations (CSIS, OWID, company price
# lists) to these series: they use different dollar years, payload assumptions and price/cost bases.
id: launch-cost
title: Cost of launch to low Earth orbit
domain: space
subfield: Getting to orbit
status: draft
summary: What it costs to put one kilogram into low Earth orbit on each launch vehicle, plotted against the
  year the vehicle first flew. Cheaper access to orbit underpins almost everything else done in space.
metric:
  name: Launch cost per kilogram to low Earth orbit, by vehicle
  unit: thousand US$ per kg (CPI-adjusted to 2018 dollars)
  direction: lower
  scale: log
  explainer: 'Each point is one rocket: the cost of a launch divided by the most mass that rocket can lift
    to low Earth orbit, placed at the year the rocket first flew. The figures come from a single table in a
    2018 NASA conference paper by Harry Jones, which gathers numbers from older compilations and company
    price lists and converts them all to 2018 US dollars with the Consumer Price Index. Read the chart as a
    rough picture, not a precise ranking. The figures are not all the same kind of number: the Falcon 9
    and Falcon Heavy points are prices SpaceX advertised in 2018, while older points come from engineering
    cost studies and reference books whose basis Jones does not always state. Real missions rarely use a
    rocket''s full capacity, so the cost per kilogram actually delivered is usually higher. A rocket''s
    cost also changes over its life, but each vehicle appears here once, at its first-flight year, with
    whatever estimate the cited reference gave. Other compilations, such as the one by the CSIS Aerospace
    Security Project, use a different inflation index and dollar year (2021) and different payload
    assumptions, so their numbers should not be mixed into this series.'
