about:
  what: "What it costs to put one kilogram into low Earth orbit on each launch vehicle, adjusted for inflation."
  why: "Launch cost limits almost everything done in space, from communications and weather satellites to telescopes and crewed missions. When the price for each kilogram falls, projects that were unaffordable become practical."
