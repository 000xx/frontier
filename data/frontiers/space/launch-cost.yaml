events:
- date: '2015-12-21'
  kind: milestone
  title: A Falcon 9 first stage lands back at Cape Canaveral after an orbital launch
  why_it_matters: It was the first time the expensive first stage of an orbital rocket came back intact,
    the step that made reusing boosters possible.
  url: https://www.af.mil/News/Article-Display/Article/637696/45th-sw-launches-orbcomm-lands-first-stage-booster
- date: '2017-03-30'
  kind: milestone
  title: A previously flown Falcon 9 booster launches SES-10 and lands again
  why_it_matters: Flying a recovered orbital booster a second time showed that recovery could actually
    save hardware, not just retrieve it.
  url: https://www.scientificamerican.com/article/used-spacex-rocket-launches-satellite-then-lands-in-historic-first-reflight1/
- date: '2018-07'
  kind: paper
  title: NASA Ames paper estimates commercial launch has cut the cost to LEO about twentyfold
  why_it_matters: It put old government rockets and new commercial prices into one inflation-adjusted
    table, which is the series this page charts.
  url: https://ntrs.nasa.gov/api/citations/20200001093/downloads/20200001093.pdf
- date: '2022-09-01'
  kind: dataset
  title: CSIS updates its launch-cost-per-kilogram compilation of 61 vehicles
  why_it_matters: It is the broadest public comparison of launch costs on one dollar basis and the likely
    future primary source for this page.
  url: https://aerospace.csis.org/data/space-launch-to-low-earth-orbit-how-much-does-it-cost/
- date: '2024-10-13'
  kind: milestone
  title: Starship's Super Heavy booster is caught by the launch tower on Flight 5
  why_it_matters: Catching the booster at the pad is meant to let the largest rocket yet fly again quickly,
    which is how full reuse could push costs far lower.
  url: https://www.scientificamerican.com/article/spacex-catches-a-falling-starship-a-first-in-spaceflight-history/
- date: '2025-11-13'
  kind: milestone
  title: Blue Origin lands a New Glenn booster at sea after launching NASA's ESCAPADE
  why_it_matters: A second company can now recover an orbital booster, so reuse is no longer a single
    provider's advantage.
  url: https://space.com/space-exploration/launches-spacecraft/blue-origin-lands-huge-new-glenn-rocket-booster-for-1st-time-after-acing-mars-escapade-launch-for-nasa
