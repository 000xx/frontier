update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'All observations are from Jones (2018), Table A1, "Launch cost to LEO in current dollars", checked
    twice against the NASA NTRS PDF. Its newest vehicle first flew in 2018, so nothing after Falcon Heavy is
    covered. The preferred replacement is the CSIS Aerospace Security Project compilation (61 vehicles,
    first flights 1962-2019, FY2021 dollars, unit flyaway cost), but its values sit in a Google Sheet behind
    an interactive chart and in an OWID CSV, and neither could be opened in this run. If that series is
    adopted, replace the Jones series wholesale rather than mixing the two. OWID lists its next expected
    update of the CSIS data for December 2026. First-launch years are as Jones prints them and some look
    doubtful (see the Delta III note); they were not checked against launch logs.'
sources:
- id: jones-2018
  name: 'H. W. Jones, "The Recent Large Reduction in Space Launch Cost", 48th International Conference on
    Environmental Systems, ICES-2018-81, Albuquerque, July 2018 (NASA Ames Research Center)'
  url: https://ntrs.nasa.gov/api/citations/20200001093/downloads/20200001093.pdf
  kind: paper
  primary: true
  notes: NTRS record 20200001093 (https://ntrs.nasa.gov/citations/20200001093), rights determination
    "GOV_PUBLIC_USE_PERMITTED". Table A1 gives first-launch year and thousand $/kg for 36 entries, each
    with its own reference (Koelle 1991, Wertz and Larson 1996, Futron 2002, SpaceX.com 2018, Wikipedia
    2018 and others), corrected to 2018 dollars with the CPI. Table A2 shows the arithmetic for Saturn V,
    the Space Shuttle, Falcon 9 and Falcon Heavy. Conference proceedings, not a refereed journal.
- id: csis-launch-cost
  name: 'CSIS Aerospace Security Project, "Space Launch to Low Earth Orbit: How Much Does It Cost?"'
  url: https://aerospace.csis.org/data/space-launch-to-low-earth-orbit-how-much-does-it-cost/
  kind: dataset
  notes: By Thomas G. Roberts, last updated 1 September 2022. Cost per kg on a dedicated launch, usually
    unit flyaway cost, divided by the maximum payload to LEO the provider reports; FY2021 dollars via the
    OMB GDP chained price index, or then-year dollars. The values are not on the page; the interactive
    chart (https://csis-ilab.github.io/aerospace-viz/LaunchCostSuccessComparison/) loads them from a Google
    Sheet, which could not be opened in this run. The site footer says "All rights reserved" and no
    licence was found, so no values are used here yet.
- id: owid-launch-cost
  name: Our World in Data, "Cost of space launches to low Earth orbit"
  url: https://ourworldindata.org/grapher/cost-space-launches-low-earth-orbit
  kind: dataset
  notes: OWID's copy of the CSIS data (61 vehicles, 1962-2019, constant 2021 US$ per kg), retrieved by
    OWID on 2025-03-04. OWID's metadata labels the CSIS data CC BY 4.0, which the CSIS site itself does not
    state. The CSV download could not be opened in this run.
