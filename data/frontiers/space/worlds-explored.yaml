  date_done: '1985-09-11'
  by: ISEE-3 (USA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives ISEE-3 as the first spacecraft to fly past a comet.
- id: 67p
  label: 67P/Churyumov-Gerasimenko
  group: Comets
  status: done
  status_detail: first orbit
  date_done: '2014-09-10'
  by: Rosetta (ESA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives Rosetta as the first spacecraft to orbit a cometary nucleus. Philae landed on the comet on 12 November 2014, the first comet landing listed on the page.
events:
- date: '2014-11-12'
  kind: milestone
  title: Philae becomes the first spacecraft to land on a comet
  why_it_matters: A landing on a comet's surface turns the visits from fly-bys into direct contact with a primitive body.
  url: https://science.nasa.gov/deep-space-exploration/
- date: '2015-03-07'
  kind: milestone
  title: Dawn becomes the first spacecraft to orbit a dwarf planet, at Ceres
  why_it_matters: Orbiting a second body in the asteroid belt showed that a spacecraft could stay with a small world for a long period, not just pass it.
  url: https://science.nasa.gov/deep-space-exploration/
- date: '2005-01-14'
  kind: milestone
  title: Huygens becomes the first spacecraft to soft-land on Titan
  why_it_matters: The first landing on a moon in the outer solar system extended direct surface exploration far beyond the inner planets.
  url: https://science.nasa.gov/deep-space-exploration/
reading: []
