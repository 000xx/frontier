  status_detail: first landing
  date_done: '2005-01-14'
  by: Huygens (ESA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives Huygens as the first spacecraft to soft-land on Titan.
- id: pluto
  label: Pluto
  group: Dwarf planets and asteroids
  status: done
  status_detail: first flyby
  date_done: '2015-07-14'
  by: New Horizons (USA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives New Horizons as the first spacecraft to fly by Pluto.
- id: gaspra
  label: 951 Gaspra
  group: Dwarf planets and asteroids
  status: done
  status_detail: first flyby
  date_done: '1991-10-26'
  by: Galileo (USA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives Galileo as the first spacecraft to fly past an asteroid, at 951 Gaspra.
- id: eros
  label: 433 Eros
  group: Dwarf planets and asteroids
  status: done
  status_detail: first orbit
  date_done: '2000-02-14'
  by: NEAR Shoemaker (USA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives NEAR Shoemaker as the first spacecraft to orbit an asteroid, at 433 Eros. Its landing (12 and 13 February 2001 in the page's list) is not used here.
- id: vesta
  label: 4 Vesta
  group: Dwarf planets and asteroids
  status: done
  status_detail: first orbit
  date_done: '2011-07-16'
  by: Dawn (USA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives Dawn as the first spacecraft to orbit a body in the main asteroid belt.
- id: ceres
  label: 1 Ceres
  group: Dwarf planets and asteroids
  status: done
  status_detail: first orbit
  date_done: '2015-03-07'
  by: Dawn (USA)
  url: https://science.nasa.gov/deep-space-exploration/
  source: nasa-deep-space-firsts
  note: The page gives Dawn as the first spacecraft to orbit a dwarf planet, at 1 Ceres.
- id: giacobini-zinner
  label: 21P/Giacobini-Zinner
  group: Comets
  status: done
