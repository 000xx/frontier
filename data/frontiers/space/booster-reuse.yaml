# Records are transcribed from launch news articles that were opened in this run. No fetcher: the source is
# not a machine-readable table. Gaps are noted in update.notes; add them only from pages opened in a later run.
id: booster-reuse
title: Most flights by one orbital booster
domain: space
subfield: Getting to orbit
status: draft
summary: The most times a single orbital rocket booster has flown to space and back, record by record. Each
  extra flight of the same booster lowers the cost of getting to orbit, so this count tracks how well reuse works.
metric:
  name: Flights by the most-flown orbital booster
  unit: flights
  direction: higher
  scale: linear
  explainer: 'A booster is the first stage of a rocket, the part that carries the rest up and falls back to Earth
    after its work. Reusing a booster means landing it and flying it again. The record here is the largest number
    of orbital flights made by one physical booster. Each flight is counted once, and the count is the booster''s
    own, not the number of boosters a company has flown. The counts are what the company or the news articles
    report from launch logs, so they are claimed rather than checked against an independent registry. Reaching a
    high count shows that the hardware survives repeated flights, but it says little about cost on its own, because
    refurbishment, insurance and launch rate also matter.'
chart:
  primary: record-chart
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Records were taken from news articles, all of them about Falcon 9 booster B1067 except the first, which
    is B1062. Only the record-setting flights listed here were opened. Flights 21 to 24, 26 and 28 to 32 are not yet
    recorded, so the history is incomplete; the current record (37, 2026-08-25) was checked against two articles.
    The dates for the 20th, 25th, 27th, 35th flights are those in the preview articles, not confirmed by a
    post-launch article. Check SpaceX and launch logs for flights after August 2026. No 38th flight was found in
    search on 2026-11-09.'
