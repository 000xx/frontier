# Observations are the yearly World counts from Our World in Data's copy of the UN Office for Outer Space Affairs
# (UNOOSA) Online Index of Objects Launched into Outer Space. They are written by scripts/fetchers/objects_in_orbit.py.
id: objects-in-orbit
title: Objects launched into space
domain: space
subfield: Getting to orbit
status: live
summary: How many objects the world launched into space each year, counted from the UN register of launched
  objects. The count shows how quickly the amount of hardware above us has grown, and which launches are
  adding to it.
metric:
  name: Objects launched into space per year
  unit: objects
  direction: higher
  scale: linear
  explainer: 'Each year, states that launch objects into space register them with the United Nations. The UN
    Online Index lists each registered object with its launch date, so counting the entries for a year gives
    the number of objects launched that year. One launch can carry many objects: a single rideshare rocket can
    release dozens of small satellites, and a constellation launch adds whole batches at once. The count is
    therefore not the same as the number of rocket launches. It also counts every object, large or small, and
    does not show how long each one stays in orbit. Objects launched in one year can be gone within days or
    stay in orbit for centuries, so the yearly count is a measure of new activity, not of the stock of debris.'
chart:
  primary: record-chart
series:
- id: world
  label: World
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Observations come from the Our World in Data grapher for the World (OWID_WRL), which republishes
    UNOOSA data, 1957 to 2025 at the time of the 2026-11-09 check. The fetcher adds new years and reports
    changes. OWID states the UNOOSA data under CC BY; UNOOSA is the original provider.'
sources:
- id: owid-objects-launched
  name: 'Our World in Data, "Annual number of objects launched into space" (data from UNOOSA, 2026, with major processing by Our World in Data)'
  url: https://ourworldindata.org/grapher/yearly-number-of-objects-launched-into-outer-space
  kind: dataset
  primary: true
  notes: Licence stated on the OWID page as Creative Commons BY. The page notes that third-party data is subject to
    the original providers' terms. The underlying dataset is the UNOOSA Online Index of Objects Launched into
    Outer Space. The UNOOSA's own page was not opened in this run.
