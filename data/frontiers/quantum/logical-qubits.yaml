  notes: 'No machine-readable source; records are added by hand from papers opened in full. Only the
    Google Quantum AI result has been checked, so the history covers one platform and is incomplete. The
    Microsoft and Quantinuum four-logical-qubit announcement has no logical error rate in the source and is
