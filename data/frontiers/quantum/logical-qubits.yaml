id: logical-qubits
title: Logical qubit error rates
domain: quantum
subfield: Quantum technologies
status: draft
summary: How reliable a protected quantum bit becomes when many physical qubits work together to correct errors. The key milestone is error correction that gets better, not worse, as the code grows.
metric:
  name: Logical error rate per correction cycle
  unit: per cycle
  direction: lower
  scale: log
  explainer: 'A physical qubit is easily disturbed, so error-correction codes spread one protected "logical"
    qubit across many physical ones and repeatedly measure them to find and fix errors. The logical error
    rate is the chance that the protected qubit still goes wrong in one correction cycle. The milestone that
    matters is below threshold: a bigger code must lose less information than a smaller one, so the logical
    error rate falls as the code distance grows. Distance is a measure of the code''s size, and the suppression
    factor compares the error rate at one distance with the next. Results depend on the code, the decoder
    that interprets the measurements, and the hardware, so only the same kind of result is compared.'
