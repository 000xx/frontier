# Observations are world cereal yields, tonnes per hectare, 1961 to 2024, read from Our World in Data's copy of
# FAO's crop data (grapher cereal-yield, World row OWID_WRL), opened 2026-11-09 through the refresh workflow's
# dry run. Values are the source's own, rounded to four decimals.
id: cereal-yields
title: Cereal yields
domain: food
subfield: Crops
status: draft
summary: How many tonnes of cereal grain the world harvests from each hectare of cropland, on average. Cereals
  (wheat, rice, maize and others) supply most of the calories people eat, so yield growth is what lets output keep
  up with a growing population without clearing more land.
metric:
  name: World cereal yield
  unit: t/ha
  direction: higher
  scale: linear
  explainer: 'Cereal yield is the harvest of grain crops divided by the area they are grown on, so it measures how
    much each hectare produces, not how much land is used. It is an average over all countries, weighted by
    where the crops grow, so it can rise because better farms in one region gain more weight than poor ones. Read
    the trend over decades rather than single years: a drought can cut one harvest by a tenth without changing the
    long-run path.'
chart:
  primary: record-chart
series:
- id: world
  label: World
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Observations come from the Our World in Data grapher cereal-yield (World row), which carries FAO''s
    cereal yield series. The refresh fetcher reads the same CSV and updates only changed or new years. Still to
    add: a reading list, and a check of the FAO item code against FAOSTAT.'
sources:
- id: owid-cereal-yield
  name: Our World in Data, cereal yield (World), built from FAO data
  url: https://ourworldindata.org/grapher/cereal-yield
  kind: dataset
  primary: true
  notes: CSV read through the refresh workflow's dry run at https://ourworldindata.org/grapher/cereal-yield.csv?country=OWID_WRL
    on 2026-11-09. The column is 'Cereals - Yield (tonnes per hectare)'. Cite OWID and FAO.
- id: fao-faostat
  name: FAO, FAOSTAT crops and livestock statistics
  url: https://www.fao.org/faostat/
  kind: dataset
  notes: 'FAO database terms (opened 2026-11-09 at https://www.fao.org/contact-us/terms/db-terms-of-use) say datasets
    are CC BY 4.0 unless stated otherwise, require attribution to FAO with the database, dataset, access date and
    URL and ''Licence: CC-BY-4.0'', say datasets shall not be used for or in conjunction with the promotion of a
    commercial enterprise, and say they may not be redistributed without the consent of the original data provider.
    Only facts are recorded here, with this citation.'
events:
- date: '2016'
  kind: milestone
  title: World cereal yield passes 4 tonnes per hectare for the first time in the series
  why_it_matters: 'The 2016 figure is 4.017 tonnes per hectare, against 1.3532 in 1961, the first year of the series.'
  url: https://ourworldindata.org/grapher/cereal-yield
- date: '2024'
  kind: milestone
  title: World cereal yield peaks in 2023 at 4.2283 tonnes per hectare, and 2024 is slightly lower
  why_it_matters: 'The 2024 value of 4.2058 is just below the 2023 peak, so the latest year did not set a new record.'
  url: https://ourworldindata.org/grapher/cereal-yield
