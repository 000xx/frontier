  kind: milestone
  title: Carter Center reports 10 provisional human Guinea worm cases for 2025
  why_it_matters: The provisional count is a third below the 15 cases reported for 2024.
  url: https://www.cartercenter.org/?p=22014
- date: '2025-05-13'
