  last_checked: '2026-11-09'
  notes: 'Observations are the World values in OWID''s CSV export (WHO data, 1980 to 2025), copied exactly by
    scripts/fetchers/guinea_worm.py. The Carter Center''s 2025 figure of 10 is provisional; the fetcher will
