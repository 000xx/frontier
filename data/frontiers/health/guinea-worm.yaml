# Guinea worm: human cases reported each year, from the World row of Our World in Data's export of WHO data.
# observations are rewritten by scripts/fetchers/guinea_worm.py; do not edit them by hand.
# Latest-year figures are provisional and can be revised.
id: guinea-worm
title: Guinea worm disease
domain: health
subfield: Diseases being eliminated
status: live
summary: How many people are reported with Guinea worm disease each year, and how close the world is to
  eradicating a parasite that has no vaccine and no drug to prevent it.
metric:
  name: Reported human Guinea worm cases per year, worldwide
  unit: cases per year
  direction: lower
  scale: linear
  explainer: 'Guinea worm disease is caused by a parasitic worm. A person who drinks water containing a carrier
    organism gets infected, and months later a worm can emerge through the skin, which is painful and disabling
    while it lasts. The count is of human cases reported through surveillance, so it measures reports rather than
    every infection. The most recent year is provisional and can be revised when late reports arrive, so check
    whether the latest figure is still provisional before comparing it with earlier years.'
chart:
  primary: race-to-zero
series:
- id: cases
  label: Reported human cases
