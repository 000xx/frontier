sources:
- id: owid-measles-cases
  name: Our World in Data, Reported cases of measles (World Health Organization Global Health Observatory)
  url: https://ourworldindata.org/grapher/reported-cases-of-measles
  kind: dataset
  primary: true
  notes: World rows of the CSV export, read by the refresh. OWID credits the World Health Organization Global Health
    Observatory, dates 1974 to 2024, last updated 22 May 2026. OWID's own work is CC BY; the WHO data keeps WHO's terms.
- id: owid-measles-coverage
  name: Our World in Data, Share of children vaccinated against measles (WHO and UNICEF estimates)
  url: https://ourworldindata.org/grapher/share-of-children-vaccinated-against-measles
  kind: dataset
  notes: World rows of the CSV export, read by the refresh. Same terms as owid-measles-cases. Coverage is the
    first-dose (MCV1) estimate in WHO and UNICEF's annual estimates.
- id: unicef-who-coverage-2026
  name: UNICEF and WHO, Global childhood immunization coverage inches forward (release of 21 July 2026)
  url: https://www.unicef.org/india/press-releases/global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy
  kind: press
  notes: Gives 84% first-dose (MCV1) coverage for 2025 and 13.5 million zero-dose children. Read 10 November 2026.
- id: who-measles-2025
  name: WHO, Measles deaths down 88% since 2000 but cases surge (28 November 2025)
  url: https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge
  kind: press
  notes: Gives WHO's modelled estimates for 2024 (about 11 million infections, about 95 000 deaths). These are model
    estimates, not the reported-case series stored here. Read 10 November 2026.
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Observations are the World values in OWID''s CSV exports, copied exactly by scripts/fetchers/measles.py.
    Coverage estimates are revised each year by WHO and UNICEF, so the fetcher rewrites every year it reads. The
    reported-case series is not WHO''s modelled estimate (about 11 million infections in 2024); the frontier stores the
    reported counts only. The terms are WHO''s data terms (public health use, credit WHO).'
events:
- date: '2026-07-21'
  kind: milestone
  title: UNICEF and WHO report 84% first-dose measles coverage for 2025
  why_it_matters: The first-dose share has risen by 13 points since 2000 in the series, but 13.5 million children still missed every vaccine in 2025.
  url: https://www.unicef.org/india/press-releases/global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy
- date: '2025-11-28'
  kind: setback
  title: WHO says measles infections rose to about 11 million in 2024 even as deaths fell
  why_it_matters: Modelled infections are well above the reported counts, so the reported series understates the disease.
  url: https://www.who.int/news/item/28-11-2025-measles-deaths-down-88--since-2000--but-cases-surge
reading: []
