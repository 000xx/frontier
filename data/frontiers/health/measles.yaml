# Measles: reported cases and first-dose vaccine coverage, World rows of Our World in Data's exports of WHO data.
# observations are rewritten by scripts/fetchers/measles.py; do not edit them by hand.
id: measles
title: Measles
domain: health
subfield: Population health
status: live
summary: How many measles cases are reported each year, and how many children receive the first dose of the vaccine
  that prevents them.
metric:
  name: Reported measles cases per year, worldwide
  unit: cases per year
  direction: lower
  scale: linear
  explainer: 'Measles is a highly contagious virus that spreads through the air. A vaccine prevents it, and two doses
    give the strongest protection. The case count is of cases reported to WHO by countries, so it depends on how
    well each country tests and reports. Coverage is the share of one-year-olds who have had the first dose, estimated
    by WHO and UNICEF from country records and surveys. When coverage falls, cases can rise a few years later, so the
    two series are shown together.'
chart:
  primary: race-to-zero
  secondary:
  - glide-path
series:
- id: cases
  label: Reported measles cases
- id: coverage
  label: First-dose MCV1 coverage (%)
