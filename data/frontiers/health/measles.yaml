# Measles: reported cases and first-dose vaccine coverage, World rows of Our World in Data's exports of WHO data.
# observations are rewritten by scripts/fetchers/measles.py; do not edit them by hand.
id: measles
title: Measles
domain: health
subfield: Population health
status: draft
summary: How many measles cases are reported each year, and how many children receive the first dose of the vaccine
  that prevents them.
metric:
  name: Reported measles cases per year, worldwide
  unit: cases per year
  direction: lower
  scale: linear
  explainer: 'Measles is a highly contagious virus that spreads through the air. A vaccine prevents it, and two doses
    give the strongest protection. The case count is of cases reported to WHO by countries, so it depends on how
    well each country tests and reports. Coverage is the share of one-year-olds who have had the first dose, estimated
    by WHO and UNICEF from country records and surveys. When coverage falls, cases can rise a few years later, so the
    two series are shown together.'
chart:
  primary: race-to-zero
  secondary:
  - glide-path
series:
- id: cases
  label: Reported measles cases
- id: coverage
  label: First-dose MCV1 coverage (%)
observations: []
sources:
- id: owid-measles-cases
  name: Our World in Data, Reported cases of measles (World Health Organization Global Health Observatory)
  url: https://ourworldindata.org/grapher/reported-cases-of-measles
  kind: dataset
  primary: true
  notes: World rows of the CSV export, read by the refresh. OWID credits the World Health Organization Global Health
    Observatory, dates 1974 to 2024, last updated 22 May 2026. OWID's own work is CC BY; the WHO data keeps WHO's terms.
- id: owid-measles-coverage
  name: Our World in Data, Share of children vaccinated against measles (WHO and UNICEF estimates)
  url: https://ourworldindata.org/grapher/share-of-children-vaccinated-against-measles
  kind: dataset
  notes: World rows of the CSV export, read by the refresh. Same terms as owid-measles-cases. Coverage is the
    first-dose (MCV1) estimate in WHO and UNICEF's annual estimates.
update:
  cadence: yearly
  last_checked: '2026-11-09'
  notes: 'Observations are the World values in OWID''s CSV exports, copied exactly by scripts/fetchers/measles.py.
    Coverage estimates are revised each year by WHO and UNICEF, so the fetcher rewrites every year it reads. Not yet
    sourced: WHO''s own measles report and any events. The terms are WHO''s data terms (public health use, credit WHO).'
reading: []
