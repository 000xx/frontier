# FDA-approved cellular and gene therapy products, from FDA's listing (current as of 10/30/2026 on the page).
# The listing gives names and manufacturers only, not approval dates. Dates are added from each product's FDA
# announcement or label; only Casgevy and Lyfgenia are dated so far (FDA press announcement, 8 December 2023).
# Cord blood products are separate entries on the list, one per cord blood bank or product name.
id: gene-and-cell-therapies
title: Gene and cell therapies
domain: health
subfield: New kinds of medicine
status: draft
summary: How many living-cell and gene-based medicines the US Food and Drug Administration has approved, from
  the first cord blood products to the newest gene-editing treatment for sickle cell disease.
metric:
  name: Cellular and gene therapy products on the FDA approved list
  unit: products
  direction: higher
  scale: linear
  explainer: 'A cell therapy uses living cells, often a patient''s own, that are changed or grown outside the body
    and then given back. A gene therapy delivers genetic material into the body, or changes the cells that a
    patient''s body already has. The FDA reviews these products through its biologics centre, not its drug
    centre, so they are not counted in the novel drug total. Cord blood products are on the same list, because
    they are biologics used for transplant. The number on the list is a count of products, not patients, and it
    rises only when a new product is approved. Some products have been withdrawn or are no longer marketed, so
    the list does not measure how many treatments are in use today.'
chart:
  primary: countdown-grid
series:
- id: approved-products
  label: Approved products
update:
  cadence: quarterly
  last_checked: '2026-11-09'
  notes: 'The item list comes from the FDA listing of approved cellular and gene therapy products, which gives
    names and manufacturers but no approval dates. Items are not dated, except Casgevy and Lyfgenia, from the
    FDA announcement of 8 December 2023. Still needed: approval dates for the other 53 products, from each FDA
    approval letter or label; the page does not say which products are withdrawn. The ASGCT patient education
    list (not an official source) was read as a cross-check only; it names fewer products on the same topic
    and was not used for any value. The page was blocked once during this run and was read on a second attempt.
    Open for the owner: whether countdown-grid is the right shape, because the list has no target number.'
sources:
- id: fda-ctgt-list
  name: FDA, Approved Cellular and Gene Therapy Products
  url: https://www.fda.gov/vaccines-blood-biologics/cellular-gene-therapy-products/approved-cellular-and-gene-therapy-products
  kind: registry
  primary: true
  notes: 'Lists 55 products; the page gives its content as "current as of: 10/30/2026". Items use the names
    as listed. The page has no dates or indications.'
- id: fda-ctgt-press-2023
  name: FDA, FDA approves first gene therapies to treat patients with sickle cell disease
  url: https://www.fda.gov/news-events/press-announcements/fda-approves-first-gene-therapies-treat-patients-sickle-cell-disease
  kind: press
  notes: Announced 8 December 2023. Covers Casgevy (ages 12 and over, recurrent vaso-occlusive crises) and
    Lyfgenia (ages 12 and over, history of vaso-occlusive events).
- id: asgct-patient-list
  name: ASGCT Patient Education, FDA-approved cell and gene therapy products
  url: https://patienteducation.asgct.org/disease-treatments/fda-approved-cell-gene-therapy-products
  kind: other
  notes: Cross-check only. Not an FDA source.
events:
- date: '2023-12-08'
  kind: milestone
  title: FDA approves Casgevy and Lyfgenia, the first gene therapies for sickle cell disease
  why_it_matters: The first two gene-based treatments for sickle cell disease, one of them a CRISPR gene edit.
  url: https://www.fda.gov/news-events/press-announcements/fda-approves-first-gene-therapies-treat-patients-sickle-cell-disease
- date: '2026-10-30'
  kind: dataset
  title: FDA's approved cellular and gene therapy list is current as of 30 October 2026
  why_it_matters: The list now names 55 products, but gives no approval dates, so the counting by year is not yet possible.
  url: https://www.fda.gov/vaccines-blood-biologics/cellular-gene-therapy-products/approved-cellular-and-gene-therapy-products
