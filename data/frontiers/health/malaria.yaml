candidates:
- id: rts-s-as01
  name: RTS,S/AS01 (Mosquirix)
  developer: GlaxoSmithKline Biologicals
  kind: Vaccine, pre-erythrocytic (liver stage)
  stage: Rollout
  source: who-news
  key_result: 'Efficacy 36.3% (95% CI 31.8-40.5) against clinical malaria, in children aged 5-17 months at first
    dose who got three doses plus a booster at month 20, over a median 48 months of follow-up after dose 1; phase
    3 trial in Africa, enrolled 2009-2011 (Lancet 2015). In the same trial, infants aged 6-12 weeks with the same
    schedule: 25.9% (19.9-31.5) over a median 38 months. Not comparable with R21 or any other trial.'
  url: https://doi.org/10.1016/S0140-6736(15)60721-8
  history:
  - stage: Phase 3
    date: '2009-03-27'
    source: lancet-2015-rtss-phase3
    note: First enrolment in the phase 3 trial (NCT00866619).
  - stage: Regulatory approval
    date: '2015-07-24'
    source: ema-mosquirix-2015
    note: Positive scientific opinion from EMA's CHMP under Article 58, for use outside the EU in children aged 6
      weeks to 17 months. This is an opinion for regulators in endemic countries, not an EU marketing licence.
  - stage: Rollout
    date: '2019-04-23'
    source: who-news
    url: https://www.who.int/news/item/23-04-2019-malaria-vaccine-pilot-launched-in-malawi
    note: Pilot introduction began in Malawi, followed by Ghana and Kenya; a WHO-coordinated pilot, not routine
      national rollout.
  - stage: WHO recommendation
    date: '2021-10-06'
    source: who-news
    url: https://www.who.int/News/Item/06-10-2021-Who-Recommends-Groundbreaking-Malaria-Vaccine-for-Children-at-Risk
    note: Recommended for children in areas of moderate to high P. falciparum transmission, four doses from 5
      months of age.
  - stage: WHO prequalification
    date: 2022-07
    source: who-news
    url: https://www.who.int/news/item/21-12-2023-who-prequalifies-a-second-malaria-vaccine-a-significant-milestone-in-prevention-of-the-disease
    note: Month only, as stated in WHO's December 2023 release.
  note: WHO said in December 2025 that 24 countries had introduced malaria vaccines (RTS,S or R21) into
    routine immunization; country-by-country introduction dates are not yet recorded here.
- id: r21-matrix-m
  name: R21/Matrix-M
  developer: University of Oxford; manufactured by Serum Institute of India
  kind: Vaccine, pre-erythrocytic (liver stage)
  stage: Rollout
  source: who-news
  key_result: 'Efficacy 75% (95% CI 71-79) at seasonal-transmission sites and 68% (61-74) at standard sites,
    against a first episode of clinical malaria over 12 months after the three-dose primary series, in children
    aged 5-36 months; phase 3 trial in Africa, enrolled April 2021 to January 2022 (Lancet 2024). WHO''s
    recommendation cites 66% for the age-based schedule. Not comparable with RTS,S or any other trial.'
  url: https://doi.org/10.1016/S0140-6736(23)02511-4
  history:
  - stage: Phase 3
    date: '2021-04-26'
    source: lancet-2024-r21-phase3
    note: First screening in the phase 3 trial (NCT04704830).
  - stage: Regulatory approval
    date: '2023-04-13'
    source: oxford-news
    url: https://www.ox.ac.uk/node/8209487
    note: Licensed by Ghana's Food and Drugs Authority for children aged 5-36 months; the first approval
      anywhere.
  - stage: WHO recommendation
    date: '2023-10-02'
    source: who-news
    url: https://www.who.int/news/item/02-10-2023-who-recommends-r21-matrix-m-vaccine-for-malaria-prevention-in-updated-advice-on-immunization
  - stage: WHO prequalification
    date: '2023-12-21'
    source: who-news
    url: https://www.who.int/news/item/21-12-2023-who-prequalifies-a-second-malaria-vaccine-a-significant-milestone-in-prevention-of-the-disease
    note: Date of WHO's announcement.
  - stage: Rollout
    date: '2024-07-15'
    source: oxford-news
    url: https://www.ox.ac.uk/news/2024-07-15-c-te-d-ivoire-makes-history-first-nation-deploy-r21matrix-m-malaria-vaccine
    note: Côte d'Ivoire became the first country to use it, starting in Abidjan; the date is from the release's
      address, which says the first vaccination was due that morning.
- id: rh5-1-matrix-m
  name: RH5.1/Matrix-M
  developer: University of Oxford
  kind: Vaccine, blood stage
  stage: Phase 2
  source: lancet-id-2025-rh5
  key_result: 'Efficacy 55% (95% CI 20-75) against a first episode of clinical malaria from 14 days to 6 months
    after the third dose, with doses at months 0, 1 and 5; 40% (-3 to 65) with doses at months 0, 1 and 2;
    children aged 5-17 months in Nanoro, Burkina Faso; interim results of a phase 2b trial (Lancet Infect Dis
    2025). Not comparable with any other trial.'
  url: https://doi.org/10.1016/S1473-3099(24)00752-7
  history:
  - stage: Phase 2
    date: '2024-12-11'
    source: oxford-news
    url: https://www.ox.ac.uk/news/2024-12-11-first-vaccine-against-blood-stage-malaria-well-tolerated-and-offers-effective
    note: Date the interim phase 2b results were announced; the trial start date is not yet sourced.
  note: Oxford plans to test it in combination with the approved liver-stage vaccines.
- id: l9ls
  name: L9LS
  kind: Monoclonal antibody, given by injection to prevent infection
  stage: Phase 2
  source: lancet-2026-l9ls-kenya
  key_result: 'Protective efficacy 42.7% (95% CI 22.5-57.7) against P. falciparum infection detected by blood smear
    (not clinical malaria), two doses of 10-20 mg/kg six months apart, children aged 5-59 months in western
    Kenya, perennial transmission, 12 months of follow-up; phase 2 trial (Lancet 2026). The authors suggest a
    higher dose may be needed. Not comparable with any vaccine trial.'
  url: https://doi.org/10.1016/S0140-6736(26)00258-8
  history:
  - stage: Phase 2
    date: 2026-04
    source: lancet-2026-l9ls-kenya
    note: Month the Kenya phase 2 results were published; the trial start date and earlier phases are not yet
      sourced.
  note: Developer not stated in the source opened.
- id: ganaplacide-lumefantrine
  name: Ganaplacide-lumefantrine (KLU156, GanLum)
  developer: Novartis, with Medicines for Malaria Venture
  kind: Medicine, treatment of uncomplicated P. falciparum malaria (new non-artemisinin combination)
  stage: Phase 3
  source: novartis-news
  key_result: 'Cure rate 97.4% with GanLum vs 94.0% with artemether-lumefantrine (Coartem): PCR-corrected share of
    patients free of symptoms and of baseline parasites at day 29, estimand analysis counting missing data as
    failures; adults and children of 10 kg or more, 34 sites in 12 African countries; phase 3 KALUMA trial,
    announced by Novartis in November 2025 (company announcement, not yet a refereed paper). A treatment cure
    rate, not a prevention efficacy.'
  url: https://www.novartis.com/news/media-releases/novartis-phase-iii-trial-next-generation-malaria-treatment-klu156-ganlum-meets-primary-endpoint-potential-combat-antimalarial-resistance
  history:
  - stage: Phase 3
    date: '2022-11-23'
    source: novartis-news
    url: https://www.novartis.com/news/media-releases/novartis-and-medicines-malaria-venture-announce-decision-move-phase-3-study-novel-ganaplacidelumefantrine-sdf-combination-adults-and-children-malaria
    note: Date Novartis and MMV announced the move to phase 3; the trial was planned to start in 2023.
  note: Novartis reported in its third-quarter 2026 results (27 October 2026) that the US regulatory submission
    was complete and had priority review. Not approved anywhere in the sources opened.
- id: artemether-lumefantrine-neonates
  name: Artemether-lumefantrine for newborns and young infants (Coartem Baby / Riamet Baby)
  developer: Novartis, with Medicines for Malaria Venture
  kind: Medicine, treatment for babies weighing 2 to under 5 kg
  stage: WHO prequalification
  source: novartis-news
  key_result: 'PCR-corrected adequate clinical and parasitological response at day 29: 95.5% in infants older than
    28 days (22 patients) and 100% in neonates aged 1-28 days (6 patients), all under 5 kg; single-arm phase 2/3
    CALINA study, no comparison group; the primary endpoint was drug exposure, not cure (Trop Med Health 2025).
    Not comparable with any other trial.'
  url: https://doi.org/10.1186/s41182-025-00828-z
  history:
  - stage: Phase 3
    date: '2020-12-21'
    source: tmh-2025-calina
    note: First patient visit in CALINA, a combined phase 2/3 study.
  - stage: Regulatory approval
    date: '2025-07-08'
    source: novartis-news
    url: https://www.novartis.com/news/media-releases/novartis-receives-approval-first-malaria-medicine-newborn-babies-and-young-infants
    note: Approved by Swissmedic under its procedure for global health products; eight African countries took
      part in the assessment.
  - stage: WHO prequalification
    date: '2026-04-24'
    source: who-news
    url: https://www.who.int/news/item/24-04-2026-who-prequalifies-first-ever-malaria-treatment-for-newborns-and-infants-adds-new-diagnostic-tests
    note: Date of WHO's announcement; WHO named the product by its ingredients only.
events:
- date: '2026-10-27'
  kind: milestone
  title: Novartis files ganaplacide-lumefantrine with US regulators, who grant priority review
  why_it_matters: A malaria treatment that does not rely on artemisinin is now in regulatory review, at a time when
    resistance to today's artemisinin combinations is spreading in Africa.
  url: https://www.novartis.com/sites/novartis_com/files/q3-2026-media-release-en.pdf
- date: 2026-04
  kind: paper
  title: Antibody L9LS gives partial protection to young children in Kenya
  why_it_matters: Two injections of the antibody cut infections by less than half where transmission is intense,
    so the approach probably needs higher doses before it can protect children where malaria is heaviest.
  url: https://doi.org/10.1016/S0140-6736(26)00258-8
- date: '2026-04-24'
  kind: milestone
  title: WHO prequalifies the first malaria treatment for newborns, and new tests that do not rely on HRP2
  why_it_matters: Prequalification lets international buyers supply the newborn treatment, and the new tests look
    for a different parasite protein, so they can catch parasites that have lost the HRP2 gene most rapid tests rely on.
  url: https://www.who.int/news/item/24-04-2026-who-prequalifies-first-ever-malaria-treatment-for-newborns-and-infants-adds-new-diagnostic-tests
- date: '2025-12-04'
  kind: dataset
  title: World malaria report 2025 estimates 610 000 deaths and 282 million cases in 2024
  why_it_matters: Both numbers rose from the year before, so the world is moving away from zero, not towards
    it, despite new vaccines and nets.
  url: https://www.who.int/teams/global-malaria-programme/reports/world-malaria-report-2025
- date: '2025-12-04'
  kind: setback
  title: Artemisinin partial resistance confirmed in four African countries and suspected in four more
  why_it_matters: The main drug in today's standard treatment is losing its grip in the region with most malaria
    deaths, and WHO also sees early signs that the partner drugs are weakening.
  url: https://www.who.int/news/item/04-12-2025-new-tools-saved-a-million-lives-from-malaria-last-year-but-progress-under-threat-as-drug-resistance-rises
- date: '2025-12-04'
  kind: setback
  title: Mosquitoes resist pyrethroid insecticides in 48 of 53 countries that tested, and Anopheles stephensi
    reaches nine African countries
  why_it_matters: The insecticide on most bed nets is working less well, and an invasive mosquito that shrugs off
    many common insecticides keeps spreading across Africa.
  url: https://cdn.who.int/media/docs/default-source/malaria/world-malaria-reports/world-malaria-report-2025-executive-summary-eng.pdf?sfvrsn=154ea8d5_26&download=true
- date: '2025-11-12'
  kind: news
  title: Ganaplacide-lumefantrine meets its phase 3 goal against the standard treatment
  why_it_matters: A non-artemisinin combination proved at least as good as the standard treatment in a large African
    trial, with a higher cure rate, giving a possible answer to rising artemisinin resistance.
  url: https://www.novartis.com/news/media-releases/novartis-phase-iii-trial-next-generation-malaria-treatment-klu156-ganlum-meets-primary-endpoint-potential-combat-antimalarial-resistance
- date: '2025-07-08'
  kind: milestone
  title: Swissmedic approves the first malaria medicine for newborns and young infants
  why_it_matters: Babies under 5 kg now have an approved malaria medicine with a dose tested in babies their size,
    where before there was none.
  url: https://www.novartis.com/news/media-releases/novartis-receives-approval-first-malaria-medicine-newborn-babies-and-young-infants
