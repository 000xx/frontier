# Malaria: the template for disease pages.
# observations mirror data/datasets/who-malaria-estimates/estimates.csv; change the CSV first, then copy the values here.
# Efficacy figures in candidates come from different trials, endpoints, ages and follow-up periods.
# They are never comparable with each other, and the site must not rank or chart them side by side.
id: malaria
title: Malaria
domain: health
subfield: Diseases being eliminated
status: draft
summary: How many people catch and die of malaria each year, which countries WHO has certified free of it, and
  how far each new vaccine, antibody and medicine has got on the way to children who need it.
metric:
  name: Estimated malaria deaths per year, worldwide
  unit: deaths per year
  direction: lower
  scale: linear
  explainer: 'Malaria is caused by a parasite passed on by mosquito bites. About 95% of deaths are in WHO''s
    African Region. Nobody counts every case or death: many sick people never see a health worker, and many deaths are
    never recorded with a cause. So each year WHO estimates the totals for every country, and gives a range as
    well as a central figure. The range matters: in 2024 the central estimate was about 610 000 deaths, but
    WHO''s range ran from about 561 000 to 738 000. WHO can revise earlier years when it publishes a new report,
    so compare years within one report, not across reports. A country is certified malaria-free when WHO is
    satisfied that local transmission has stopped; it can apply after at least three years in a row without a
    locally acquired case.'
chart:
  primary: stage-timeline
  secondary:
  - natural-map
  - race-to-zero
series:
- id: deaths
  label: Estimated deaths
- id: cases
  label: Estimated cases
stages:
- Preclinical
- Phase 1
- Phase 2
- Phase 3
- Regulatory approval
- WHO recommendation
- WHO prequalification
- Rollout
update:
  cadence: monthly
  last_checked: '2026-11-09'
  notes: 'Observations are from the World malaria report 2025, read from the WHO Global Health Observatory (see
    data/datasets/who-malaria-estimates). The next report usually comes out in December; replace all years then,
    not just the newest. Certified countries come from WHO''s certification list (last updated by WHO on
    2025-07-15); exact dates are given only where a WHO news release was opened, otherwise the year from the
    list. WHO''s list also footnotes northern Venezuela (certified June 1961) and Taiwan (China) (November 1965);
    they are outside WHO''s count of 47 countries and 1 territory and are left out of items. Not yet sourced: phase 1 and phase 2 dates for most candidates, the start dates of the RH5.1, L9LS and
    KALUMA trials (ClinicalTrials.gov could not be read), the developer of L9LS, and a reading list.'
sources:
- id: who-wmr-2025
  name: WHO World malaria report 2025
  url: https://www.who.int/teams/global-malaria-programme/reports/world-malaria-report-2025
  kind: report
  primary: true
  notes: Published 4 December 2025, with estimates to 2024. Licence CC BY-NC-SA 3.0 IGO
    (https://www.who.int/publications/i/item/9789240117822). Country tables are in the Excel annexes at
    https://www.who.int/publications/m/item/annexes-world-malaria-report-2025.
- id: who-wmr-2025-summary
  name: WHO World malaria report 2025, executive summary
  url: https://cdn.who.int/media/docs/default-source/malaria/world-malaria-reports/world-malaria-report-2025-executive-summary-eng.pdf?sfvrsn=154ea8d5_26&download=true
  kind: report
- id: who-gho-malaria-estimates
  name: WHO Global Health Observatory, estimated malaria cases and deaths (global)
  url: https://www.who.int/data/gho/data/indicators/indicator-details/GHO/estimated-number-of-malaria-cases
  kind: dataset
  notes: Read through the GHO API (indicators MALARIA_EST_CASES and MALARIA_EST_DEATHS). Records updated
    2025-12-19 and match the World malaria report 2025. Copied to data/datasets/who-malaria-estimates; WHO data
    terms and the required credit are in its NOTICE.md.
- id: who-certified-list
  name: WHO, Countries and territories certified malaria-free by WHO
  url: https://www.who.int/teams/global-malaria-programme/elimination/countries-and-territories-certified-malaria-free-by-who
  kind: registry
  notes: WHO's register of certifications, 1955 onward, last updated 15 July 2025. Gives the year of each
    certification. A separate column lists countries where malaria never existed or disappeared without
    specific measures; those are not certifications and are not included here.
