events:
- date: '2026-10-04'
  kind: setback
  title: Afghanistan and Pakistan report 58 wild poliovirus type 1 cases in 2026 so far
  why_it_matters: Wild poliovirus is still circulating in the two countries where it is endemic, so the count is
    not falling to zero yet, and the 2026 total already exceeds the 2025 year total.
  url: https://polioeradication.org/about-polio/polio-this-week/
- date: '2023-10-10'
  kind: news
  title: WHO's Eastern Mediterranean Region says it is still the only region with wild poliovirus, in Afghanistan and Pakistan
  why_it_matters: The Eastern Mediterranean is the only WHO region still uncertified, and it is also where the virus
    is still found, so the certification map has one region left to fill.
  url: https://www.emro.who.int/media/news/member-states-urged-to-go-all-in-to-end-polio-during-meeting-of-the-regional-subcommittee-for-polio-eradication-and-outbreaks.html
- date: '2020-08-25'
  kind: milestone
  title: WHO African Region certified wild polio-free
  why_it_matters: With this certification, every WHO region except the Eastern Mediterranean has been certified free of
    wild poliovirus.
  url: https://www.who.int/news/item/25-08-2020-global-polio-eradication-initiative-applauds-who-african-region-for-wild-polio-free-certification
- date: '2019-10-24'
  kind: milestone
  title: WHO declares wild poliovirus type 3 eradicated worldwide
  why_it_matters: With WPV2 already certified in 2015, only wild type 1 is left to eradicate among the three wild types.
  url: https://www.who.int/news-room/feature-stories/detail/two-out-of-three-wild-poliovirus-strains-eradicated
