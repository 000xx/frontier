# Polio: wild and vaccine-derived poliovirus cases, and the eradication milestones WHO has certified.
# Two case series are kept apart on purpose: wild poliovirus type 1 (wpv1) and circulating vaccine-derived
# poliovirus (cvdpv). They are different viruses with different causes and must never be merged.
# WPV1: 2001 to 2023 are World values from Our World in Data's export of WHO data; 2024 is WHO's printed total;
# 2025 and 2026 are our sums of GPEI country counts (2026 is year to date).
# cVDPV: 2016 to 2023 are our sums of the three serotype columns in OWID's export of WHO data; 2024 is WHO's printed total.
id: polio
title: Polio
domain: health
subfield: Diseases being eliminated
status: draft
summary: How many children are paralysed by wild poliovirus each year, and which of the three wild virus types and
  which WHO regions have been certified free of it.
metric:
  name: Wild poliovirus type 1 cases per year, worldwide
  unit: cases per year
  direction: lower
  scale: linear
  explainer: 'Polio is a virus that mostly spreads from person to person and can paralyse a child in a few cases out
    of many infections. Most infections cause no symptoms, so case counts are only a partial picture. The count
    shown here is for wild poliovirus type 1 (WPV1), the type still in circulation in the two countries where it is
    endemic. Circulating vaccine-derived poliovirus (cVDPV) is a separate series: it comes from weakened vaccine virus
    that has changed in under-vaccinated communities, and it is not tracked in the same number. A year to date count
    is not a full-year total, so compare full years with full years.'
chart:
  primary: race-to-zero
  secondary:
  - natural-map
series:
- id: wpv1
  label: Wild poliovirus type 1 (WPV1) cases
- id: cvdpv
  label: Circulating vaccine-derived poliovirus (cVDPV) cases
update:
  cadence: weekly
  last_checked: '2026-11-09'
  notes: 'WPV1 observations: 2001 to 2023 are the World values in the CSV export of Our World in Data''s grapher
    "Reported cases of paralytic polio from wild polioviruses", which processes WHO (2024) data. The 2024 value of 99
    is the full-year total printed in WHO''s Polio IHR Emergency Committee statement of 28 July 2025. The 2013 to 2017
    values match the global table in GPEI''s January 2019 PDF (416, 359, 74, 37, 22). The 2018 value of 33 comes from
    OWID only, because the PDF header could not be read reliably for that year. The 2025 value (52) and the 2026 value
    (58) are still our sums of the GPEI country counts on the "Polio this week" page, as of 4 October 2026; the 2025
    figure is labelled full-year on that page. No source opened prints a global full-year 2025 total. cVDPV
    observations: 2016 to 2023 are our sums of the VDPV1, VDPV2 and VDPV3 World columns in OWID''s export of WHO
    data, which OWID describes as the total across all three strains. 2024 (319) is the full-year total printed in
    the WHO statement of 28 July 2025. A Statista chart text gave 562 for 2024; it conflicts with the WHO figure and
    is not used. No cVDPV full-year total for 2025 or 2026 is sourced: the WHO statement gives 2025 year to date only
    (67, no date given). A PAHO bulletin row labelled cVDPV1 gives a footnote saying it includes all three serotypes,
    and the WHO HQ report of 11 August 2026 lists cVDPV1 figures whose table layout could not be read reliably; neither
    is used. Still not sourced: WPV1 counts before 2001, the exact WPV2 certification date (the source gives only
    2015), and the Eastern Mediterranean status in 2026 beyond the GPEI counts. The South-East Asia certification
    date, 27 March 2014, is confirmed by the WHO fact sheet on poliomyelitis; the regional South-East Asia page gives
    the same date but its wording is inconsistent. The Americas, Western Pacific and Europe dates come from a CDC MMWR
    article. Terms: WHO data may be used for public health purposes only, not to promote a commercial enterprise, and
    must be credited to WHO (see who-data-terms). GPEI content may be reproduced for research or private study with WHO
    credited and the article URL cited, and commercial use needs written permission (see gpei-terms). Our World in
    Data''s own text is CC BY, but the underlying WHO data keeps WHO''s terms. No dataset was copied; only facts are
    stored, with citations.'
sources:
- id: gpei-polio-this-week
  name: GPEI, Polio this week (country updates as of 4 October 2026)
  url: https://polioeradication.org/about-polio/polio-this-week/
  kind: dataset
  primary: true
  notes: Country counts for WPV1 and cVDPV, 2025 and 2026. The page states its country updates are as of 4 October
    2026; the 2025 figures are full-year totals. Read 9 November 2026.
- id: gpei-terms
  name: GPEI website terms of use
  url: https://polioeradication.org/terms-of-use/
  kind: other
  notes: Copyright is held by WHO. Content may be reviewed, reproduced or translated for research or private study.
    Sale or use with commercial purposes is excluded and needs prior written authorisation, as does reproduction of
    substantial portions. Use must acknowledge WHO as the source and cite the article URL. Read 9 November 2026.
- id: who-wpv3-2019
  name: WHO, Two out of three wild poliovirus strains eradicated (24 October 2019)
  url: https://www.who.int/news-room/feature-stories/detail/two-out-of-three-wild-poliovirus-strains-eradicated
  kind: press
  notes: Gives the WPV3 declaration date and states that WPV2 was certified eradicated in 2015. Page carries
    WHO copyright and links to WHO terms of use; the terms text was not read.
- id: who-africa-2020
  name: WHO / GPEI, Global Polio Eradication Initiative applauds WHO African Region for wild polio-free certification
    (25 August 2020)
  url: https://www.who.int/news/item/25-08-2020-global-polio-eradication-initiative-applauds-who-african-region-for-wild-polio-free-certification
  kind: press
  notes: Certification by the Africa Regional Certification Commission, dated 25 August 2020.
- id: who-searo-polio-free
  name: WHO South-East Asia, Polio-free certification
  url: https://www.who.int/southeastasia/activities/maintaining-polio-free-status/polio-free-certification-who-south-east-asia
  kind: other
  notes: Gives 27 March 2014 for the South-East Asia Region certification, but its wording is inconsistent. One sentence
    says the region is only expected to be certified after the March 2014 meeting, and the date sentence is garbled.
    Also gives Americas 1994, Western Pacific 2000 and Europe 2002 by year. The WHO fact sheet (who-factsheet-polio)
    states the date cleanly and is used for the item. Read 9 November 2026.
- id: who-factsheet-polio
  name: WHO fact sheet, Poliomyelitis (page dated 2 April 2025)
  url: https://www.who.int/news-room/fact-sheets/detail/poliomyelitis
  kind: other
  notes: States that the WHO South-East Asia Region was certified polio-free on 27 March 2014. The page gives no yearly
    case counts. Read 9 November 2026.
- id: who-ihr-2025
  name: WHO, Statement of the forty-second meeting of the Polio IHR Emergency Committee (28 July 2025)
  url: https://www.who.int/news/item/28-07-2025-statement-of-the-forty-second-meeting-of-the-polio-ihr-emergency-committee
  kind: press
  notes: Gives full-year 2024 totals of 99 WPV1 cases (25 Afghanistan, 74 Pakistan) and 319 cVDPV cases (304 cVDPV2,
    11 cVDPV1, 4 cVDPV3). Gives 2025 year-to-date totals of 13 WPV1 and 67 cVDPV, with no as-of date. Read 9 November 2026.
- id: owid-wpv1
  name: Our World in Data, Reported cases of paralytic polio from wild polioviruses (processed from WHO data)
  url: https://ourworldindata.org/grapher/cases-of-paralytic-polio-from-wild-polioviruses
  kind: dataset
  notes: World values for 2001 to 2023 from the CSV export, read 9 November 2026. The About section credits World Health
    Organization (2024), processed by Our World in Data, and gives 8 April 2024 as the last update. Our World in Data's
    own work is CC BY; the underlying WHO data keeps WHO's terms. WHO's own GHO data could not be reached.
- id: owid-cvdpv
  name: Our World in Data, Reported cases of paralytic polio from vaccine-derived viruses, by strain (processed from WHO data)
  url: https://ourworldindata.org/grapher/cases-of-paralytic-polio-from-vaccine-derived-viruses-by-strain
  kind: dataset
  notes: World values for VDPV1, VDPV2 and VDPV3, 2016 to 2023, from the CSV export, read 9 November 2026. The About
    section for the total-across-strains chart (archived 12 August 2026) credits WHO (2024), processed by Our World in
    Data. The totals stored in observations are our sums of the three columns. Licence and terms as for owid-wpv1.
- id: cdc-mmwr-regions
  name: CDC MMWR, article on WHO regions certified polio-free (volume 52, number 47)
  url: https://www.cdc.gov/mmwr/preview/mmwrhtml/mm5247a6.htm
  kind: report
  notes: Gives the exact dates for the Americas (20 August 1994), Western Pacific (29 October 2000) and Europe
    (21 June 2002). It is an older report, so the Eastern Mediterranean and South-East Asia statements in it are
    superseded by the sources below.
- id: emro-2023
  name: WHO EMRO, news release of 10 October 2023 on polio in the Eastern Mediterranean Region
  url: https://www.emro.who.int/media/news/member-states-urged-to-go-all-in-to-end-polio-during-meeting-of-the-regional-subcommittee-for-polio-eradication-and-outbreaks.html
  kind: press
  notes: States that endemic wild poliovirus is present only in Afghanistan and Pakistan in the region, and that the
    region has not yet been certified polio-free.
- id: who-copyright
  name: WHO copyright and licensing for WHO publications
  url: https://www.who.int/about/policies/publishing/copyright
  kind: other
  notes: Publications under CC BY-NC-SA 3.0 IGO. Commercial use needs WHO permission. Adaptations need a disclaimer
    that WHO did not create them. Credit WHO as the source.
- id: who-data-terms
  name: WHO terms and conditions for WHO data compilations, aggregations, evaluations and analyses
  url: https://www.who.int/about/policies/publishing/data-policy/terms-and-conditions
  kind: other
  notes: Data may be used for public health purposes only, not to promote a commercial enterprise, and must not be
    altered beyond minimal restyling without WHO permission. Credit is required. These terms are written for datasets
    and do not clearly cover WHO news or web text.
