- id: wpv2
  label: 'Wild poliovirus type 2 (WPV2)'
  group: Poliovirus types
  status: done
  status_detail: certification of the eradication of WPV2 in 2015
  date_done: '2015'
  source: who-wpv3-2019
  note: WHO's 2019 release gives the year only. The exact certification date is not yet sourced.
