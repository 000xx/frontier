  status_detail: Global eradication of wild poliovirus type 3 declared on World Polio Day
  date_done: '2019-10-24'
  url: https://www.who.int/news-room/feature-stories/detail/two-out-of-three-wild-poliovirus-strains-eradicated
  source: who-wpv3-2019
  note: Date of WHO's announcement, which the release says is World Polio Day.
- id: americas
  label: 'Americas'
  group: WHO regions
  status: done
  status_detail: certified as polio-free
  date_done: '1994-08-20'
  source: cdc-mmwr-regions
  note: Certification date as given in the MMWR article; the WHO South-East Asia page also gives 1994.
- id: western-pacific
  label: 'Western Pacific'
  group: WHO regions
  status: done
  status_detail: certified as polio-free
  date_done: '2000-10-29'
  source: cdc-mmwr-regions
  note: Certification date as given in the MMWR article; the WHO South-East Asia page gives 2000.
- id: europe
  label: 'Europe'
  group: WHO regions
  status: done
  status_detail: certified as polio-free
  date_done: '2002-06-21'
  source: cdc-mmwr-regions
  note: Certification date as given in the MMWR article; the WHO South-East Asia page gives 2002.
- id: south-east-asia
