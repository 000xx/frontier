events:
- date: '2025-01-17'
  kind: milestone
  title: Datroway is the first novel drug approved in 2025
  why_it_matters: The first of 46 novel approvals that year, listed by the FDA with its approval date.
  url: https://www.fda.gov/drugs/novel-drug-approvals-fda/novel-drug-approvals-2025
- date: '2025-12-30'
  kind: milestone
  title: Nereus is the last novel drug approved in 2025
  why_it_matters: Closes the 2025 list, which gives 46 approvals for the year.
  url: https://www.fda.gov/drugs/novel-drug-approvals-fda/novel-drug-approvals-2025
- date: '2022'
  kind: setback
  title: CDER approves 37 novel drugs in 2022, the lowest of the 2021 to 2025 years
  why_it_matters: A dip in the count that the next year reversed, which is why one year should not be read alone.
  url: https://www.fda.gov/drugs/novel-drug-approvals-fda/novel-drug-approvals-2022
- date: '2023'
  kind: milestone
  title: CDER approves 55 novel drugs in 2023, the highest count of the 2021 to 2025 years
  why_it_matters: The high point of the five years on this page, after the 2022 dip.
  url: https://www.fda.gov/drugs/novel-drug-approvals-fda/novel-drug-approvals-2023
