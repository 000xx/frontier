name: Validate data

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1"  # Mondays: report frontiers overdue for a check
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate frontier files
        run: python scripts/validate.py
      - name: Build the site's data file
        run: python scripts/build_site_data.py
      - name: Check that every page of the site still renders
        run: node scripts/check_site.js
